<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08090B">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<title>Cab Deck</title>
<style>
  /* Design: Cab Deck v6 "Peterbilt x Audi". Designed at 1194x834; scaled to the screen height
     and stretched in width (or the other way round) so any aspect ratio is filled edge to edge. */
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #08090B;
    color: #D6DAE0;
    font-family: "SF Pro Display", -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  @keyframes beaconSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* Console finishes (v7): dark green in the truck's colour, walnut, or the original v6 graphite.
     Only surfaces and legend colour change; layout, sizes and states stay the same. */
  :root, [data-finish="graphite"] {
    --panel-bg: radial-gradient(ellipse at 50% 0%, #15181C, #0E1013 60%, #0B0C0F);
    --console: #15171A;
    --key: linear-gradient(180deg, #24272D, #1A1C20);
    --key-pressed: linear-gradient(180deg, #2B2F36, #23262C);
    --legend: #C9CDD3;
    --track: linear-gradient(180deg, #0A0B0D, #121417);
  }
  [data-finish="green"] {
    --panel-bg: radial-gradient(ellipse at 50% 0%, #102119, #0A140F 60%, #070C09);
    --console: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.09), transparent 55%), linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.35)), repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px), linear-gradient(180deg, #153126, #0E241B 60%, #0A1B14);
    --key: linear-gradient(180deg, #2e2f33 0%, #1f2023 45%, #131416 50%, #262729 100%);
    --key-pressed: linear-gradient(180deg, #1c1d1f 0%, #2a2b2e 45%, #151618 50%, #232427 100%);
    --legend: #E4DCC4;
    --track: linear-gradient(180deg, #07100C, #0B1812);
  }
  [data-finish="walnut"] {
    --panel-bg: radial-gradient(ellipse at 50% 0%, #1E140E, #120C08 60%, #0B0805);
    --console: linear-gradient(180deg, rgba(255,255,255,.06), transparent 30%, rgba(0,0,0,.25)), repeating-linear-gradient(94deg, #3a1f14 0 3px, #4a2a1a 3px 7px, #2c160e 7px 9px, #5a3520 9px 14px), #3a1f14;
    --key: linear-gradient(180deg, #2e2f33 0%, #1f2023 45%, #131416 50%, #262729 100%);
    --key-pressed: linear-gradient(180deg, #1c1d1f 0%, #2a2b2e 45%, #151618 50%, #232427 100%);
    --legend: #F0E2C8;
    --track: linear-gradient(180deg, #120B07, #1C120B);
  }

  #stage { position: fixed; inset: 0; overflow: hidden; background: #08090B; }
  #panel {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--panel-w, 1194px);
    height: var(--panel-h, 834px);
    transform: translate(-50%, -50%) scale(var(--scale, 1));
    background: var(--panel-bg);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
  }

  /* Status plate */
  .plate-wrap { height: 46px; flex: none; display: flex; justify-content: center; align-items: center; }
  .plate-rim {
    padding: 2px;
    border-radius: 8px;
    background: linear-gradient(180deg, #F2F1EC 0%, #B9B5AB 18%, #6E6A62 46%, #3A3834 52%, #8F8A80 70%, #D8D4CC 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,.08), 0 8px 18px -6px rgba(0,0,0,.8), 0 2px 3px rgba(0,0,0,.6);
  }
  .plate {
    height: 40px;
    padding: 0 6px 0 20px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 20px;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px), linear-gradient(180deg, #9A968D, #6A665E);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.3);
  }
  .plate-group { display: flex; align-items: center; gap: 10px; }
  .plate-label { font-size: 13px; font-weight: 700; letter-spacing: .2em; color: #15140F; text-shadow: 0 1px 0 rgba(255,255,255,.35); }
  .plate-value { font-size: 14px; font-weight: 600; letter-spacing: .06em; color: #26241F; min-width: 122px; }
  .plate-sep { width: 1px; height: 24px; background: linear-gradient(180deg, transparent, #2a2825, transparent); }
  .plate-btn { width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .plate-btn > * { pointer-events: none; }
  .knob {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #5A574F, #3A3834);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 1px 2px rgba(0,0,0,.6);
  }
  .knob svg { stroke: #B9B5AB; }
  .knob.on { background: linear-gradient(180deg, #F4F3EE, #B9B5AB); }
  .knob.on svg { stroke: #15140F; }

  /* Lenses */
  .ring { flex: none; padding: 2px; border-radius: 50%; background: linear-gradient(160deg, #e6e3dc, #5a574f 50%, #2e2c29 60%, #b5b0a6); }
  .ring.big { padding: 3px; box-shadow: 0 3px 6px rgba(0,0,0,.6); }
  .lens { position: relative; overflow: hidden; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .lens svg { position: relative; }
  .glare {
    position: absolute;
    left: 15%;
    right: 15%;
    top: 5%;
    height: 40%;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.5), transparent 70%);
    pointer-events: none;
  }
  .spin { position: absolute; inset: -20%; background: conic-gradient(from 0deg, transparent 0 70%, rgba(255,255,255,.8) 85%, transparent 100%); opacity: 0; }
  .spin.on { opacity: .9; animation: beaconSpin 1.1s linear infinite; }

  /* Zones */
  #dash { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; transition: opacity .4s; }
  #dash.offline { opacity: .28; pointer-events: none; }
  #panel.setup-open #dash { visibility: hidden; }
  .main-row { flex: 1; min-height: 0; display: grid; grid-template-columns: 336fr 233fr 233fr 327fr; gap: 12px; }
  .bottom-row { height: 162px; flex: none; display: grid; grid-template-columns: 430fr 724fr; gap: 12px; }
  .zone {
    min-height: 0;
    padding: 3px;
    border-radius: 14px;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px), linear-gradient(180deg, #9A968D, #5F5B54);
    box-shadow: 0 1px 0 rgba(255,255,255,.06), 0 14px 28px -10px rgba(0,0,0,.9), 0 2px 3px rgba(0,0,0,.6);
  }
  .zone-in {
    height: 100%;
    border-radius: 11px;
    padding: 8px;
    display: grid;
    grid-template-rows: 24px repeat(3, minmax(0, 1fr));
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    background: var(--console);
    box-shadow: inset 0 2px 8px rgba(0,0,0,.7), inset 0 0 0 1px rgba(0,0,0,.6);
  }
  .zone-in.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .zone-in.strip { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px 8px; }
  .span { grid-column: 1 / -1; }
  .title-row { display: flex; align-items: center; justify-content: space-between; }
  .zone-title {
    padding: 3px 10px;
    border-radius: 3px;
    background: linear-gradient(180deg, #9C978D, #6F6B62);
    color: #15140F;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .22em;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 1px 2px rgba(0,0,0,.6);
  }

  /* Tiles */
  .tile {
    position: relative;
    min-height: 0;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    overflow: hidden;
    padding: 6px;
    transition: transform .05s;
  }
  .tile > * { pointer-events: none; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 3px; }
  .lbl { font-size: 18px; font-weight: 600; letter-spacing: .06em; color: var(--legend); text-align: center; line-height: 1.1; }
  .st { font-size: 13px; font-weight: 600; letter-spacing: .06em; }
  .hint { font-size: 12px; font-weight: 600; letter-spacing: .14em; color: #6B717A; }

  /* Segmented switches */
  .well {
    border-radius: 10px;
    background: linear-gradient(180deg, #131518, #17191D);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.7), inset 0 -1px 0 rgba(255,255,255,.04);
    padding: 6px 3px 3px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .segs {
    flex: 1;
    display: grid;
    gap: 3px;
    padding: 2px;
    border-radius: 7px;
    background: linear-gradient(180deg, #5F5B54, #8E8A82 50%, #4A4740);
    box-shadow: 0 1px 0 rgba(255,255,255,.1), 0 3px 6px rgba(0,0,0,.6);
  }
  .seg {
    position: relative;
    border-radius: 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: transform .05s;
  }
  .seg > * { pointer-events: none; }
  .seg.hidden { display: none; }

  /* Levers (v7): drag along detents or tap a position. Shown instead of segment buttons
     when SETUP → SWITCHES is LEVER. */
  .switch-wrap { flex: 1; min-height: 0; display: flex; }
  .switch-wrap > * { flex: 1; }
  [data-switch-style="lever"] .switch-wrap .segs { display: none; }
  [data-switch-style="buttons"] .switch-wrap .lever { display: none; }
  .lever {
    position: relative;
    min-height: 0;
    border-radius: 8px;
    background: var(--track);
    box-shadow: inset 0 3px 8px rgba(0,0,0,.9), inset 0 0 0 1px #000;
    cursor: grab;
    touch-action: none;
  }
  .lever > * { position: absolute; pointer-events: none; }
  .lever-mark { top: 4px; width: 96px; margin-left: -48px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .lever-mark .seg-label { letter-spacing: .06em; }
  .lever-mark.hidden, .lever-tick.hidden { display: none; }
  .lever-rail { left: var(--pad); right: var(--pad); bottom: 22px; height: 12px; border-radius: 6px; background: linear-gradient(180deg, #020403, #0a0f0c); box-shadow: inset 0 2px 4px rgba(0,0,0,.95), 0 1px 0 rgba(255,255,255,.05); }
  .lever-fill { left: var(--pad); bottom: 22px; height: 12px; border-radius: 6px; background: linear-gradient(180deg, #F6C878, #D08A2A); box-shadow: 0 0 12px rgba(240,180,96,.7); }
  .lever-tick { bottom: 14px; width: 2px; height: 28px; margin-left: -1px; background: rgba(228,220,196,.35); }
  .lever-knob {
    bottom: 2px;
    width: 52px;
    height: 52px;
    margin-left: -26px;
    border-radius: 50%;
    background: linear-gradient(160deg, #f2f1ec, #8f8a80 40%, #2e2c29 60%, #c9c5bc);
    box-shadow: 0 8px 14px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.2);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lever-knob::after {
    content: "";
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 32%, #3A3D43, #1C1E22 65%, #101114), linear-gradient(#F0B460, #F0B460);
    background-size: 100% 100%, 4px 16px;
    background-position: center, center;
    background-repeat: no-repeat;
    box-shadow: inset 0 2px 3px rgba(255,255,255,.1), inset 0 -2px 4px rgba(0,0,0,.8);
  }
  .lever.settled .lever-knob, .lever.settled .lever-fill { transition: left .18s cubic-bezier(.3,1.2,.5,1), width .18s cubic-bezier(.3,1.2,.5,1); }
  .seg-bar { position: absolute; left: 16px; right: 16px; top: 7px; height: 4px; border-radius: 2px; }
  .seg-label { font-weight: 600; letter-spacing: .06em; }
  .seg-sub { font-size: 13px; font-weight: 600; letter-spacing: .1em; }

  /* SETUP overlay */
  #setup { position: absolute; left: 14px; right: 14px; top: 72px; bottom: 14px; display: none; }
  #panel.setup-open #setup { display: block; }
  #setup .zone { height: 100%; }
  #setup .zone-in { grid-template-rows: 24px repeat(4, minmax(0, 1fr)) 64px; grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .bind { align-items: flex-start; justify-content: center; gap: 2px; padding: 8px 12px; }
  .bind .num { font-size: 22px; font-weight: 700; letter-spacing: .04em; color: #E6E8EA; font-variant-numeric: tabular-nums; }
  .bind .game { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: #6B717A; }
  .bind .what { font-size: 15px; font-weight: 700; letter-spacing: .06em; color: var(--legend); }
  .bind .act { font-size: 12px; font-weight: 600; color: #8B9199; }
  .setup-foot { display: flex; align-items: center; gap: 18px; }
  .setup-foot .hint { letter-spacing: .06em; }
  .setup-foot > .hint { flex: 1; }
  .finish { display: flex; align-items: center; gap: 8px; }
  .finish .tile { width: 88px; height: 52px; flex: none; gap: 0; }
  .finish .tile .hint { color: var(--legend); }
  .slider { display: flex; align-items: center; gap: 10px; }
  .slider input { width: 140px; accent-color: #E8A13A; }
  .back-btn { width: 180px; height: 56px; flex: none; flex-direction: row; gap: 10px; }

  #dimmer { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .3s; }
  #fs-btn {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 48px;
    height: 48px;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .45s;
  }
  #fs-btn.supported { display: flex; }
  #fs-btn.visible { opacity: .3; pointer-events: auto; }
  #fs-btn > * { pointer-events: none; }
  .fs-knob {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8f8a7f, #3a3834 70%);
    box-shadow: 0 1px 2px rgba(0,0,0,.8);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #rotate {
    display: none;
    position: fixed;
    inset: 0;
    align-items: center;
    justify-content: center;
    background: #08090B;
    font-size: 20px;
    letter-spacing: .1em;
    color: #8B9199;
  }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="stage"><div id="panel">
  <div class="plate-wrap"><div class="plate-rim"><div class="plate" id="plate"></div></div></div>
  <div id="dash"></div>
  <div id="setup"></div>
  <div id="dimmer"></div>
  <div id="fs-btn"></div>
</div></div>
<div id="rotate">ROTATE THE TABLET TO LANDSCAPE</div>
<script>
  const PANEL_W = 1194;
  const PANEL_H = 834;
  const PING_INTERVAL_MS = 2000;
  const PONG_TIMEOUT_MS = 5000;
  const RECONNECT_MIN_MS = 500;
  const RECONNECT_MAX_MS = 5000;
  const PHASE_MS = 400;
  const PENDING_TIMEOUT_MS = 3000;
  const ACTIVATE_FLASH_MS = 450;
  const FS_HIDE_MS = 3000;
  const SWIPE_MIN_PX = 60;
  const MAX_QUEUED_ERRORS = 20;
  const STORAGE = { sound: "cabDeckSound", bright: "cabDeckBright", finish: "cabDeckFinish", switchStyle: "cabDeckSwitchStyle" };
  const FINISHES = ["green", "walnut", "graphite"];
  const SWITCH_STYLES = ["lever", "buttons"];
  const LEVER_PAD = 30; // px from the track edge to the first and last detent

  // Vibration patterns in ms. Works on Android browsers; iPad has no vibration hardware.
  const HAPTIC = { tap: 12, hold: 25, button: 12, detent: 10, tick: 6, ui: 6, linkLost: [40, 60, 40] };

  const AMB = "#E8A13A", GRN = "#4FD37A", BLU = "#4C9DF0", RED = "#E2463C", ORG = "#F08A2E", MUTED = "#8B9199";
  const SVG_NS = "http://www.w3.org/2000/svg";

  const ICON = {
    arrowLeft: "M44 10L10 32l34 22V42h30V22H44z",
    arrowRight: "M40 10l34 22-34 22V42H10V22h30z",
    highBeam: "M36 14h4a18 18 0 0 1 0 36h-4z M8 22h18 M8 32h18 M8 42h18",
    hazard: "M32 10L56 52H8z M32 26v12 M32 44v1",
    engineBrake: "M20 18h24v28H20z M32 18v-8 M12 28h8 M44 28h8 M26 46v8 M38 46v8",
    diffLock: "M8 32a8 8 0 1 0 16 0a8 8 0 1 0-16 0 M40 32a8 8 0 1 0 16 0a8 8 0 1 0-16 0 M24 32h16 M26 14h12v8H26z M32 22v10",
    liftAxle: "M8 46h48 M20 46a6 6 0 1 0 .1 0 M44 46a6 6 0 1 0 .1 0 M32 38V12 M22 22l10-10 10 10",
    trailerAxle: "M10 14h30v22H10z M40 26h10v10 M8 48h48 M18 48a5 5 0 1 0 .1 0 M46 48a5 5 0 1 0 .1 0 M25 30V20 M19 24l6-6 6 6",
    beacon: "M16 40a16 16 0 0 1 32 0z M10 40h44v8H10z M32 10v6 M14 18l5 4 M50 18l-5 4",
    aux: "M10 28h44v10H10z M18 38v8 M46 38v8 M16 20l4 6 M48 20l-4 6 M32 16v8",
    horn: "M8 26h12l14-11v34L20 38H8z M42 24a10 10 0 0 1 0 16 M49 17a19 19 0 0 1 0 30",
    activate: "M9 10l-5 5 5 5 M20 4v7a4 4 0 0 1-4 4H4",
    chevronDown: "M5 9l7 8 7-8",
    chevronUp: "M5 15l7-8 7 8",
    soundOn: "M4 10v4h4l5 4V6l-5 4H4z M16 9a4 4 0 0 1 0 6 M18.5 6.5a8 8 0 0 1 0 11",
    soundOff: "M4 10v4h4l5 4V6l-5 4H4z M17 9l5 6 M22 9l-5 6",
    gear: "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z",
    fsEnter: "M4 9V4h5 M20 9V4h-5 M4 15v5h5 M20 15v5h-5",
    fsExit: "M9 4v5H4 M15 4v5h5 M9 20v-5H4 M15 20v-5h5",
  };

  // --- Model --------------------------------------------------------------

  const model = {
    online: false,
    game: { telemetry: false },
    indicators: {},
    switches: {},
    pending: {},       // switch id -> target position chosen on the panel, until the server reaches it
    pressed: new Set(),// visual keys of controls under a finger
    phase: true,       // local blink phase for UI-only blinking (reconnect lamp, pending segment)
    activateFlash: false,
    sound: readStored(STORAGE.sound, typeof navigator.vibrate !== "function") === true,
    bright: Number(readStored(STORAGE.bright, 1)) || 1,
    finish: FINISHES.includes(readStored(STORAGE.finish, "green")) ? readStored(STORAGE.finish, "green") : "green",
    switchStyle: SWITCH_STYLES.includes(readStored(STORAGE.switchStyle, "lever")) ? readStored(STORAGE.switchStyle, "lever") : "lever",
    drag: null,        // { id, frac, position } while a lever is being dragged
    setupOpen: false,
  };

  const panel = document.getElementById("panel");
  const dash = document.getElementById("dash");
  const plate = document.getElementById("plate");
  const setup = document.getElementById("setup");
  const dimmer = document.getElementById("dimmer");
  const fsButton = document.getElementById("fs-btn");
  const updaters = [];
  const activePointers = new Map(); // pointerId -> { key, ctl, kind }
  const queuedErrors = [];

  let socket = null;
  let lastPong = 0;
  let reconnectDelay = RECONNECT_MIN_MS;
  let reconnectTimer = null;
  let lastSwitches = {};
  let pendingTimers = {};

  function readStored(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (_) { return fallback; }
  }

  function writeStored(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) { /* storage unavailable */ }
  }

  // --- DOM helpers --------------------------------------------------------

  function h(tag, props, ...children) {
    const isSvg = tag === "svg" || tag === "path";
    const node = isSvg ? document.createElementNS(SVG_NS, tag) : document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value === null || value === undefined) continue;
      if (key === "style") node.style.cssText = value;
      else node.setAttribute(key, value);
    }
    for (const child of children.flat()) {
      if (child !== null && child !== undefined && child !== false) node.append(child);
    }
    return node;
  }

  function icon(path, size, viewBox, extra) {
    return h("svg", { viewBox, width: size, height: size, fill: "none", "stroke-width": extra?.strokeWidth ?? 2,
      "stroke-linecap": "round", "stroke-linejoin": "round", style: extra?.style }, h("path", { d: path }));
  }

  function lensNode(size, options = {}) {
    const lens = h("div", { class: "lens", style: `width:${size}px;height:${size}px` });
    const spin = options.spin ? h("div", { class: "spin" }) : null;
    if (spin) lens.append(spin);
    const glyph = options.icon ? icon(options.icon, options.iconSize || 32, "0 0 64 64", { strokeWidth: 3.8 }) : null;
    if (glyph) lens.append(glyph);
    lens.append(h("div", { class: "glare" }));
    const ring = h("div", { class: options.big ? "ring big" : "ring" }, lens);
    return { ring, lens, spin, glyph };
  }

  // --- Visual styles (ported from the v6 design) --------------------------

  function mix(color, percent, base = "transparent") {
    return `color-mix(in oklab, ${color} ${percent}%, ${base})`;
  }

  function lensStyle(color, level) {
    if (level === "on") {
      return {
        bg: `radial-gradient(circle at 35% 30%, #fff8e6, ${color} 45%, ${mix(color, 55, "#000")} 100%)`,
        sh: `0 0 14px ${color}, 0 0 30px ${mix(color, 45)}, inset 0 1px 2px rgba(255,255,255,.5), inset 0 -3px 6px ${mix(color, 40, "#000")}`,
      };
    }
    if (level === "dim") {
      return {
        bg: `radial-gradient(circle at 35% 30%, ${mix(color, 70, "#777")}, ${mix(color, 50, "#111")} 60%, #0e0d0c)`,
        sh: `0 0 7px ${mix(color, 35)}, inset 0 1px 2px rgba(0,0,0,.5), inset 0 -3px 6px rgba(0,0,0,.6)`,
      };
    }
    return {
      bg: "radial-gradient(circle at 35% 30%, #3E4147, #22242A 55%, #101114)",
      sh: "inset 0 2px 4px rgba(0,0,0,.7), inset 0 -3px 6px rgba(0,0,0,.6)",
    };
  }

  function applyLens(lens, color, level) {
    const style = lensStyle(color, level);
    lens.style.background = style.bg;
    lens.style.boxShadow = style.sh;
  }

  function applyTile(tile, bar, color, level, pressed) {
    const on = level === "on", dim = level === "dim";
    let shadow = "inset 0 1px 0 rgba(255,255,255,.07), inset 0 -1px 0 rgba(0,0,0,.5), 0 10px 20px -8px rgba(0,0,0,.8), 0 2px 3px rgba(0,0,0,.6)";
    if (on) shadow += `, inset 0 0 0 1.5px ${mix(color, 70)}, 0 0 36px -2px ${mix(color, 35)}, inset 0 0 50px ${mix(color, 7)}`;
    else if (dim) shadow += `, inset 0 0 0 1.5px ${mix(color, 35)}`;
    if (pressed) shadow = "inset 0 3px 10px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.22), 0 2px 4px rgba(0,0,0,.5)" + (on ? `, 0 0 36px -2px ${mix(color, 35)}` : "");
    tile.style.background = pressed ? "var(--key-pressed)" : "var(--key)";
    tile.style.boxShadow = shadow;
    tile.style.transform = pressed ? "perspective(600px) rotateX(7deg) scale(.985)" : "none";
    if (bar) {
      bar.style.background = on ? color : dim ? mix(color, 45) : "#2A2E34";
      bar.style.boxShadow = on ? `0 0 10px ${color}` : "none";
    }
  }

  function inkFor(color, level) {
    return level === "on" ? "#FFFFFF" : level === "dim" ? mix(color, 80, "#fff") : "#5E646C";
  }

  function level(name) {
    if (!model.online) return "off";
    const indicator = model.indicators[name];
    return indicator ? indicator.level : "off";
  }

  // --- Control builders ---------------------------------------------------

  function tileNode(ctl, kind, extraClass, extraStyle) {
    const tile = h("div", { class: `tile ${extraClass || ""}`, "data-ctl": ctl, "data-kind": kind, style: extraStyle });
    const bar = h("div", { class: "bar" });
    tile.append(bar);
    return { tile, bar };
  }

  function lensTile(spec) {
    const { tile, bar } = tileNode(spec.ctl, "tap");
    const lens = lensNode(48, { big: true, icon: spec.icon, spin: spec.spin });
    const state = h("div", { class: "st" });
    tile.append(lens.ring, h("div", { class: "lbl" }, spec.l1, spec.l2 ? h("br") : null, spec.l2 || ""), state);
    updaters.push(() => {
      const lvl = spec.level ? spec.level() : level(spec.indicator);
      applyTile(tile, bar, spec.color, lvl, model.pressed.has(spec.ctl));
      applyLens(lens.lens, spec.color, lvl);
      lens.glyph.setAttribute("stroke", inkFor(spec.color, lvl));
      state.textContent = lvl === "on" ? spec.onText : lvl === "dim" ? (spec.dimText || "DIM") : spec.offText;
      state.style.color = lvl === "off" ? MUTED : spec.color;
      if (lens.spin) lens.spin.classList.toggle("on", lvl === "on");
    });
    return tile;
  }

  function blinkLevel(name) {
    // An arrow lights for its own blinker or for the hazards; both carry the game's blink phase.
    const own = level(name), hazards = level("hazards");
    if (own === "on" || hazards === "on") return "on";
    if (own === "dim" || hazards === "dim") return "dim";
    return "off";
  }

  function arrowTile(ctl, label, path, indicator) {
    const { tile, bar } = tileNode(ctl, "tap");
    const lit = h("svg", { viewBox: "0 0 84 64", style: "position:absolute;inset:0;width:100%;height:100%;transition:opacity .06s;filter:drop-shadow(0 0 12px #4FD37A)" },
      h("path", { d: path, fill: "#86F2AA" }));
    const art = h("div", { style: "position:relative;width:104px;height:78px" },
      h("svg", { viewBox: "0 0 84 64", style: "position:absolute;inset:0;width:100%;height:100%" },
        h("path", { d: path, fill: "#1A2E22", stroke: "#0B140F", "stroke-width": 1 })),
      lit);
    tile.style.gap = "10px";
    tile.append(art, h("div", { class: "lbl" }, label));
    updaters.push(() => {
      const lvl = blinkLevel(indicator);
      applyTile(tile, bar, GRN, lvl, model.pressed.has(ctl));
      lit.style.opacity = { on: 1, dim: 0.35, off: 0 }[lvl];
    });
    return tile;
  }

  function segmentedSwitch(spec) {
    // spec: { id, labels, subs, size, positionsFrom }
    const row = h("div", { class: "segs" });
    const segments = spec.labels.map((label, position) => {
      const key = `${spec.id}:${position}`;
      const bar = h("div", { class: "seg-bar" });
      const text = h("div", { class: "seg-label", style: `font-size:${spec.size}px` }, label);
      const sub = h("div", { class: "seg-sub" }, spec.subs ? spec.subs[position] : "");
      const seg = h("div", { class: "seg", "data-switch": spec.id, "data-pos": position, "data-key": key }, bar, text, spec.subs ? sub : null);
      seg.style.setProperty("--key", key);
      row.append(seg);
      return { seg, bar, text, sub, key, position };
    });
    updaters.push(() => {
      const current = spec.current();
      const pending = model.pending[spec.id];
      const limit = spec.limit ? spec.limit() : spec.labels.length - 1;
      let visible = 0;
      for (const s of segments) {
        const hidden = s.position > limit;
        s.seg.classList.toggle("hidden", hidden);
        if (!hidden) visible += 1;
        const pressed = model.pressed.has(s.key);
        const isPending = pending === s.position && pending !== current;
        const active = current === s.position && !isPending && pending === undefined;
        s.seg.style.background = pressed ? "#353A42" : active ? `linear-gradient(180deg, ${mix(AMB, 16, "#22252A")}, ${mix(AMB, 8, "#191B1F")})` : "linear-gradient(180deg,#22252A,#191B1F)";
        s.seg.style.boxShadow = (pressed ? "inset 0 2px 6px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.22)" : "inset 0 1px 0 rgba(255,255,255,.05), inset 0 -1px 0 rgba(0,0,0,.4)")
          + (isPending ? `, inset 0 0 0 2px ${model.phase ? AMB : mix(AMB, 30)}` : "")
          + (active ? `, inset 0 0 30px ${mix(AMB, 6)}` : "");
        s.seg.style.transform = pressed ? "translateY(1px)" : "none";
        s.text.style.color = active ? AMB : isPending ? "#F0CF8A" : "#9AA0A8";
        s.sub.style.color = active ? mix(AMB, 70, "#fff") : "#5E646C";
        s.bar.style.background = active ? AMB : isPending ? mix(AMB, 50) : "#2A2E34";
        s.bar.style.boxShadow = active ? `0 0 10px ${AMB}` : "none";
      }
      row.style.gridTemplateColumns = `repeat(${visible}, minmax(0, 1fr))`;
    });
    return row;
  }

  function leverSwitch(spec) {
    const lever = h("div", { class: "lever settled", "data-lever": spec.id, style: `--pad:${LEVER_PAD}px` });
    const rail = h("div", { class: "lever-rail" });
    const fill = h("div", { class: "lever-fill" });
    const knob = h("div", { class: "lever-knob" });
    const marks = spec.labels.map((label, position) => {
      const text = h("div", { class: "seg-label", style: `font-size:${Math.min(spec.size, 22)}px` }, label);
      const sub = h("div", { class: "seg-sub", style: "font-size:11px" }, spec.subs ? spec.subs[position] : "");
      return { mark: h("div", { class: "lever-mark" }, text, spec.subs ? sub : null), tick: h("div", { class: "lever-tick" }), text, sub, position };
    });
    lever.append(rail, ...marks.map((m) => m.tick), fill, ...marks.map((m) => m.mark), knob);
    lever.dataset.count = String(spec.labels.length);
    const at = (frac) => `calc(${LEVER_PAD}px + (100% - ${2 * LEVER_PAD}px) * ${frac})`;
    updaters.push(() => {
      const limit = spec.limit ? spec.limit() : spec.labels.length - 1;
      lever.dataset.limit = String(limit);
      const current = spec.current();
      const pending = model.pending[spec.id];
      const drag = model.drag && model.drag.id === spec.id ? model.drag : null;
      const shown = drag ? drag.position : pending !== undefined ? pending : current;
      const frac = drag ? drag.frac : shown >= 0 ? shown / limit : 0;
      lever.classList.toggle("settled", !drag);
      for (const m of marks) {
        const hidden = m.position > limit;
        m.mark.classList.toggle("hidden", hidden);
        m.tick.classList.toggle("hidden", hidden);
        m.mark.style.left = m.tick.style.left = at(m.position / limit);
        const active = m.position === shown;
        const confirmed = active && !drag && pending === undefined;
        m.text.style.color = confirmed ? AMB : active ? "#F0CF8A" : "rgba(228,220,196,.5)";
        m.text.style.textShadow = confirmed ? `0 0 10px ${AMB}` : "none";
        m.sub.style.color = active ? "#E4DCC4" : "rgba(228,220,196,.35)";
      }
      knob.style.left = at(frac);
      knob.style.transform = drag ? "scale(1.08)" : "none";
      fill.style.width = `calc((100% - ${2 * LEVER_PAD}px) * ${frac})`;
      fill.style.opacity = shown > 0 || (drag && drag.frac > 0) ? "1" : "0";
    });
    return lever;
  }

  function switchControl(spec) {
    return h("div", { class: "switch-wrap" }, segmentedSwitch(spec), leverSwitch(spec));
  }

  function switchPosition(id) {
    const position = model.switches[id];
    return model.online && typeof position === "number" ? position : -1;
  }

  // --- Zones --------------------------------------------------------------

  function zone(title, inClass, ...children) {
    return h("div", { class: "zone" }, h("div", { class: `zone-in ${inClass || ""}` },
      h("div", { class: "span", style: "display:flex" }, h("div", { class: "zone-title" }, title)),
      ...children));
  }

  function lightsAndSignals() {
    const status = h("div", { style: "font-size:14px;font-weight:600;letter-spacing:.06em" });
    updaters.push(() => {
      const lvl = level("lights");
      status.textContent = lvl === "on" ? "LOW BEAM" : lvl === "dim" ? "PARK" : "OFF";
      status.style.color = lvl === "off" ? MUTED : AMB;
    });
    const lights = h("div", { class: "well span" },
      h("div", { style: "display:flex;align-items:center;justify-content:space-between;padding:0 8px;height:22px" },
        h("div", { style: "font-size:18px;font-weight:600;letter-spacing:.08em;color:var(--legend)" }, "LIGHTS"), status),
      switchControl({ id: "lights", labels: ["OFF", "PARK", "LOW"], subs: ["", "MARKER", "BEAM"], size: 20, current: () => switchPosition("lights") }));
    return zone("LIGHTS & SIGNALS", "",
      lights,
      arrowTile("cab_deck_btn_003", "LEFT", ICON.arrowLeft, "blinker_left"),
      arrowTile("cab_deck_btn_004", "RIGHT", ICON.arrowRight, "blinker_right"),
      lensTile({ ctl: "cab_deck_btn_002", l1: "HIGH", l2: "BEAM", color: BLU, indicator: "high_beam", icon: ICON.highBeam, onText: "ON", offText: "OFF" }),
      lensTile({ ctl: "cab_deck_btn_005", l1: "HAZARD", color: RED, indicator: "hazards", icon: ICON.hazard, onText: "ON", dimText: "ON", offText: "OFF" }));
  }

  function smallLamp(size) {
    return lensNode(size);
  }

  function engineTile() {
    const { tile, bar } = tileNode("cab_deck_btn_008", "button", "span",
      "display:grid;grid-template-columns:minmax(0,1fr) 100px;align-items:center;padding:0 8px;gap:4px");
    const ign = smallLamp(20), run = smallLamp(20);
    const ignText = h("div", { class: "st" }, "IGNITION"), runText = h("div", { class: "st" }, "RUNNING");
    const state = h("div", { class: "st" });
    const start = h("div", { style: "width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 40% 32%,#3A3D43,#1C1E22 65%,#101114);transition:transform .05s,box-shadow .05s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#E3E6EA" },
      h("div", { style: "font-size:14px;font-weight:700;letter-spacing:.12em" }, "START"),
      h("div", { style: "font-size:14px;font-weight:700;letter-spacing:.12em" }, "STOP"));
    tile.append(
      h("div", { style: "display:flex;flex-direction:column;gap:9px;align-items:flex-start" },
        h("div", { class: "lbl", style: "letter-spacing:.08em" }, "ENGINE"),
        h("div", { style: "display:flex;align-items:center;gap:6px" }, ign.ring, ignText),
        h("div", { style: "display:flex;align-items:center;gap:6px" }, run.ring, runText),
        state),
      h("div", { style: "width:100px;height:100px;padding:5px;border-radius:50%;background:linear-gradient(160deg,#f2f1ec,#8f8a80 40%,#2e2c29 60%,#c9c5bc);box-shadow:0 1px 0 rgba(255,255,255,.1),0 10px 20px -6px rgba(0,0,0,.9),0 2px 3px rgba(0,0,0,.6)" },
        h("div", { style: "width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#0c0c0b,#262522);box-shadow:inset 0 3px 8px rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center" }, start)));
    updaters.push(() => {
      const lvl = level("engine"), pressed = model.pressed.has("cab_deck_btn_008");
      applyTile(tile, bar, lvl === "on" ? GRN : AMB, lvl, pressed);
      applyLens(ign.lens, AMB, lvl === "dim" ? "on" : "off");
      applyLens(run.lens, GRN, lvl === "on" ? "on" : "off");
      ignText.style.color = lvl === "dim" ? AMB : MUTED;
      runText.style.color = lvl === "on" ? GRN : MUTED;
      state.textContent = lvl === "on" ? "RUNNING" : lvl === "dim" ? "IGNITION" : "OFF";
      state.style.color = lvl === "on" ? GRN : lvl === "dim" ? AMB : MUTED;
      start.style.transform = pressed ? "translateY(3px)" : "none";
      start.style.boxShadow = pressed ? "inset 0 3px 8px rgba(0,0,0,.8), 0 0 0 2px rgba(255,255,255,.22)" : "0 4px 0 #050505, 0 6px 8px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.1)";
    });
    return tile;
  }

  function pullKnobTile(spec) {
    // Park brake (yellow diamond) and trailer air (red octagon) push-pull knobs.
    const { tile, bar } = tileNode(spec.ctl, "tap", "", "justify-content:space-between;padding:8px 4px");
    const lamp = smallLamp(20);
    const knob = h("div", { style: "position:relative;width:68px;height:68px;transition:transform .18s cubic-bezier(.3,1.3,.5,1)" },
      spec.shape,
      h("div", { style: `position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:.08em;color:${spec.inkColor};font-weight:800;text-align:center;line-height:1.15` },

    tile.append(
      h("div", { style: "display:flex;align-items:center;align-self:stretch;justify-content:space-between" },

        lamp.ring),
      knob, state);
    updaters.push(() => {
      const lvl = level(spec.indicator), on = lvl === "on", pressed = model.pressed.has(spec.ctl);

      state.textContent = on ? spec.onText : spec.offText;
      state.style.color = on ? spec.color : MUTED;
    });
    return tile;
  }

  function airGauge() {
    const ang = (v) => -120 + Math.max(0, Math.min(150, v)) / 150 * 240;
    const face = h("div", { style: "position:relative;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 40%,#17181B,#0A0B0D 75%);box-shadow:inset 0 4px 10px rgba(0,0,0,.9),inset 0 0 0 1px #000;overflow:hidden" },
      h("div", { style: "position:absolute;inset:3px;border-radius:50%;background:conic-gradient(from -120deg,rgba(226,70,60,.85) 0 96deg,transparent 96deg)" }),
      h("div", { style: "position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#17181B,#0A0B0D 75%)" }));
    for (let v = 0; v <= 150; v += 10) {

    const digits = h("div", { style: "padding:3px 6px;border-radius:4px;background:#0A0B0D;box-shadow:inset 0 1px 3px rgba(0,0,0,.9),0 0 0 1px #2A2E34;font-family:ui-monospace,Menlo,monospace;font-size:14px;font-weight:600;text-align:center" });
    const lamp = smallLamp(20);
    const lampText = h("div", { style: "font-size:10px;font-weight:700;letter-spacing:.06em" }, "LOW AIR");
    const state = h("div", { style: "font-size:12px;font-weight:600;letter-spacing:.02em" });

      h("div", { style: "position:relative;width:112px;height:112px;border-radius:50%;padding:4px;background:linear-gradient(160deg,#f2f1ec,#8f8a80 40%,#2e2c29 60%,#c9c5bc);box-shadow:0 1px 0 rgba(255,255,255,.1),0 10px 18px -6px rgba(0,0,0,.9),0 2px 3px rgba(0,0,0,.6)" }, face),

  // --- Feedback: haptics and sound ----------------------------------------

  function haptic(pattern) {
    if (typeof navigator.vibrate !== "function") return;
    try { navigator.vibrate(pattern); } catch (_) { /* blocked without user activation */ }
  }

  let audioContext = null;
  let hornVoice = null;

  function audio() {
    if (!audioContext) {
      const Context = window.AudioContext || window.webkitAudioContext;
      if (!Context) return null;
      audioContext = new Context();
    }
    if (audioContext.state === "suspended") audioContext.resume();
    return audioContext;
  }

  function click(kind) {
    haptic(HAPTIC[kind] ?? 10);
    if (!model.sound) return;
    const c = audio();
    if (!c) return;
    const t = c.currentTime;
    const frequency = { detent: 2400, tap: 1500, hold: 1100, button: 800, ui: 1900 }[kind] || 1500;
    const length = Math.floor(c.sampleRate * 0.03);
    const buffer = c.createBuffer(1, length, c.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2);
    const source = c.createBufferSource();
    source.buffer = buffer;
    const filter = c.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = frequency;
    filter.Q.value = kind === "detent" ? 3 : 1.4;
    const gain = c.createGain();
    gain.gain.setValueAtTime(kind === "detent" ? 0.3 : 0.4, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + (kind === "detent" ? 0.04 : 0.07));
    source.connect(filter); filter.connect(gain); gain.connect(c.destination);
    source.start(t);
    if (kind === "detent") return;
    const thump = c.createOscillator();
    thump.type = "sine";
    thump.frequency.setValueAtTime(kind === "button" ? 120 : 160, t);
    thump.frequency.exponentialRampToValueAtTime(50, t + 0.07);
    const thumpGain = c.createGain();
    thumpGain.gain.setValueAtTime(kind === "button" ? 0.3 : 0.18, t);
    thumpGain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    thump.connect(thumpGain); thumpGain.connect(c.destination);
    thump.start(t); thump.stop(t + 0.12);
  }

  function hornOn() {
    if (!model.sound || hornVoice) return;
    const c = audio();
    if (!c) return;
    const gain = c.createGain();
    gain.gain.setValueAtTime(0.0001, c.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.12, c.currentTime + 0.08);
    const filter = c.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 900;
    filter.connect(gain); gain.connect(c.destination);
    const oscillators = [110, 165, 220].map((f) => {
      const o = c.createOscillator();
      o.type = "sawtooth"; o.frequency.value = f; o.connect(filter); o.start();
      return o;
    });
    hornVoice = { oscillators, gain };
  }

  function hornOff() {
    if (!hornVoice) return;
    const { oscillators, gain } = hornVoice;
    gain.gain.setTargetAtTime(0.0001, audioContext.currentTime, 0.04);
    oscillators.forEach((o) => o.stop(audioContext.currentTime + 0.25));
    hornVoice = null;
  }

  // --- Rendering ----------------------------------------------------------

  let renderQueued = false;
  function render() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => {
      renderQueued = false;
      dash.classList.toggle("offline", !model.online);
      dimmer.style.opacity = String((1 - model.bright) * 0.8);
      for (const update of updaters) update();
    });
  }

  setInterval(() => {
    model.phase = !model.phase;
    render();
  }, PHASE_MS);

  function fit() {
    // Scale by the tighter side, then stretch the other side to fill the screen exactly.
    const scale = Math.min(window.innerWidth / PANEL_W, window.innerHeight / PANEL_H);
    panel.style.setProperty("--scale", String(scale));
    panel.style.setProperty("--panel-w", `${Math.max(PANEL_W, window.innerWidth / scale)}px`);
    panel.style.setProperty("--panel-h", `${Math.max(PANEL_H, window.innerHeight / scale)}px`);
  }
  window.addEventListener("resize", fit);

  // --- Connection ---------------------------------------------------------

  function connect() {
    reconnectTimer = null;
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${scheme}://${location.host}/ws`);
    socket = ws;
    ws.onopen = () => {
      lastPong = Date.now();
      reconnectDelay = RECONNECT_MIN_MS;
      model.online = true;
      flushErrors();
      render();
    };
    ws.onmessage = (event) => handleMessage(event.data);
    ws.onclose = () => dropSocket(ws);
    ws.onerror = () => dropSocket(ws);
  }

  function dropSocket(ws) {
    if (socket !== ws) return;
    socket = null;
    ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null;
    try { ws.close(); } catch (_) { /* already closed */ }
    releaseAllLocal(false);
    if (model.online) haptic(HAPTIC.linkLost);
    model.online = false;
    model.pending = {};
    render();
    if (reconnectTimer === null) {
      reconnectTimer = setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, RECONNECT_MAX_MS);
    }
  }

  function isOnline() {
    return socket !== null && socket.readyState === WebSocket.OPEN;
  }

  function send(message) {
    if (isOnline()) socket.send(JSON.stringify(message));
  }

  function handleMessage(data) {
    const message = JSON.parse(data);
    if (message.type === "pong") lastPong = Date.now();
    else if (message.type === "layout") buildSetup(message.bindings || []);
    else if (message.type === "state") applyState(message);
    render();
  }

  function applyState(state) {
    model.game = state.game || { telemetry: false };
    model.indicators = state.indicators || {};
    model.switches = state.switches || {};
    for (const [id, position] of Object.entries(model.switches)) {
      // One tick per detent the switch actually passes.
      if (lastSwitches[id] !== undefined && lastSwitches[id] !== position) haptic(HAPTIC.tick);
      if (model.pending[id] === position) clearPending(id);
    }
    lastSwitches = model.switches;
  }

  function setPending(id, position) {
    clearTimeout(pendingTimers[id]);
    model.pending[id] = position;
    pendingTimers[id] = setTimeout(() => { clearPending(id); render(); }, PENDING_TIMEOUT_MS);
  }

  function clearPending(id) {
    clearTimeout(pendingTimers[id]);
    delete model.pending[id];
  }

  setInterval(() => {
    if (!isOnline()) return;
    if (Date.now() - lastPong > PONG_TIMEOUT_MS) {
      dropSocket(socket);
      return;
    }
    send({ type: "ping" });
  }, PING_INTERVAL_MS);

  // --- Touch --------------------------------------------------------------

  function keyInUse(key) {
    for (const entry of activePointers.values()) if (entry.key === key) return true;
    return false;
  }

  panel.addEventListener("pointerdown", (event) => {
    if (event.button > 0) return;
    showFullscreenButton();
    const target = event.target;

    if (target.closest("#sound-btn")) {
      event.preventDefault();
      model.sound = !model.sound;
      writeStored(STORAGE.sound, model.sound);
      haptic(HAPTIC.ui);
      if (model.sound) click("ui");
      render();
      return;
    }
    if (target.closest("#setup-btn")) {
      event.preventDefault();
      setSetupOpen(!model.setupOpen);
      return;
    }
    if (target.closest("#fs-btn")) {
      event.preventDefault();
      toggleFullscreen();
      return;
    }
    if (target.closest("#plate")) {
      event.preventDefault();
      plateSwipe = { x: event.clientX };
      return;
    }

    const lever = target.closest("[data-lever]");
    if (lever) {
      if (!isOnline()) return;
      event.preventDefault();
      try { lever.setPointerCapture(event.pointerId); } catch (_) { /* pointer already gone */ }
      activePointers.set(event.pointerId, { key: `lever:${lever.dataset.lever}`, kind: "lever", lever });
      model.drag = { id: lever.dataset.lever, frac: 0, position: -1 };
      moveLever(lever, event.clientX);
      return;
    }

    const segment = target.closest("[data-switch]");
    const tile = target.closest("[data-ctl]");
    if (!segment && !tile) return;
    if (!isOnline()) return;
    event.preventDefault();
    const node = segment || tile;
    try { node.setPointerCapture(event.pointerId); } catch (_) { /* pointer already gone */ }

    if (segment) {
      const id = segment.dataset.switch, position = Number(segment.dataset.pos);
      activePointers.set(event.pointerId, { key: segment.dataset.key, kind: "seg" });
      model.pressed.add(segment.dataset.key);
      click("detent");
      if (position !== model.switches[id]) setPending(id, position);
      else clearPending(id);
      send({ id, event: "set", position });
      render();
      return;
    }

    const ctl = tile.dataset.ctl, kind = tile.dataset.kind;
    if (kind === "bind") {
      activePointers.set(event.pointerId, { key: ctl, kind });
      model.pressed.add(ctl);
      click("tap");
      send({ type: "bind", key: tile.dataset.key });
      render();
      return;
    }
    if (kind === "ui") {
      activePointers.set(event.pointerId, { key: ctl, kind });
      model.pressed.add(ctl);
      if (tile.dataset.setting) {
        model[tile.dataset.setting] = tile.dataset.option;
        writeStored(STORAGE[tile.dataset.setting], tile.dataset.option);
        applyFinish();
        click("ui");
      }
      render();
      return;
    }

    const alreadyPressed = keyInUse(ctl);
    activePointers.set(event.pointerId, { key: ctl, ctl, kind });
    model.pressed.add(ctl);
    if (!alreadyPressed) {
      click(kind);
      send({ id: ctl, event: "down" });
      if (ctl === "cab_deck_btn_007") hornOn();
      if (ctl === "cab_deck_btn_023") {
        model.activateFlash = true;
        setTimeout(() => { model.activateFlash = false; render(); }, ACTIVATE_FLASH_MS);
      }
    }
    render();
  });

  // --- Levers -------------------------------------------------------------

  function moveLever(lever, clientX) {
    // Pointer position -> fraction of the detent span; works under the panel's CSS scale.
    const rect = lever.getBoundingClientRect();
    const pad = LEVER_PAD * rect.width / lever.offsetWidth;
    const limit = Number(lever.dataset.limit);
    const frac = Math.max(0, Math.min(1, (clientX - rect.left - pad) / (rect.width - 2 * pad)));
    const position = Math.round(frac * limit);
    if (position !== model.drag.position) click("detent"); // one click per detent passed
    model.drag = { id: lever.dataset.lever, frac, position };
    render();
  }

  panel.addEventListener("pointermove", (event) => {
    const entry = activePointers.get(event.pointerId);
    if (entry && entry.kind === "lever" && model.drag) moveLever(entry.lever, event.clientX);
  });

  function releaseLever(commit) {
    const drag = model.drag;
    model.drag = null;
    if (!drag || !commit || drag.position < 0) return;
    if (drag.position !== model.switches[drag.id]) setPending(drag.id, drag.position);
    else clearPending(drag.id);
    send({ id: drag.id, event: "set", position: drag.position });
  }

  function endPointer(event) {
    if (event.type === "pointerup") enterImmersive();
    if (plateSwipe) {
      const dx = event.clientX - plateSwipe.x;
      plateSwipe = null;
      // Swipe left along the plate opens SETUP, swipe right closes it.
      if (event.type === "pointerup" && Math.abs(dx) >= SWIPE_MIN_PX) setSetupOpen(dx < 0);
      return;
    }
    const entry = activePointers.get(event.pointerId);
    if (!entry) return;
    activePointers.delete(event.pointerId);
    if (entry.kind === "lever") {
      // Only a finished drag sets the switch; a cancelled gesture leaves it where it was.
      releaseLever(event.type === "pointerup");
      render();
      return;
    }
    if (keyInUse(entry.key)) return;
    model.pressed.delete(entry.key);
    if (entry.ctl) {
      send({ id: entry.ctl, event: "up" });
      if (entry.ctl === "cab_deck_btn_007") hornOff();
    }
    if (entry.key === "setup:back" && event.type === "pointerup") setSetupOpen(false);
    render();
  }

  let plateSwipe = null;
  for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
    panel.addEventListener(type, endPointer);
  }

  function releaseAllLocal(notifyServer) {
    model.drag = null;
    const entries = [...activePointers.values()];
    activePointers.clear();
    model.pressed.clear();
    const sent = new Set();
    for (const entry of entries) {
      if (entry.ctl && notifyServer && !sent.has(entry.ctl)) {
        send({ id: entry.ctl, event: "up" });
        sent.add(entry.ctl);
      }
    }
    hornOff();
    render();
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") releaseAllLocal(true);
  });
  window.addEventListener("pagehide", () => releaseAllLocal(true));
  document.addEventListener("contextmenu", (event) => event.preventDefault());
  document.addEventListener("gesturestart", (event) => event.preventDefault());

  // --- Fullscreen ---------------------------------------------------------

  const fsSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  const fsPath = h("path", { d: ICON.fsEnter });
  fsButton.append(h("div", { class: "fs-knob" },
    h("svg", { viewBox: "0 0 24 24", width: 14, height: 14, fill: "none", stroke: "#D6DAE0", "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }, fsPath)));
  fsButton.classList.toggle("supported", fsSupported);
  let fsHideTimer = null;

  function showFullscreenButton() {
    if (!fsSupported) return;
    fsButton.classList.add("visible");
    clearTimeout(fsHideTimer);
    fsHideTimer = setTimeout(() => fsButton.classList.remove("visible"), FS_HIDE_MS);
  }

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  // The first tap makes the panel fullscreen and keeps the screen awake. Done on pointerup,
  // which still counts as a user gesture, so it never interferes with the press itself.
  let skipAutoFullscreen = false;
  function enterImmersive() {
    requestWakeLock();
    if (!fsSupported || isFullscreen() || skipAutoFullscreen) return;
    const root = document.documentElement;
    const request = root.requestFullscreen || root.webkitRequestFullscreen;
    try {
      const result = request.call(root);
      if (result && result.catch) result.catch(() => { /* refused; the hidden button still works */ });
    } catch (_) { /* refused; the hidden button still works */ }
  }

  let wakeLock = null;
  async function requestWakeLock() {
    // Only available in a secure context (HTTPS or an installed app via the Chrome flag in README).
    if (wakeLock || !("wakeLock" in navigator) || !window.isSecureContext) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } catch (_) { wakeLock = null; }
  }

  function toggleFullscreen() {
    // Leaving fullscreen with the button means the user wants the browser back: stop auto re-entering.
    skipAutoFullscreen = isFullscreen();
    const d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen).call(d.documentElement);
  }

  function onFullscreenChange() {
    fsPath.setAttribute("d", document.fullscreenElement || document.webkitFullscreenElement ? ICON.fsExit : ICON.fsEnter);
    fit();
  }
  document.addEventListener("fullscreenchange", onFullscreenChange);
  document.addEventListener("webkitfullscreenchange", onFullscreenChange);

  // --- Error reporting ----------------------------------------------------

  function reportError(text) {
    const message = String(text).slice(0, 1000);
    if (isOnline()) send({ type: "client_error", message });
    else if (queuedErrors.length < MAX_QUEUED_ERRORS) queuedErrors.push(message);
  }

  function flushErrors() {
    while (queuedErrors.length > 0) send({ type: "client_error", message: queuedErrors.shift() });
  }

  window.addEventListener("error", (event) => {
    reportError(`${event.message} at ${event.filename}:${event.lineno}:${event.colno} | ${navigator.userAgent}`);
  });
  window.addEventListener("unhandledrejection", (event) => {
    reportError(`Unhandled rejection: ${event.reason} | ${navigator.userAgent}`);
  });

  // --- Start --------------------------------------------------------------

  applyFinish();
  buildPlate();
  buildDash();
  fit();
  render();
  connect();
</script>
</body>
</html>
