<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1216">
<title>Cab Deck</title>
<style>
  :root {
    --bg: #0f1216;
    --surface-top: #252b34;
    --surface: #1a1f26;
    --segment: #12161b;
    --text: #e6e9ee;
    --muted: #7d8794;
    --ok: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
    --gap: 14px;
    --radius: 18px;
  }
  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px var(--gap);
    font-size: 13px;
    color: var(--muted);
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bad);
    box-shadow: 0 0 8px var(--bad);
  }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  #game-dot { margin-left: 14px; }
  #pages { flex: 1; min-height: 0; display: flex; }
  .page {
    flex: 1;
    display: none;
    gap: var(--gap);
    padding: 0 var(--gap) var(--gap);
    min-height: 0;
  }
  .page.shown { display: grid; }
  body:not(.online) #pages { opacity: 0.35; }
  #tabs {
    display: flex;
    gap: var(--gap);
    padding: 0 var(--gap) var(--gap);
  }
  #tabs:empty, #tabs.single { display: none; }
  .tab {
    flex: 1;
    padding: 12px 0;
    border-radius: 12px;
    background: var(--surface);
    color: var(--muted);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-align: center;
  }
  .tab.shown { background: var(--surface-top); color: var(--text); box-shadow: inset 0 -3px 0 var(--text); }

  .btn.gauge { gap: 4px; }
  .gauge .value { font-size: clamp(30px, 7vh, 58px); font-weight: 700; font-variant-numeric: tabular-nums; pointer-events: none; }
  .gauge .unit { font-size: 0.4em; color: var(--muted); margin-left: 4px; }
  .gauge .bar { width: 80%; height: 10px; border-radius: 5px; background: var(--segment); overflow: hidden; pointer-events: none; }
  .gauge .fill { height: 100%; width: 0; background: var(--ok); transition: width 200ms; }
  .gauge.warning .fill { background: var(--warn); }
  .gauge.emergency .fill { background: var(--bad); }
  .gauge.emergency .value { color: var(--bad); }
  .segment.unavailable { display: none; }

  .tab.setup-tab { flex: 0 0 110px; }
  .page.setup { grid-template-columns: repeat(6, 1fr); grid-auto-rows: 1fr; }
  .bind {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    padding: 8px 12px;
    min-height: 0;
    border-radius: 14px;
    background: var(--surface);
    box-shadow: inset 0 -3px 0 #3a414c;
    transition: background 80ms, transform 60ms;
  }
  .bind > * { pointer-events: none; }
  .bind .num { font-size: clamp(18px, 3.4vh, 28px); font-weight: 800; font-variant-numeric: tabular-nums; }
  .bind .game { font-size: 12px; color: var(--muted); }
  .bind .what { font-size: clamp(12px, 1.9vh, 15px); font-weight: 700; }
  .bind .action { font-size: 12px; color: var(--muted); }
  .bind.fired { background: var(--warn); transform: translateY(2px); }
  .bind.fired .num, .bind.fired .what, .bind.fired .game, .bind.fired .action { color: #0f1216; }

  .btn {
    --c: #8b949e;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 0;
    overflow: hidden;
    border-radius: var(--radius);
    background: linear-gradient(180deg, var(--surface-top), var(--surface));
    box-shadow: inset 0 -4px 0 var(--c), 0 3px 8px rgba(0, 0, 0, 0.45);
    transition: transform 60ms, box-shadow 120ms;
  }
  /* Game state overlay: tinted with the button colour. */
  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--c);
    opacity: 0;
    transition: opacity 120ms;
    pointer-events: none;
  }
  .btn.lvl-dim::before { opacity: 0.14; }
  .btn.lvl-on::before { opacity: 0.32; }
  .btn.lvl-on { box-shadow: inset 0 0 0 2px var(--c), 0 0 20px var(--c); }
  .btn > * { position: relative; }
  .btn .icon { font-size: clamp(28px, 7vh, 60px); line-height: 1; pointer-events: none; }
  .btn .label {
    font-size: clamp(13px, 2.6vh, 22px);
    font-weight: 600;
    text-align: center;
    padding: 0 8px;
    pointer-events: none;
  }
  .btn .sub {
    min-height: 1.2em;
    font-size: clamp(11px, 1.8vh, 15px);
    color: var(--muted);
    pointer-events: none;
  }
  .btn.lvl-dim .sub, .btn.lvl-on .sub { color: var(--text); }
  .btn.hold { outline: 2px dashed rgba(255, 255, 255, 0.12); outline-offset: -8px; }
  .btn.hold::after {
    content: "HOLD";
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .btn.active {
    transform: translateY(3px);
    box-shadow: 0 0 22px var(--c);
  }
  .btn.active::before { opacity: 0.85; }
  .btn.active .label, .btn.active .sub { color: #0f1216; }

  .btn.switch { justify-content: space-between; padding: 12px 10px 10px; gap: 4px; }
  .btn.switch .head { display: flex; align-items: center; gap: 8px; pointer-events: none; }
  .btn.switch .icon { font-size: clamp(22px, 4.5vh, 40px); }
  .segments { display: flex; gap: 6px; width: 100%; flex: 1; max-height: 56%; }
  .segment {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: var(--segment);
    font-size: clamp(13px, 2.4vh, 20px);
    font-weight: 700;
    color: var(--muted);
    transition: background 80ms, color 80ms;
  }
  .segment.current { background: var(--c); color: #0f1216; box-shadow: 0 0 12px var(--c); }
  .segment.pending { outline: 2px solid var(--c); color: var(--text); }
  .segment.pressed { transform: translateY(2px); }

  #rotate {
    display: none;
    position: fixed;
    inset: 0;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-size: 20px;
    color: var(--muted);
  }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="status">
  <span id="link-dot" class="dot"></span><span id="link-text">CONNECTING…</span>
  <span id="game-dot" class="dot"></span><span id="game-text">GAME: NO DATA</span>
</div>
<div id="pages"></div>
<nav id="tabs"></nav>
<div id="rotate">Rotate the tablet to landscape</div>
<script>
  const PING_INTERVAL_MS = 2000;
  const PONG_TIMEOUT_MS = 5000;
  const RECONNECT_MIN_MS = 500;
  const RECONNECT_MAX_MS = 5000;
  const TAP_FLASH_MS = 120;
  const MAX_QUEUED_ERRORS = 20;
  const PAGE_STORAGE_KEY = "cabDeckPage";
  const SWIPE_MIN_PX = 60;
  const BIND_FLASH_MS = 250;

  // Vibration patterns in ms. Works on Android browsers; iPad has no vibration hardware.
  const HAPTIC = {
    tap: 12,
    hold: 25,
    segment: 10,
    detent: 6,
    tab: 6,
    linkLost: [40, 60, 40],
  };

  const deck = document.getElementById("pages");
  const tabs = document.getElementById("tabs");
  const linkDot = document.getElementById("link-dot");
  const linkText = document.getElementById("link-text");
  const gameDot = document.getElementById("game-dot");
  const gameText = document.getElementById("game-text");
  const activePointers = new Map(); // pointerId -> button element
  const queuedErrors = [];

  let socket = null;
  let lastPong = 0;
  let reconnectDelay = RECONNECT_MIN_MS;
  let reconnectTimer = null;
  let wasOnline = false;
  let lastSwitches = {};

  function haptic(pattern) {
    if (typeof navigator.vibrate !== "function") return;
    try { navigator.vibrate(pattern); } catch (_) { /* blocked without user activation */ }
  }

  // --- Connection ---------------------------------------------------------

  function connect() {
    reconnectTimer = null;
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${scheme}://${location.host}/ws`);
    socket = ws;
    ws.onopen = () => {
      lastPong = Date.now();
      reconnectDelay = RECONNECT_MIN_MS;
      setOnline(true);
      flushErrors();
    };
    ws.onmessage = (event) => handleMessage(event.data);
    ws.onclose = () => dropSocket(ws);
    ws.onerror = () => dropSocket(ws);
  }

  function dropSocket(ws) {
    if (socket !== ws) return;
    socket = null;
    ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null;
    try { ws.close(); } catch (_) { /* already closed */ }
    releaseAllLocal(false);
    setOnline(false);
    applyState({ game: { telemetry: false }, indicators: {}, switches: {} });
    if (reconnectTimer === null) {
      reconnectTimer = setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, RECONNECT_MAX_MS);
    }
  }

  function isOnline() {
    return socket !== null && socket.readyState === WebSocket.OPEN;
  }

  function send(message) {
    if (isOnline()) socket.send(JSON.stringify(message));
  }

  function setOnline(online) {
    if (wasOnline && !online) haptic(HAPTIC.linkLost);
    wasOnline = online;
    document.body.classList.toggle("online", online);
    linkDot.className = online ? "dot ok" : "dot";
    linkText.textContent = online ? "CONNECTED" : "RECONNECTING…";
  }

  function handleMessage(data) {
    const message = JSON.parse(data);
    if (message.type === "pong") lastPong = Date.now();
    else if (message.type === "layout") renderLayout(message);
    else if (message.type === "state") applyState(message);
  }

  setInterval(() => {
    if (!isOnline()) return;
    if (Date.now() - lastPong > PONG_TIMEOUT_MS) {
      dropSocket(socket);
      return;
    }
    send({ type: "ping" });
  }, PING_INTERVAL_MS);

  // --- Layout -------------------------------------------------------------

  function renderLayout(layout) {
    const pageNodes = layout.pages.map((page) => {
      const node = el("div", "page");
      node.style.gridTemplateColumns = `repeat(${page.grid.cols}, 1fr)`;
      node.style.gridTemplateRows = `repeat(${page.grid.rows}, 1fr)`;
      node.append(...page.buttons.map(createControl));
      return node;
    });
    const tabNodes = layout.pages.map((page, index) => {
      const tab = el("div", "tab", page.label);
      tab.dataset.page = String(index);
      return tab;
    });
    if (layout.bindings && layout.bindings.length) {
      pageNodes.push(createSetupPage(layout.bindings));
      const tab = el("div", "tab setup-tab", "SETUP");
      tab.dataset.page = String(tabNodes.length);
      tabNodes.push(tab);
    }
    deck.replaceChildren(...pageNodes);
    tabs.replaceChildren(...tabNodes);
    tabs.classList.toggle("single", pageNodes.length < 2);
    showPage(Math.min(storedPage(), pageNodes.length - 1));
  }

  function storedPage() {
    try { return Number(localStorage.getItem(PAGE_STORAGE_KEY)) || 0; } catch (_) { return 0; }
  }

  function showPage(index) {
    deck.querySelectorAll(".page").forEach((page, i) => page.classList.toggle("shown", i === index));
    tabs.querySelectorAll(".tab").forEach((tab, i) => tab.classList.toggle("shown", i === index));
    try { localStorage.setItem(PAGE_STORAGE_KEY, String(index)); } catch (_) { /* storage unavailable */ }
  }

  function currentPage() {
    return [...deck.querySelectorAll(".page")].findIndex((page) => page.classList.contains("shown"));
  }

  function goToPage(index) {
    const count = deck.querySelectorAll(".page").length;
    if (index < 0 || index >= count || index === currentPage()) return;
    releaseAllLocal(true);
    haptic(HAPTIC.tab);
    showPage(index);
  }

  // Tap a tab to open it; swipe along the tab bar to step through pages (SETUP is last).
  // Swiping is limited to the tab bar so a swipe can never start on a control and press it.
  let swipeStart = null;
  tabs.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    // Keep receiving the pointer even if the finger leaves the bar mid-swipe.
    tabs.setPointerCapture(event.pointerId);
    swipeStart = { x: event.clientX, tab: event.target.closest(".tab") };
  });
  tabs.addEventListener("pointerup", (event) => {
    if (!swipeStart) return;
    const dx = event.clientX - swipeStart.x;
    const tab = swipeStart.tab;
    swipeStart = null;
    if (Math.abs(dx) >= SWIPE_MIN_PX) goToPage(currentPage() + (dx < 0 ? 1 : -1));
    else if (tab) goToPage(Number(tab.dataset.page));
  });
  tabs.addEventListener("pointercancel", () => { swipeStart = null; });

  // --- Setup page ---------------------------------------------------------

  function createSetupPage(bindings) {
    const page = el("div", "page setup");
    for (const binding of bindings) {
      const item = el("div", "bind");
      item.dataset.key = binding.key;
      const part = binding.part === "forward" ? " ▶" : binding.part === "back" ? " ◀" : "";
      item.append(
        el("span", "num", `vJoy ${binding.number}`),
        el("span", "game", `game Button ${binding.number - 1}`),
        el("span", "what", binding.label + part),
        el("span", "action", binding.action || ""),
      );
      page.append(item);
    }
    return page;
  }

  deck.addEventListener("pointerdown", (event) => {
    const item = event.target.closest(".bind");
    if (!item || !isOnline()) return;
    event.preventDefault();
    haptic(HAPTIC.tap);
    item.classList.add("fired");
    setTimeout(() => item.classList.remove("fired"), BIND_FLASH_MS);
    send({ type: "bind", key: item.dataset.key });
  });

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function createControl(config) {
    const button = el("div", `btn ${config.type}`);
    button.dataset.id = config.id;
    button.dataset.type = config.type;
    if (config.indicator) button.dataset.indicator = config.indicator;
    button.style.setProperty("--c", config.color);
    button.setAttribute("role", "button");

    if (config.type === "switch") {
      const head = el("div", "head");
      head.append(el("span", "icon", config.icon), el("span", "label", config.label));
      const segments = el("div", "segments");
      config.positions.forEach((name, index) => {
        const segment = el("div", "segment", name);
        segment.dataset.position = String(index);
        segments.append(segment);
      });
      button.append(head, segments);
      return button;
    }

    if (config.type === "gauge") {
      button.dataset.min = String(config.min);
      button.dataset.max = String(config.max);
      const value = el("span", "value", "—");
      const bar = el("div", "bar");
      bar.append(el("div", "fill"));
      button.append(el("span", "label", config.label), value, bar);
      return button;
    }

    button.append(el("span", "icon", config.icon), el("span", "label", config.label), el("span", "sub", ""));
    return button;
  }

  // --- Game state ---------------------------------------------------------

  function applyState(state) {
    const game = state.game || {};
    if (!game.telemetry) {
      gameDot.className = "dot";
      gameText.textContent = "GAME: NO TELEMETRY";
    } else if (!game.active) {
      gameDot.className = "dot warn";
      gameText.textContent = "GAME: NOT RUNNING";
    } else if (game.paused) {
      gameDot.className = "dot warn";
      gameText.textContent = "GAME: PAUSED";
    } else {
      gameDot.className = "dot ok";
      gameText.textContent = "GAME: IN CAB";
    }

    const indicators = state.indicators || {};
    for (const button of deck.querySelectorAll(".btn[data-indicator]")) {
      const indicator = indicators[button.dataset.indicator];
      if (button.dataset.type === "gauge") {
        applyGauge(button, indicator);
        continue;
      }
      const level = indicator ? indicator.level : "none";
      button.classList.toggle("lvl-dim", level === "dim");
      button.classList.toggle("lvl-on", level === "on");
      const sub = button.querySelector(".sub");
      if (sub) sub.textContent = indicator && indicator.text ? indicator.text : "";
      if (button.dataset.type === "switch") hideUnavailable(button, indicator);
    }

    const switches = state.switches || {};
    for (const button of deck.querySelectorAll(".btn.switch")) {
      const position = switches[button.dataset.id];
      // One tick per detent the switch actually passes.
      if (button.closest(".page.shown") && lastSwitches[button.dataset.id] !== undefined && position !== lastSwitches[button.dataset.id]) {
        haptic(HAPTIC.detent);
      }
      for (const segment of button.querySelectorAll(".segment")) {
        const isCurrent = Number(segment.dataset.position) === position;
        segment.classList.toggle("current", isCurrent);
        if (isCurrent) segment.classList.remove("pending");
      }
    }
    lastSwitches = switches;
  }

  function applyGauge(button, indicator) {
    const value = button.querySelector(".value");
    const fill = button.querySelector(".fill");
    button.classList.remove("warning", "emergency");
    if (!indicator) {
      value.textContent = "—";
      fill.style.width = "0";
      return;
    }
    const min = Number(button.dataset.min);
    const max = Number(button.dataset.max);
    const ratio = Math.max(0, Math.min(1, (indicator.value - min) / (max - min)));
    value.textContent = Math.round(indicator.value);
    value.append(el("span", "unit", indicator.unit || ""));
    fill.style.width = `${ratio * 100}%`;
    if (indicator.state === "warning" || indicator.state === "emergency") button.classList.add(indicator.state);
  }

  function hideUnavailable(button, indicator) {
    // Trucks differ in retarder steps; hide positions this truck does not have.
    const max = indicator && indicator.max ? indicator.max : Infinity;
    for (const segment of button.querySelectorAll(".segment")) {
      segment.classList.toggle("unavailable", Number(segment.dataset.position) > max);
    }
  }

  // --- Touch --------------------------------------------------------------

  function pointersOn(button) {
    let count = 0;
    for (const target of activePointers.values()) if (target === button) count += 1;
    return count;
  }

  function tapSegment(segment) {
    const button = segment.closest(".btn");
    for (const other of button.querySelectorAll(".segment")) other.classList.remove("pending");
    if (!segment.classList.contains("current")) segment.classList.add("pending");
    segment.classList.add("pressed");
    setTimeout(() => segment.classList.remove("pressed"), TAP_FLASH_MS);
    haptic(HAPTIC.segment);
    send({ id: button.dataset.id, event: "set", position: Number(segment.dataset.position) });
  }

  deck.addEventListener("pointerdown", (event) => {
    const button = event.target.closest(".btn");
    if (!button || !isOnline()) return;
    event.preventDefault();

    if (button.dataset.type === "gauge") return;
    if (button.dataset.type === "switch") {
      const segment = event.target.closest(".segment");
      if (segment) tapSegment(segment);
      return;
    }

    button.setPointerCapture(event.pointerId);
    const alreadyPressed = pointersOn(button) > 0;
    activePointers.set(event.pointerId, button);
    button.classList.add("active");
    if (!alreadyPressed) {
      haptic(button.dataset.type === "hold" ? HAPTIC.hold : HAPTIC.tap);
      send({ id: button.dataset.id, event: "down" });
    }
  });

  function endPointer(event) {
    const button = activePointers.get(event.pointerId);
    if (!button) return;
    activePointers.delete(event.pointerId);
    if (pointersOn(button) > 0) return;
    send({ id: button.dataset.id, event: "up" });
    const delay = button.dataset.type === "tap" ? TAP_FLASH_MS : 0;
    setTimeout(() => { if (pointersOn(button) === 0) button.classList.remove("active"); }, delay);
  }

  for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
    deck.addEventListener(type, endPointer);
  }

  function releaseAllLocal(notifyServer) {
    const buttons = new Set(activePointers.values());
    activePointers.clear();
    for (const button of buttons) {
      if (notifyServer) send({ id: button.dataset.id, event: "up" });
      button.classList.remove("active");
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") releaseAllLocal(true);
  });
  window.addEventListener("pagehide", () => releaseAllLocal(true));
  document.addEventListener("contextmenu", (event) => event.preventDefault());
  document.addEventListener("gesturestart", (event) => event.preventDefault());

  // --- Error reporting ----------------------------------------------------

  function reportError(text) {
    const message = String(text).slice(0, 1000);
    if (isOnline()) send({ type: "client_error", message });
    else if (queuedErrors.length < MAX_QUEUED_ERRORS) queuedErrors.push(message);
  }

  function flushErrors() {
    while (queuedErrors.length > 0) send({ type: "client_error", message: queuedErrors.shift() });
  }

  window.addEventListener("error", (event) => {
    reportError(`${event.message} at ${event.filename}:${event.lineno}:${event.colno} | ${navigator.userAgent}`);
  });
  window.addEventListener("unhandledrejection", (event) => {
    reportError(`Unhandled rejection: ${event.reason} | ${navigator.userAgent}`);
  });

  connect();
</script>
</body>
</html>
