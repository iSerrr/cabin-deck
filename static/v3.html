function pressable(el, onPress) {
  el.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    el.classList.add("pressed");
    onPress(event);
  });
  for (const type of ["pointerup", "pointercancel", "pointerleave"]) el.addEventListener(type, () => el.classList.remove("pressed"));
}

document.getElementById("binds").addEventListener("pointerdown", (event) => {
  const tile = event.target.closest(".bind");
  if (!tile || !isOnline()) return;
  event.preventDefault();
  tile.classList.add("pressed");
  click("tap");
  send({ type: "bind", key: tile.dataset.key });
  const clear = () => tile.classList.remove("pressed");
  tile.addEventListener("pointerup", clear, { once: true });
  tile.addEventListener("pointercancel", clear, { once: true });
});
pressable(document.getElementById("back-btn"), () => setSetupOpen(false));
pressable(document.getElementById("fs-btn"), () => toggleFullscreen());

function setSetupOpen(open) {
  if (model.setupOpen === open) return;
  releaseAllLocal(true);
  model.setupOpen = open;
  setupEl.classList.toggle("open", open);
  haptic(HAPTIC.ui);
  render();
}

// ===========================================================================
// Feedback: haptics and sound
// ===========================================================================

function haptic(pattern) {
  if (typeof navigator.vibrate !== "function") return;
  try { navigator.vibrate(pattern); } catch (_) { /* blocked without user activation */ }
}

let audioContext = null, hornVoice = null;
function audio() {
  if (!audioContext) {
    const Context = window.AudioContext || window.webkitAudioContext;
    if (!Context) return null;
    audioContext = new Context();
  }
  if (audioContext.state === "suspended") audioContext.resume();
  return audioContext;
}

function click(kind) {
  haptic(HAPTIC[kind] ?? 10);
  if (!model.sound) return;
  const c = audio();
  if (!c) return;
  const t = c.currentTime;
  const frequency = { detent: 2400, toggle: 3200, tap: 1500, hold: 1100, button: 800, ui: 1900 }[kind] || 1500;
  const length = Math.floor(c.sampleRate * 0.03);
  const buffer = c.createBuffer(1, length, c.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2);
  const source = c.createBufferSource();
  source.buffer = buffer;
  const filter = c.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = frequency;
  filter.Q.value = kind === "detent" ? 3 : 1.4;
  const gain = c.createGain();
  gain.gain.setValueAtTime(kind === "detent" ? 0.3 : 0.4, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + (kind === "detent" ? 0.04 : 0.07));
  source.connect(filter); filter.connect(gain); gain.connect(c.destination);
  source.start(t);
  if (kind === "detent") return;
  const thump = c.createOscillator();
  thump.type = "sine";
  thump.frequency.setValueAtTime(kind === "button" ? 120 : 160, t);
  thump.frequency.exponentialRampToValueAtTime(50, t + 0.07);
  const thumpGain = c.createGain();
  thumpGain.gain.setValueAtTime(kind === "button" ? 0.3 : 0.18, t);
  thumpGain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  thump.connect(thumpGain); thumpGain.connect(c.destination);
  thump.start(t); thump.stop(t + 0.12);
}

function hornOn() {
  if (!model.sound || hornVoice) return;
  const c = audio();
  if (!c) return;
  const gain = c.createGain();
  gain.gain.setValueAtTime(0.0001, c.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.12, c.currentTime + 0.08);
  const filter = c.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 900;
  filter.connect(gain); gain.connect(c.destination);
  const oscillators = [110, 165, 220].map((f) => {
    const o = c.createOscillator();
    o.type = "sawtooth"; o.frequency.value = f; o.connect(filter); o.start();
    return o;
  });
  hornVoice = { oscillators, gain };
}

function hornOff() {
  if (!hornVoice) return;
  const { oscillators, gain } = hornVoice;
  gain.gain.setTargetAtTime(0.0001, audioContext.currentTime, 0.04);
  oscillators.forEach((o) => o.stop(audioContext.currentTime + 0.25));
  hornVoice = null;
}

// ===========================================================================
// Connection
// ===========================================================================

function connect() {
  reconnectTimer = null;
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${scheme}://${location.host}/ws`);
  socket = ws;
  ws.onopen = () => {
    lastPong = Date.now();
    reconnectDelay = RECONNECT_MIN_MS;
    model.online = true;
    flushErrors();
    render();
  };
  ws.onmessage = (event) => handleMessage(event.data);
  ws.onclose = () => dropSocket(ws);
  ws.onerror = () => dropSocket(ws);
}

function dropSocket(ws) {
  if (socket !== ws) return;
  socket = null;
  ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null;
  try { ws.close(); } catch (_) { /* already closed */ }
  releaseAllLocal(false);
  if (model.online) haptic(HAPTIC.linkLost);
  model.online = false;
  model.pending = {};
  render();
  if (reconnectTimer === null) {
    reconnectTimer = setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, RECONNECT_MAX_MS);
  }
}

function isOnline() {
  if (DEMO) return model.online;
  return socket !== null && socket.readyState === WebSocket.OPEN;
}

function send(message) {
  if (DEMO) { demo.receive(message); return; }
  if (isOnline()) socket.send(JSON.stringify(message));
}

function handleMessage(data) {
  const message = JSON.parse(data);
  if (message.type === "pong") lastPong = Date.now();
  else if (message.type === "layout") buildSetup(message.bindings || []);
  else if (message.type === "state") applyState(message);
  render();
}

function applyState(state) {
  model.game = state.game || { telemetry: false };
  model.indicators = state.indicators || {};
  model.switches = state.switches || {};
  for (const [id, position] of Object.entries(model.switches)) {
    // one tick per detent the switch actually passes
    if (lastSwitches[id] !== undefined && lastSwitches[id] !== position) haptic(HAPTIC.tick);
    if (model.pending[id] === position) clearPending(id);
  }
  lastSwitches = model.switches;
}

function setPending(id, position) {
  clearTimeout(pendingTimers[id]);
  model.pending[id] = position;
  pendingTimers[id] = setTimeout(() => { clearPending(id); render(); }, PENDING_TIMEOUT_MS);
}

function clearPending(id) {
  clearTimeout(pendingTimers[id]);
  delete model.pending[id];
}

setInterval(() => {
  if (DEMO || !isOnline()) return;
  if (Date.now() - lastPong > PONG_TIMEOUT_MS) { dropSocket(socket); return; }
  send({ type: "ping" });
}, PING_INTERVAL_MS);

// ===========================================================================
// Touch: a ray from the finger finds the touch area under it
// ===========================================================================

const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();
const hitPoint = new THREE.Vector3();

function aim(event) {
  const rect = canvas.getBoundingClientRect();
  pointerNdc.set(((event.clientX - rect.left) / rect.width) * 2 - 1, -((event.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(pointerNdc, camera);
}

function pick(event) {
  aim(event);
  const found = raycaster.intersectObjects(hits, false)[0];
  return found ? found.object.userData : null;
}

// Where the finger meets the plane z (in layout coordinates).
function pointOnPlane(event, z) {
  aim(event);
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -z);
  if (!raycaster.ray.intersectPlane(plane, hitPoint)) return null;
  return { x: hitPoint.x + W / 2, y: H / 2 - hitPoint.y };
}

function keyInUse(key) {
  for (const entry of activePointers.values()) if (entry.key === key) return true;
  return false;
}

let plateSwipe = null;

canvas.addEventListener("pointerdown", (event) => {
  if (event.button > 0) return;
  const target = pick(event);
  if (!target) return;
  event.preventDefault();

  if (target.type === "ui") {
    if (target.action === "sound") {
      model.sound = !model.sound;
      writeStored(STORAGE.sound, model.sound);
      haptic(HAPTIC.ui);
      if (model.sound) click("ui");
    } else {
      setSetupOpen(!model.setupOpen);
    }
    // registered after the action: opening SETUP releases every press
    const key = `ui:${target.action}`;
    model.pressed.add(key);
    activePointers.set(event.pointerId, { key, kind: "ui" });
    render();
    return;
  }
  if (target.type === "plate") {
    plateSwipe = { x: event.clientX, pointerId: event.pointerId };
    return;
  }
  if (model.setupOpen || !isOnline()) return;
  try { canvas.setPointerCapture(event.pointerId); } catch (_) { /* pointer already gone */ }

  if (target.type === "slide") {
    activePointers.set(event.pointerId, { key: `slide:${target.id}`, kind: "slide", target });
    model.drag = { id: target.id, x: target.x0, position: -1 };
    moveSlide(activePointers.get(event.pointerId), event);
    return;
  }

  if (target.type === "switch") {
    const position = target.pos();
    activePointers.set(event.pointerId, { key: target.key, kind: "switch" });
    model.pressed.add(target.key);
    click(target.toggle ? "toggle" : "detent");
    if (position !== model.switches[target.id]) setPending(target.id, position);
    else clearPending(target.id);
    send({ id: target.id, event: "set", position });
    render();
    return;
  }

  const { ctl, kind } = target;
  const alreadyPressed = keyInUse(ctl);
  activePointers.set(event.pointerId, { key: ctl, ctl, kind });
  model.pressed.add(ctl);
  if (!alreadyPressed) {
    click(target.toggle ? "toggle" : kind);
    if (target.onPress) target.onPress();
    send({ id: ctl, event: "down" });
    if (ctl === "cab_deck_btn_007") hornOn();
    if (ctl === "cab_deck_btn_023") {
      model.activateFlash = true;
      setTimeout(() => { model.activateFlash = false; render(); }, ACTIVATE_FLASH_MS);
    }
  }
  render();
});

function moveSlide(entry, event) {
  // finger position along the slot, clamped to the end stops, snapped to the nearest detent
  const { x0, x1, count } = entry.target;
  const p = pointOnPlane(event, Z_WELL);
  if (!p) return;
  const x = Math.max(x0, Math.min(x1, p.x));
  const position = Math.round((x - x0) / (x1 - x0) * (count - 1));
  if (position !== model.drag.position) click("detent");   // one click per detent passed
  model.drag = { id: entry.target.id, x, position };
  render();
}

canvas.addEventListener("pointermove", (event) => {
  const entry = activePointers.get(event.pointerId);
  if (entry && entry.kind === "slide" && model.drag) moveSlide(entry, event);
});

function releaseSlide(commit) {
  const drag = model.drag;
  model.drag = null;
  if (!drag || !commit || drag.position < 0) return;
  if (drag.position !== model.switches[drag.id]) setPending(drag.id, drag.position);
  else clearPending(drag.id);
  send({ id: drag.id, event: "set", position: drag.position });
}

function endPointer(event) {
  if (event.type === "pointerup") enterImmersive();
  if (plateSwipe && plateSwipe.pointerId === event.pointerId) {
    const dx = event.clientX - plateSwipe.x;
    plateSwipe = null;
    // swipe left along the plate opens SETUP, swipe right closes it
    if (event.type === "pointerup" && Math.abs(dx) >= SWIPE_MIN_PX) setSetupOpen(dx < 0);
    return;
  }
  const entry = activePointers.get(event.pointerId);
  if (!entry) return;
  activePointers.delete(event.pointerId);
  if (entry.kind === "slide") {
    // only a finished gesture sets the switch; a cancelled one leaves it where it was
    releaseSlide(event.type === "pointerup");
    render();
    return;
  }
  if (keyInUse(entry.key)) return;
  model.pressed.delete(entry.key);
  if (entry.ctl) {
    send({ id: entry.ctl, event: "up" });
    if (entry.ctl === "cab_deck_btn_007") hornOff();
  }
  render();
}

for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) canvas.addEventListener(type, endPointer);

function releaseAllLocal(notifyServer) {
  model.drag = null;
  const entries = [...activePointers.values()];
  activePointers.clear();
  model.pressed.clear();
  const sent = new Set();
  for (const entry of entries) {
    if (entry.ctl && notifyServer && !sent.has(entry.ctl)) {
      send({ id: entry.ctl, event: "up" });
      sent.add(entry.ctl);
    }
  }
  hornOff();
  render();
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") releaseAllLocal(true);
  else invalidate();
});
window.addEventListener("pagehide", () => releaseAllLocal(true));
document.addEventListener("contextmenu", (event) => event.preventDefault());
document.addEventListener("gesturestart", (event) => event.preventDefault());

// ===========================================================================
// Fullscreen and wake lock
// ===========================================================================

const fsSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
let skipAutoFullscreen = false;

function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }

// The first tap makes the panel fullscreen. Done on pointerup, which still counts as a user
// gesture, so it never interferes with the press itself.
function enterImmersive() {
  requestWakeLock();
  if (!fsSupported || isFullscreen() || skipAutoFullscreen) return;
  const root = document.documentElement;
  const request = root.requestFullscreen || root.webkitRequestFullscreen;
  try {
    const result = request.call(root, { navigationUI: "hide" });
    if (result && result.catch) result.catch(() => { /* refused; SETUP has a button */ });
  } catch (_) { /* refused; SETUP has a button */ }
}

function toggleFullscreen() {
  // leaving fullscreen with the button means the user wants the browser back: stop auto re-entering
  skipAutoFullscreen = isFullscreen();
  const d = document;
  if (isFullscreen()) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen).call(d.documentElement);
}

let wakeLock = null;
async function requestWakeLock() {
  // only in a secure context (HTTPS or the Chrome flag described in README)
  if (wakeLock || !("wakeLock" in navigator) || !window.isSecureContext) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (_) { wakeLock = null; }
}

// ===========================================================================
// Error reporting
// ===========================================================================

function reportError(text) {
  const message = String(text).slice(0, 1000);
  if (isOnline() && !DEMO) send({ type: "client_error", message });
  else if (queuedErrors.length < MAX_QUEUED_ERRORS) queuedErrors.push(message);
}

function flushErrors() {
  while (queuedErrors.length > 0) send({ type: "client_error", message: queuedErrors.shift() });
}

window.addEventListener("error", (event) => {
  reportError(`v3: ${event.message} at ${event.filename}:${event.lineno}:${event.colno} | ${navigator.userAgent}`);
});
window.addEventListener("unhandledrejection", (event) => {
  reportError(`v3: unhandled rejection: ${event.reason} | ${navigator.userAgent}`);
});

// ===========================================================================
// Demo (?demo): a local stand-in for the server so the look can be checked without the game.
// It never opens a socket, so nothing can be pressed on the PC.
// ===========================================================================

const demo = {
  st: { lights: 1, wipers: 0, high: false, left: false, right: false, hazards: false, engine: "on", park: false, trailer: true,
    beacon: false, auxF: 0, auxR: 0, air: 104, fuel: 410, clock: 2 * 1440 + 14 * 60 + 5, phase: false },
  start() {
    model.online = true;
    buildSetup([
      { key: "lights:forward", number: 1, label: "LIGHTS", part: "forward", action: "Light modes" },
      { key: "cab_deck_btn_002", number: 2, label: "HIGH BEAM", action: "High beam" },
      { key: "cab_deck_btn_003", number: 3, label: "LEFT", action: "Left blinker" },
    ]);
    setInterval(() => {
      const st = this.st;
      st.phase = !st.phase;
      st.air = Math.max(40, Math.min(125, st.air + (st.engine === "on" ? 1.6 : -.4)));
      st.clock += 1;
      this.push();
    }, 500);
    this.push();
  },
  receive(message) {
    const st = this.st;
    if (message.event === "set") {
      setTimeout(() => { st[message.id] = message.position; this.push(); }, 250);
      return;
    }
    if (message.event !== "down") return;
    const flips = {
      cab_deck_btn_002: () => { st.high = !st.high; },
      cab_deck_btn_003: () => { st.left = !st.left; st.right = false; },
      cab_deck_btn_004: () => { st.right = !st.right; st.left = false; },
      cab_deck_btn_005: () => { st.hazards = !st.hazards; },
      cab_deck_btn_008: () => { st.engine = { off: "dim", dim: "on", on: "off" }[st.engine]; },
      cab_deck_btn_009: () => { st.park = !st.park; },
      cab_deck_btn_010: () => { st.trailer = !st.trailer; },
      cab_deck_btn_020: () => { st.beacon = !st.beacon; },
      cab_deck_btn_021: () => { st.auxF = (st.auxF + 1) % 3; },
      cab_deck_btn_022: () => { st.auxR = (st.auxR + 1) % 3; },
    };
    if (flips[message.id]) { flips[message.id](); this.push(); }
  },
  push() {
    const st = this.st, on = (v) => ({ level: v ? "on" : "off" });
    const blink = (v) => ({ level: v ? (st.phase ? "on" : "dim") : "off" });
    const aux = (v) => ({ level: ["off", "dim", "on"][v] });
    applyState({
      type: "state",
      game: { telemetry: true, active: true, paused: false },
      switches: { lights: st.lights, wipers: st.wipers },
      indicators: {
        engine: { level: st.engine }, lights: { level: ["off", "dim", "on"][st.lights] }, high_beam: on(st.high),
        blinker_left: blink(st.left), blinker_right: blink(st.right), hazards: blink(st.hazards),
        park_brake: on(st.park), wipers: on(st.wipers > 0), trailer: on(st.trailer), beacon: on(st.beacon),
        aux_front: aux(st.auxF), aux_roof: aux(st.auxR),
        air_pressure: { level: "off", value: st.air, state: st.air < 60 ? "warning" : "ok" },
        fuel: { value: st.fuel, capacity: 568, range_km: 1330, avg_l_per_km: .31, state: "ok" },
        nav: {
          distance_m: 412000, time_s: 5 * 3600 + 1200, rest_min: 312, rest_range_km: 410, clock_min: st.clock,
          deadline_min: 1260, planned_km: 1180, destination: "Sacramento",
          plan: { day: 2, days: 3, done_km: 210, target_km: 420, ahead_km: 24, past_km: [380], next_km: [390], required_kmh: 61, late: false },
        },
      },
    });
    render();
  },
};

// ===========================================================================
// Start
// ===========================================================================

// The console swings up into view once, as if the screen were lifted into place.
function powerOn() {
  const endZ = camera.position.z;
  camera.position.set(0, -H * .5, endZ * 1.15);
  camera.lookAt(0, 0, 0);
  tween(camera.position, { y: 0, z: endZ, duration: 1.8, delay: .2, ease: "power3.inOut", onUpdate: () => camera.lookAt(0, 0, 0) });
}

async function start() {
  Object.assign(window.cabDeck3d, { model, camera, gsap, renderer, composer });   // for debugging from the console
  // dial numbers and cap legends are painted with the panel font, so wait for it
  try { await document.fonts.load(`700 20px ${CSS_FONT}`); } catch (_) { /* fall back to Arial */ }
  resize();
  powerOn();
  if (DEMO) demo.start(); else connect();
  // let troika lay out the text before the boot curtain lifts
  setTimeout(() => document.getElementById("boot").classList.add("gone"), 600);
}

start().catch((err) => {
  reportError(`v3 start failed: ${err && err.stack || err}`);
  document.getElementById("boot").innerHTML = `THE 3D PANEL FAILED TO START<a href="/">OPEN THE CLASSIC PANEL</a>`;
});
</script>
