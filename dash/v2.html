<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#04090A">
<title>Alpha Gen Dash v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@300;500;700&display=swap" rel="stylesheet">
<!-- keeps the screen awake: native Wake Lock where allowed, else a tiny looping muted video (no HTTPS needed) -->
<script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
<style>
  /* Alpha Gen v2: speed and rpm scales run round the outline of two rounded boxes,
     from the bottom centre outwards, up the outer side and back along the top.
     WebGL2 draws the scales, then a bloom pass turns their glow into light; HTML only draws text.
     Live data comes from server.py over /ws/dash; without the game it runs a demo drive. */
  :root { --cream: #E4DCC4; --mint: #77E4ED; --amber: #FFB547; --red: #FF4A3A; --blue: #6FB6FF; --dim: rgba(228,220,196,.28); }
  html, body { margin: 0; height: 100%; background: #04090A; overflow: hidden; }
  /* overlay mode (?overlay): transparent page over the game; text gets a dark edge so it reads on a bright road */
  html.overlay, html.overlay body { background: transparent; }
  html.shaped .demo { display: none; }   /* it sits above the silhouette */
  html.overlay .ov { filter: drop-shadow(0 1px 2px rgba(0,0,0,.85)); }
  /* overlay edit mode, toggled by the overlay app: drag to move, wheel or +/- to resize, arrows to nudge.
     Dragging is done in script, not with -webkit-app-region: on Windows a drag region swallows the wheel. */
  body.edit { cursor: move; }
  body.edit #stage { outline: 2px dashed var(--mint); outline-offset: -2px; }
  body.edit::after { content: "DRAG TO MOVE · WHEEL OR +/− TO RESIZE · ARROWS TO NUDGE · CTRL+SHIFT+F10 TO SAVE"; position: fixed; left: 50%; top: 8px; transform: translateX(-50%); padding: 4px 10px; border-radius: 6px; background: rgba(4,9,10,.85); color: var(--mint); font: 700 11px/1 sans-serif; letter-spacing: .12em; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Saira Semi Condensed", "Arial Narrow", sans-serif; color: var(--cream);
    -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  #stage { position: relative; --u: 1px; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ov { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; line-height: 1; pointer-events: none; font-variant-numeric: tabular-nums; }
  .ov.lft { transform: translate(0, -50%); }
  .ov.rgt { transform: translate(-100%, -50%); }

  .num { font-size: calc(var(--u) * 3.8); font-weight: 500; color: var(--dim); transition: color .15s, text-shadow .15s; }
  .num.on { color: var(--cream); text-shadow: 0 0 calc(var(--u) * .8) rgba(119,228,237,.55); }
  .num.hot { color: rgba(255,74,58,.45); }
  .num.hot.on { color: var(--red); text-shadow: 0 0 calc(var(--u) * .8) rgba(255,74,58,.7); }
  .tag { font-size: calc(var(--u) * 2.2); font-weight: 700; letter-spacing: .3em; color: var(--dim); }

  .speed { font-size: calc(var(--u) * 42); font-weight: 500; transform: translate(-50%, -50%) skewX(-6deg); text-shadow: 0 0 calc(var(--u) * 2.5) rgba(119,228,237,.35); }
  .unit { font-size: calc(var(--u) * 2.6); font-weight: 700; letter-spacing: .4em; color: var(--dim); }
  .gear { font-size: calc(var(--u) * 8.6); font-weight: 600; color: var(--cream); text-shadow: 0 0 calc(var(--u) * 1.2) rgba(119,228,237,.35); }
  /* D / N / R: the current one sits in a lit box */
  .dnr { display: flex; gap: calc(var(--u) * .4); padding: calc(var(--u) * .3); border-radius: calc(var(--u) * .8); box-shadow: inset 0 0 0 1px rgba(228,220,196,.12); }
  .dnr span { width: calc(var(--u) * 3.8); text-align: center; padding: calc(var(--u) * .35) 0; border-radius: calc(var(--u) * .5); font-size: max(10px, calc(var(--u) * 2.1)); font-weight: 700; color: rgba(228,220,196,.3); }
  /* manual box: the shift knob's pattern under the gear plate, in place of D / N / R */
  .hpat { display: none; align-items: center; gap: calc(var(--u) * 1.4); }
  .manual .hpat { display: flex; }
  .manual .dnr { display: none; }
  .hp-grid { position: relative; display: grid; grid-template-columns: repeat(3, calc(var(--u) * 7)); grid-template-rows: repeat(2, calc(var(--u) * 3.7));
    column-gap: calc(var(--u) * 1.8); row-gap: calc(var(--u) * 1.2); }
  /* the speed gives the pattern some room: a little smaller and lower */
  .manual .speed { font-size: calc(var(--u) * 36); transform: translate(-50%, -42%) skewX(-6deg); }
  .hp-grid svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .hp-grid line { stroke: rgba(228,220,196,.22); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .hp-cell { position: relative; display: flex; align-items: center; justify-content: center; gap: .3em; border-radius: calc(var(--u) * .6);
    background: #0a1a1c; box-shadow: inset 0 0 0 1px rgba(228,220,196,.14); font-size: max(11px, calc(var(--u) * 2.5)); font-weight: 700; color: rgba(228,220,196,.3); }
  .hp-cell b { font-weight: 700; }
  .hp-cell.on { color: rgba(228,220,196,.25); box-shadow: inset 0 0 0 1px var(--mint), 0 0 calc(var(--u) * 1.4) -0.15em var(--mint); }
  .hp-cell b.act { color: var(--cream); text-shadow: 0 0 calc(var(--u) * .7) rgba(119,228,237,.8); }
  .hp-sel { display: flex; flex-direction: column; gap: calc(var(--u) * .5); align-items: center; }
  .hp-sel i { font-style: normal; font-size: max(7px, calc(var(--u) * 1.1)); letter-spacing: .25em; color: var(--dim); font-weight: 700; }
  .hp-sel span { min-width: calc(var(--u) * 3.6); text-align: center; padding: calc(var(--u) * .3) calc(var(--u) * .4); border-radius: calc(var(--u) * .5);
    font-size: max(10px, calc(var(--u) * 2)); font-weight: 700; color: rgba(228,220,196,.3); box-shadow: inset 0 0 0 1px rgba(228,220,196,.1); }
  .hp-sel span.on { color: #0a1a1c; background: var(--mint); box-shadow: 0 0 calc(var(--u) * 1.2) -0.1em var(--mint); }
  .hp-sel.split span.on { background: var(--amber); box-shadow: 0 0 calc(var(--u) * 1.2) -0.1em var(--amber); }
  .gear small { font-size: .45em; margin-left: .08em; color: var(--amber); vertical-align: .9em; }
  .dnr span.on { color: var(--cream); box-shadow: inset 0 0 0 1px var(--mint), 0 0 calc(var(--u) * 1.2) -0.2em var(--mint); text-shadow: 0 0 calc(var(--u) * .6) rgba(119,228,237,.6); }
  /* cruise line: icon, name and the set speed; dim while cruise is off */
  .cruise { display: flex; align-items: center; gap: .55em; font-size: max(12px, calc(var(--u) * 2.9)); font-weight: 700; letter-spacing: .14em; color: var(--mint); opacity: .3; transition: opacity .2s; }
  .cruise.on { opacity: 1; text-shadow: 0 0 calc(var(--u) * .8) rgba(119,228,237,.5); }
  .cruise svg { width: 2em; height: 2em; fill: none; stroke: var(--cream); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .cruise b { margin-left: .5em; font-size: 1.9em; font-weight: 600; letter-spacing: 0; color: var(--mint); }
  .cruise small { font-size: .8em; letter-spacing: .1em; color: var(--dim); align-self: flex-end; margin-bottom: .15em; }
  .demo { font-size: max(7px, calc(var(--u) * 1.2)); font-weight: 700; letter-spacing: .35em; color: var(--dim); }
  /* readouts with an icon: a caption over a value (bottom plate), or caption + value on one row (side panels) */
  .ico { width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); fill: none; stroke: var(--cream); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
  .stat { display: flex; align-items: center; gap: calc(var(--u) * 1.2); }
  .stat-cap { font-size: max(9px, calc(var(--u) * 1.7)); font-weight: 700; letter-spacing: .2em; color: var(--dim); }
  .stat-val { font-size: max(14px, calc(var(--u) * 3.7)); font-weight: 600; color: var(--cream); }
  .stat-val small { font-size: .62em; color: var(--dim); margin-left: .25em; }
  /* bottom plate row: items take their own width, 16 px either side of each divider */
  .stats { display: flex; align-items: center; gap: 16px; }
  .rule { flex: none; width: 1px; height: calc(var(--u) * 7); background: rgba(228,220,196,.18); }
  /* US speed limit sign: black on white, shown only while the game knows the limit */
  .limit {
    display: none; flex-direction: column; align-items: center; padding: calc(var(--u) * .6) calc(var(--u) * .9) calc(var(--u) * .3);
    border-radius: calc(var(--u) * .7); background: #F2F0EA; color: #111;
    box-shadow: inset 0 0 0 calc(var(--u) * .3) #F2F0EA, inset 0 0 0 calc(var(--u) * .55) #111;
    font-weight: 800; line-height: 1; transition: box-shadow .2s;
  }
  .limit.on { display: flex; }
  .limit span { font-size: max(7px, calc(var(--u) * 1.25)); letter-spacing: .06em; }
  .limit b { font-size: calc(var(--u) * 5.4); font-weight: 800; margin-top: calc(var(--u) * .2); }
  .limit.over { box-shadow: inset 0 0 0 calc(var(--u) * .3) #F2F0EA, inset 0 0 0 calc(var(--u) * .55) #111, 0 0 0 calc(var(--u) * .35) var(--red), 0 0 calc(var(--u) * 2.4) var(--red); }
  .sub { font-size: max(9px, calc(var(--u) * 1.8)); font-weight: 600; letter-spacing: .04em; color: var(--dim); margin-left: .4em; }

  .cap { display: flex; align-items: center; gap: calc(var(--u) * 1.1); font-size: max(9px, calc(var(--u) * 1.8)); font-weight: 700; letter-spacing: .22em; color: var(--dim); }
  .cap .ico { width: calc(var(--u) * 3.2); height: calc(var(--u) * 3.2); }
  .val { font-size: max(10px, calc(var(--u) * 2.6)); font-weight: 600; color: var(--cream); }
  .val small { font-size: .62em; color: var(--dim); margin-left: .25em; }
  .val.hot { color: var(--red); }

  .blink { width: calc(var(--u) * 5); height: calc(var(--u) * 5); opacity: .14; transition: opacity .06s; }
  .blink path { fill: var(--mint); }
  .blink.on { opacity: 1; filter: drop-shadow(0 0 calc(var(--u) * 1) rgba(119,228,237,.9)); }

  /* lamps sit beside D / N / R and show only while lit */
  .tt-row { display: flex; gap: calc(var(--u) * .8); }
  .tt-row.lft { transform: translate(-100%, -50%); }
  .tt-row.rgt { transform: translate(0, -50%); }
  .tt {
    display: none; padding: calc(var(--u) * .5) calc(var(--u) * 1); border: 1px solid; border-radius: calc(var(--u) * .6);
    font-size: max(9px, calc(var(--u) * 1.6)); font-weight: 700; letter-spacing: .2em;
  }
  .tt.on { display: block; color: var(--c); border-color: var(--c); box-shadow: 0 0 calc(var(--u) * 1.4) -0.2em var(--c), inset 0 0 calc(var(--u) * 1) -0.3em var(--c); text-shadow: 0 0 calc(var(--u) * .8) var(--c); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
</div>

<script id="vert" type="x-shader/x-vertex">#version 300 es
in vec2 aPos;
out vec2 vUv;
void main() {
  vUv = aPos * .5 + .5;
  gl_Position = vec4(aPos, 0., 1.);
}
</script>

<script id="scene-frag" type="x-shader/x-fragment">#version 300 es
// Scene pass: draws the gauges without any glow. Alpha says how strongly each pixel glows;
// the bloom passes turn that into light, so glow never stops at a hard edge.
precision highp float;

uniform vec2 uRes;
uniform vec4 uBar;              // speed 0..1, rpm 0..1, cruise mark, speed limit on the speed scale (-1 = none)
uniform vec4 uMini;             // air, fuel, oil, water as 0..1
uniform vec2 uMini2;            // battery, oil temperature as 0..1
uniform highp sampler2D uField; // baked outline: arc length, signed distance (+ inside), inside flag
uniform vec4 uFieldBox;         // local x0, y0, width, height covered by the field
uniform float uLT;              // total arc length of the outline
uniform vec3 uEnds;             // inner start x, inner end x, inner end y (local)
uniform float uOverlay;         // 1 when drawn over the game: no console background
uniform vec2 uPeb[64];          // pebble form: right half of the silhouette, top centre round to bottom centre
uniform int uPebN;              // its point count; 0 = the usual silhouette
uniform float uGearY;           // centre of the gear plate: its top lies level with the scale ends

layout(location = 0) out vec4 outColor;   // colour, alpha = glow amount for the bloom
layout(location = 1) out vec4 outCover;   // how opaque the pixel is, for the transparent overlay

// palette built on the brand accent #0D2426 (deep teal, hue ~185)
const vec3 G0 = vec3(.024, .043, .047);   // #060B0C  darkest console
const vec3 G1 = vec3(.035, .100, .106);   // #091A1B
const vec3 G2 = vec3(.051, .141, .149);   // #0D2426  brand accent
const vec3 G3 = vec3(.071, .192, .204);   // #123134  lit surfaces
const vec3 MINT = vec3(.47, .89, .93);    // #77E4ED  glow, same hue
const vec3 CREAM = vec3(.894, .863, .769); // #E4DCC4 legend cream
const vec3 RED = vec3(1., .29, .23);
const vec3 BLUE = vec3(.33, .62, 1.);
// tachometer: the diesel's working band, where to hold the engine and shift (rpm / 2500)
const vec2 ECO = vec2(1100. / 2500., 1500. / 2500.);
const vec3 SATIN = vec3(.58, .63, .6);

const float GX = .575;   // gauge origin, mirrored for the left gauge
const float SHAPE_MARGIN = .014;   // silhouette: this far outside the gauges' outer edge
const float BAND = .028; // scale centre line, this far inside the outline
const float GAP = .0035; // half width of the divider between scale sections
const float PANEL = .158; // inner panel frame, this far inside the outline (clear of the numbers)

float PX;
float EM;   // glow amount of the current pixel
float COV;  // coverage of the current pixel (overlay mode)

void cover(float m) { COV = max(COV, m); }

void paint(inout vec3 col, vec3 c, float m, float glow) {
  col = mix(col, c, m);
  EM = mix(EM, glow, m);
  cover(m);
}

bool isHot(float t, vec2 warn) { return t < warn.x || t > warn.y; }

vec3 zoneCol(float t, vec2 warn) {
  return isHot(t, warn) ? RED : mix(MINT, CREAM, smoothstep(.15, 1., t) * .55);
}

// Bilinear lookup by hand: 32-bit float textures are not filterable on every phone.
vec3 field(vec2 q) {
  vec2 uv = (q - uFieldBox.xy) / uFieldBox.zw;
  if (uv.x < 0. || uv.y < 0. || uv.x > 1. || uv.y > 1.) return vec3(0., -1., 0.);
  vec2 size = vec2(textureSize(uField, 0));
  vec2 f = uv * size - .5;
  ivec2 i = ivec2(floor(f)), hi = ivec2(size) - 1;
  vec2 w = fract(f);
  vec3 a = texelFetch(uField, clamp(i, ivec2(0), hi), 0).xyz;
  vec3 b = texelFetch(uField, clamp(i + ivec2(1, 0), ivec2(0), hi), 0).xyz;
  vec3 c = texelFetch(uField, clamp(i + ivec2(0, 1), ivec2(0), hi), 0).xyz;
  vec3 d = texelFetch(uField, clamp(i + ivec2(1, 1), ivec2(0), hi), 0).xyz;
  return mix(mix(a, b, w.x), mix(c, d, w.x), w.y);
}

// boldMin: 0 = fine minor ticks, 1 = few bold ones (the half-way marks on the speedometer)
// ceil: the speed limit as a red "ceiling" mark (-1 = none); eco: a blue band range (-1 = none)
vec3 gauge(vec3 col, vec2 p, float side, float v, vec2 warn, float nMaj, float nMin, float nSec, float mark, float boldMin, float ceil, vec2 eco) {
  vec2 q = vec2((p.x - side * GX) * side, p.y);
  vec3 o = field(q);
  float s = o.x, sd = o.y;

  // the gauge face: a soft panel that fades out towards the open centre side
  float face = o.z * smoothstep(uEnds.x - .05, uEnds.x + .15, q.x);
  col = mix(col, mix(G2 * 1.05, G0 * .7, .6 - .6 * smoothstep(0., .45, sd) + .2 * (.5 - q.y)), face * .5);
  cover(face * .3);

  // inner panel ("peninsula"): a slightly darker field whose frame runs parallel to the outline
  // (bottom, outer side, top) and fades out on the side that faces the speed
  float open = smoothstep(-.2, -.03, q.x) * o.z;
  col = mix(col, G0 * .5, smoothstep(PANEL - PX, PANEL + PX, sd) * open * .42);
  cover(smoothstep(PANEL - PX, PANEL + PX, sd) * open * .5);
  paint(col, SATIN * .55, (1. - smoothstep(.0013 - PX, .0013 + PX, abs(sd - PANEL))) * open, .12);

  if (sd < -.04 || sd > .13) return col;
  float t = s / uLT;
  float inS = smoothstep(-PX, PX, s) * (1. - smoothstep(uLT - PX, uLT + PX, s));
  float hot = isHot(t, warn) ? 1. : 0.;
  float on = step(.001, v);
  float sv = v * uLT;
  float lit = 1. - smoothstep(sv - .002, sv + .002, s);
  float dBand = abs(sd - BAND);
  vec3 zc = zoneCol(t, warn);
  float inEco = step(eco.x, t) * step(t, eco.y) * (1. - hot);

  float hw = .016;   // half width of the band

  // thin continuous line along the band's outer wall: the full range, red in the warning zone
  float track = (1. - smoothstep(.0018 - PX, .0018 + PX, abs(sd - (BAND - hw - .0012)))) * inS;
  paint(col, mix(mix(SATIN * .7, BLUE * .8, inEco), RED * .7, hot), track, .1);

  // solid band that fills up to the value, split only at the main sections
  float band = (1. - smoothstep(hw - PX, hw + PX, dBand)) * inS;
  float g = fract(t * nSec);
  float sect = smoothstep(GAP - PX, GAP + PX, min(g, 1. - g) / nSec * uLT);
  float across = clamp((sd - BAND) / hw * .5 + .5, 0., 1.);      // 0 on the outer edge, 1 on the inner
  // kept below the tone curve's knee so the mint stays saturated; the bloom adds the light
  vec3 litCol = hot > .5 && !isHot(v, warn) ? RED * .45 : mix(zc * .9, BLUE, inEco);
  litCol *= mix(.7, 1.05, smoothstep(sv - .7, sv, s)) * (1.05 - .35 * across);
  // the part still to fill is tinted red past the limit or redline, blue in the working band
  vec3 offCol = mix(mix(G3 * 1.1, BLUE * .45, inEco), RED * .5, hot);
  paint(col, offCol, band * sect * (1. - lit) * mix(.35, .45, max(hot, inEco)), 0.);
  paint(col, litCol, band * sect * lit, .7);

  // speed limit: a red bar across the band, the "ceiling" the fill runs into
  if (ceil >= 0.) {
    float dc = abs(s - ceil * uLT);
    float across3 = 1. - smoothstep(hw + .006 - PX, hw + .006 + PX, dBand);
    paint(col, RED * 1.1, (1. - smoothstep(.003 - PX, .003 + PX, dc)) * across3 * inS, .9);
  }

  // ticks on the inside
  float dMaj = abs(fract(t * nMaj + .5) - .5) / nMaj * uLT;
  float dMin = abs(fract(t * nMin + .5) - .5) / nMin * uLT;
  float majR = smoothstep(.052 - PX, .052 + PX, sd) * (1. - smoothstep(.078 - PX, .078 + PX, sd));
  float minLen = mix(.066, .071, boldMin), minW = mix(.0013, .0026, boldMin);
  float minR = smoothstep(.052 - PX, .052 + PX, sd) * (1. - smoothstep(minLen - PX, minLen + PX, sd));
  float tick = max((1. - smoothstep(.0028 - PX, .0028 + PX, dMaj)) * majR,
                   (1. - smoothstep(minW - PX, minW + PX, dMin)) * minR * mix(.7, .9, boldMin)) * inS;
  paint(col, mix(CREAM, RED, hot) * mix(.45, 1., lit), tick, .18 * lit);

  // needle: a short bright blade across the band, pointing inwards
  float dh = abs(s - sv);
  float blade = (1. - smoothstep(.0032 - PX, .0032 + PX, dh)) * smoothstep(.006 - PX, .006 + PX, sd) * (1. - smoothstep(.105 - PX, .105 + PX, sd));
  paint(col, CREAM * 1.2, blade * on, 1.);

  // set-point marker (cruise): a mint wedge outside the outline, pointing at the scale
  if (mark >= 0.) {
    float dm = abs(s - mark * uLT);
    float wm = mix(.002, .012, smoothstep(0., .026, -sd));
    float mR = smoothstep(-PX, PX, -sd) * (1. - smoothstep(.026 - PX, .026 + PX, -sd));
    paint(col, MINT * 1.1, (1. - smoothstep(wm - PX, wm + PX, dm)) * mR, .9);
  }
  return col;
}

// Readout bar: a thin rounded track, a fill that brightens towards its head, a lit head at the
// value, quarter marks, and the warning zone as a thin red rule under the track. The whole fill
// turns red only while the value itself is in the warning zone.
vec3 mini(vec3 col, vec2 p, float x0, float x1, float y, float v, vec2 warn) {
  float w = x1 - x0;
  float u = (p.x - x0) / w;
  float dy = p.y - y;
  if (u < -.05 || u > 1.05 || abs(dy) > .03) return col;
  const float R = .0045;   // track half height
  vec3 tone = isHot(v, warn) ? RED : MINT;
  float on = step(.001, v);

  float dTrack = length(vec2(p.x - clamp(p.x, x0 + R, x1 - R), dy)) - R;
  paint(col, G3 * 1.25, 1. - smoothstep(-PX, PX, dTrack), 0.);

  float vx = x0 + clamp(v, 0., 1.) * w;
  float dFill = length(vec2(p.x - clamp(p.x, x0 + R, max(x0 + R, vx - R)), dy)) - R;
  float ramp = smoothstep(0., max(v, .001), u);   // 0 at the start, 1 at the head
  paint(col, tone * mix(.45, 1.05, ramp), (1. - smoothstep(-PX, PX, dFill)) * on, mix(.15, .7, ramp));

  float dHead = length(vec2(p.x - vx, dy)) - R * 1.7;
  paint(col, mix(tone, CREAM, .35) * 1.1, (1. - smoothstep(-PX, PX, dHead)) * on, 1.);

  float q = abs(fract(u * 4. + .5) - .5) / 4. * w;
  float marks = (1. - smoothstep(.0011 - PX, .0011 + PX, q)) * step(.009, -dy) * step(-dy, .014) * step(.2, u) * step(u, .8);
  paint(col, SATIN * .45, marks, 0.);

  float zone = (isHot(u, warn) ? 1. : 0.) * step(0., u) * step(u, 1.);
  paint(col, RED * .75, (1. - smoothstep(.0012 - PX, .0012 + PX, abs(dy + .0105))) * zone, .25);
  return col;
}

// Trapezoid with a flat top and bottom (half widths: bottom r1, top r2; he = half height).
float sdTrapezoid(vec2 p, float r1, float r2, float he) {
  vec2 k1 = vec2(r2, he), k2 = vec2(r2 - r1, 2. * he);
  p.x = abs(p.x);
  vec2 ca = vec2(p.x - min(p.x, p.y < 0. ? r1 : r2), abs(p.y) - he);
  vec2 cb = p - k1 + k2 * clamp(dot(k1 - p, k2) / dot(k2, k2), 0., 1.);
  float s = cb.x < 0. && ca.y < 0. ? -1. : 1.;
  return s * sqrt(min(dot(ca, ca), dot(cb, cb)));
}

float hline(vec2 p, float y, float x0, float x1) {
  return (1. - smoothstep(.0013 - PX, .0013 + PX, abs(p.y - y))) * step(x0, p.x) * step(p.x, x1);
}

// A raised panel: soft fill, a satin edge that catches a little light, a shadow under it.
vec3 plate(vec3 col, float d, float shade) {
  col *= 1. - .35 * (1. - smoothstep(0., .03, d)) * step(0., d);
  col = mix(col, mix(G2 * 1.1, G0 * .8, shade), (1. - smoothstep(-PX, PX, d)) * .85);
  cover((1. - smoothstep(-PX, PX, d)) * .7);
  paint(col, SATIN * .75, 1. - smoothstep(.0014 - PX, .0014 + PX, abs(d)), .22);
  return col;
}

vec3 panels(vec3 col, vec2 p) {
  // top plate with DEMO / lamps, and the bottom plate with trip, odometer and average fuel
  // gear plate: its top edge sits on the line joining the two gauges' upper ends
  float top = sdTrapezoid(p - vec2(0., uGearY), .2, .29, .046) - .008;
  col = plate(col, top, smoothstep(uGearY - .05, uGearY + .05, p.y));
  // base at y -.48, level with the bottom scale line of both gauges (outline -.492 + BAND)
  float bottom = sdTrapezoid(p - vec2(0., -.396), .4, .3, .074) - .01;
  col = plate(col, bottom, smoothstep(-.31, -.47, p.y) * .6);
  // rules between the three rows on each side (the one under coolant turns red while it is hot)
  paint(col, SATIN * .5, hline(p, .046, -.835, -.455), .1);
  paint(col, SATIN * .5, hline(p, -.089, -.835, -.455), .1);
  paint(col, SATIN * .5, hline(p, .046, .49, .865), .1);
  paint(col, uMini.w > .8 ? RED * .8 : SATIN * .5, hline(p, -.089, .49, .865), uMini.w > .8 ? .5 : .1);
  // separator between the speed and the cruise line
  float fade = 1. - smoothstep(.15, .33, abs(p.x));
  paint(col, SATIN * .6, hline(p, -.172, -.33, .33) * fade, .15 * fade);
  return col;
}

// Silhouette: both gauges (outline plus a margin) and the band between them, whose top is the
// straight line joining the two gauges' upper ends.
float silhouette(vec2 p) {
  float shape = 0.;
  for (int k = 0; k < 2; k++) {
    float side = k == 0 ? -1. : 1.;
    vec3 o = field(vec2((p.x - side * GX) * side, p.y));
    shape = max(shape, smoothstep(-SHAPE_MARGIN - PX, -SHAPE_MARGIN + PX, o.y));
  }
  float topY = uEnds.z + SHAPE_MARGIN;
  return max(shape, (1. - smoothstep(topY - PX, topY + PX, p.y)) * (1. - smoothstep(.5 - PX, .5 + PX, abs(p.x))));
}

// Pebble silhouette, mirrored from its right half. The half closes along the centre line, which a
// ray going right from |x| never crosses, so only the outline itself counts.
float pebble(vec2 p) {
  vec2 q = vec2(abs(p.x), p.y);
  float d = 1e9;
  bool inside = false;
  for (int i = 0; i < 63; i++) {
    if (i >= uPebN - 1) break;
    vec2 a = uPeb[i], e = uPeb[i + 1] - a, w = q - a;
    vec2 h = w - e * clamp(dot(w, e) / dot(e, e), 0., 1.);
    d = min(d, dot(h, h));
    if ((a.y > q.y) != (uPeb[i + 1].y > q.y) && q.x < a.x + (q.y - a.y) * e.x / e.y) inside = !inside;
  }
  return smoothstep(-PX, PX, inside ? sqrt(d) : -sqrt(d));
}

void main() {
  PX = 1. / uRes.y;
  EM = 0.;
  COV = 0.;
  vec2 p = (gl_FragCoord.xy - .5 * uRes) / uRes.y;

  // console: deep green, fine brushed lines, soft light behind the centre (none over the game)
  vec3 col = mix(G1, G0, smoothstep(0., .9, length(p - vec2(0., .35))));
  col *= .94 + .06 * sin(p.y * 900.);
  col += G3 * .5 * exp(-length(p * vec2(.6, 1.)) * 2.5);
  col *= 1. - uOverlay;

  // speedometer: numbers every 10 mph, one bold mark at each 5 between them
  // with a known speed limit, everything above it becomes the warning zone
  float limit = uBar.w;
  col = gauge(col, p, -1., uBar.x, vec2(-1., limit >= 0. ? limit : 2.), 9., 18., 9., uBar.z, 1., limit, vec2(-1.));
  col = gauge(col, p, 1., uBar.y, vec2(-1., .84), 5., 25., 10., -1., 0., -1., ECO);

  col = panels(col, p);

  // must match MINIS in JS
  col = mini(col, p, -.79, -.49, .093, uMini.x, vec2(.4, 2.));
  col = mini(col, p, -.79, -.49, -.042, uMini.y, vec2(.125, 2.));
  col = mini(col, p, -.79, -.49, -.177, uMini2.x, vec2(.3, 2.));
  col = mini(col, p, .56, .865, .093, uMini.z, vec2(.15, 2.));
  col = mini(col, p, .56, .865, -.042, uMini.w, vec2(-1., .8));
  col = mini(col, p, .56, .865, -.177, uMini2.y, vec2(-1., .8));

  outColor = vec4(col, EM);
  outCover = vec4(COV, uPebN > 0 ? pebble(p) : silhouette(p), 0., 1.);
}

<script id="down-frag" type="x-shader/x-fragment">#version 300 es
// Bloom: halve the image with a soft 5-tap filter. The first step keeps only what glows.
precision highp float;
uniform sampler2D uSrc;
uniform vec2 uTexel;     // texel size of the source
uniform float uExtract;  // 1 on the first step: take colour times glow amount
in vec2 vUv;
out vec4 outColor;

vec3 tap(vec2 uv) {
  vec4 c = texture(uSrc, uv);
  return uExtract > .5 ? c.rgb * c.a : c.rgb;
}

void main() {
  vec2 h = uTexel;
  vec3 sum = tap(vUv) * 4. + tap(vUv - h) + tap(vUv + h) + tap(vUv + vec2(h.x, -h.y)) + tap(vUv - vec2(h.x, -h.y));
  outColor = vec4(sum / 8., 1.);
}
</script>

<script id="up-frag" type="x-shader/x-fragment">#version 300 es
// Bloom: double the image back with a soft 8-tap tent; added on top of the bigger level.
precision highp float;
uniform sampler2D uSrc;
uniform vec2 uTexel;     // texel size of the source
uniform float uWeight;
in vec2 vUv;
out vec4 outColor;

void main() {
  vec2 h = uTexel * .5;
  vec3 sum = texture(uSrc, vUv + vec2(-h.x * 2., 0.)).rgb
           + texture(uSrc, vUv + vec2(-h.x, h.y)).rgb * 2.
           + texture(uSrc, vUv + vec2(0., h.y * 2.)).rgb
           + texture(uSrc, vUv + vec2(h.x, h.y)).rgb * 2.
           + texture(uSrc, vUv + vec2(h.x * 2., 0.)).rgb
           + texture(uSrc, vUv + vec2(h.x, -h.y)).rgb * 2.
           + texture(uSrc, vUv + vec2(0., -h.y * 2.)).rgb
           + texture(uSrc, vUv + vec2(-h.x, -h.y)).rgb * 2.;
  outColor = vec4(sum / 12. * uWeight, 1.);
}

<script id="comp-frag" type="x-shader/x-fragment">#version 300 es
// Final pass: scene plus bloom, soft tone curve instead of a hard clip, vignette and dither.
precision highp float;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform sampler2D uCover;
uniform float uOverlay;
uniform float uBloomK;
uniform vec2 uRes;
uniform float uTime;
in vec2 vUv;
out vec4 outColor;

const float KNEE = .72;   // below this the image is untouched

float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

vec3 softClip(vec3 x) {
  vec3 over = max(x - KNEE, 0.);
  return min(x, vec3(KNEE)) + (1. - KNEE) * (1. - exp(-over / (1. - KNEE)));
}

void main() {
  vec3 b = texture(uBloom, vUv).rgb * uBloomK;
  vec3 c = softClip(texture(uScene, vUv).rgb + b);
  if (uOverlay > 1.5) {
    // shaped: the dash with its background, cut to the silhouette (premultiplied)
    vec2 p = (gl_FragCoord.xy - .5 * uRes) / uRes.y;
    c *= 1. - .2 * smoothstep(.5, 1.25, length(p * vec2(.85, 1.4)));
    float a = texture(uCover, vUv).g;
    outColor = vec4(c * a, a);
    return;
  }
  if (uOverlay > .5) {
    // premultiplied over transparency: drawn parts by their coverage, the bloom by its own light
    float a = clamp(max(texture(uCover, vUv).r, max(b.r, max(b.g, b.b)) * 1.1), 0., 1.);
    outColor = vec4(min(c, vec3(a)), a);
    return;
  }
  vec2 p = (gl_FragCoord.xy - .5 * uRes) / uRes.y;
  c *= 1. - .2 * smoothstep(.5, 1.25, length(p * vec2(.85, 1.4)));
  c += (hash(gl_FragCoord.xy + fract(uTime) * 100.) - .5) * 2. / 255.;
  outColor = vec4(c, 1.);
}

<script>
"use strict";

const ASPECT = 2.17;          // Galaxy S26 in landscape (≈ 19.5:9)
const PARAMS = new URLSearchParams(location.search);
const OVERLAY = PARAMS.has("overlay");   // see-through HUD over the game
const SHAPED = PARAMS.has("shape");      // dark dash cut to its own silhouette, transparent around it
if (OVERLAY || SHAPED) document.documentElement.classList.add("overlay");
if (SHAPED) document.documentElement.classList.add("shaped");
// "?shape=2": the pebble form, one smooth curve widest at the bottom (sides rising and rounding
// over into a nearly flat top). "?shape=1" keeps the DAF form.
const PEBBLE = PARAMS.get("shape") === "2";
const MAX_DPR = 2;            // cap render resolution to keep the shader cheap
const BLOOM_LEVELS = 6;       // each level halves the size: wider, softer glow
const BLOOM_STRENGTH = .45;
const BLOOM_UP_WEIGHT = .7;   // how much each wider level adds back

// Gauge outline in local coordinates (x points outwards from GX). Slanted edges and chamfers
// give the DAF-like shape; edit these points to reshape both gauges. Corners are rounded below.
const GX = .575;
const CORNER_R = .24;      // soft corner radius (short edges cap it, see roundCorners)
const CORNER_STEPS = 9;    // points per rounded corner
const DAF_SHAPE = [
  [-.10, -.492],   // inner end of the bottom: scale zero (leaves room for the bottom plate)
  [ .20, -.492],   // bottom edge: its scale line sits level with the base of the bottom plate
  [ .45, -.30],    // lower chamfer
  [ .47,  .14],    // outer side, leaning in a little
  [ .40,  .36],    // upper chamfer
  [ .12,  .45],    // top edge
  [-.20,  .37],    // top runs further in than the bottom and dips: scale end
];
// Pebble: half a superellipse standing on a flat bottom. x = a cos(t)^(2/NX), height = sin(t)^(2/NY):
// NX keeps the sides upright for longer, NY flattens the top. One curve, no straight runs or joints;
// only where it meets the flat bottom is the corner softened.
const PEBBLE_NX = 3.4, PEBBLE_NY = 3.4;
function pebbleCurve(a, bottom, top, tFrom, tTo, steps) {
  const out = [];
  for (let k = 0; k <= steps; k++) {
    const t = tFrom + (tTo - tFrom) * k / steps;
    const c = Math.max(0, Math.cos(t)), sn = Math.max(0, Math.sin(t));
    out.push([a * c ** (2 / PEBBLE_NX), bottom + (top - bottom) * sn ** (2 / PEBBLE_NY)]);
  }
  return out;
}
// Round off just the one corner at pts[i], where the curve stands on the flat bottom.
function softenCorner(pts, i, radius, steps) {
  return [...pts.slice(0, i - 1), ...roundCorners(pts.slice(i - 1, i + 2), radius, steps), ...pts.slice(i + 2)];
}
// silhouette: right half from the top centre round to the bottom centre, filling the screen
const PEBBLE_OUTLINE = softenCorner([...pebbleCurve(1.075, -.495, .495, Math.PI / 2, 0, 40), [0, -.495]], 40, .1, 8);
// the gauges follow the same curve a little inside it; each scale ends where it meets x = SCALE_END_X
const PEBBLE_SCALE_END_X = .375;
const PEBBLE_A = 1.05;
const PEBBLE_T_END = Math.acos((PEBBLE_SCALE_END_X / PEBBLE_A) ** (PEBBLE_NX / 2));
const PEBBLE_SHAPE = softenCorner([
  [-.10, -.47],    // inner end of the bottom: scale zero
  ...pebbleCurve(PEBBLE_A, -.47, .47, 0, PEBBLE_T_END, 24).map(([x, y]) => [x - GX, y]),
], 1, .1, CORNER_STEPS);
const SHAPE = PEBBLE ? PEBBLE_SHAPE : DAF_SHAPE;
// Replace each inner corner with an arc tangent to both edges, so the edges stay where they are.
function roundCorners(pts, radius, steps) {
  const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    const [bx, by] = pts[i];
    const l1 = Math.hypot(pts[i - 1][0] - bx, pts[i - 1][1] - by), l2 = Math.hypot(pts[i + 1][0] - bx, pts[i + 1][1] - by);
    const u1 = [(pts[i - 1][0] - bx) / l1, (pts[i - 1][1] - by) / l1], u2 = [(pts[i + 1][0] - bx) / l2, (pts[i + 1][1] - by) / l2];
    const half = Math.acos(Math.max(-1, Math.min(1, u1[0] * u2[0] + u1[1] * u2[1]))) / 2;
    const d = Math.min(radius / Math.tan(half), l1 * .45, l2 * .45);   // tangent length, kept short of the next corner
    const r = d * Math.tan(half);
    const bis = Math.hypot(u1[0] + u2[0], u1[1] + u2[1]);
    const cx = bx + (u1[0] + u2[0]) / bis * r / Math.sin(half), cy = by + (u1[1] + u2[1]) / bis * r / Math.sin(half);
    const a1 = Math.atan2(by + u1[1] * d - cy, bx + u1[0] * d - cx);
    let a2 = Math.atan2(by + u2[1] * d - cy, bx + u2[0] * d - cx);
    if (a2 - a1 > Math.PI) a2 -= 2 * Math.PI;
    if (a1 - a2 > Math.PI) a2 += 2 * Math.PI;
    for (let k = 0; k < steps; k++) {
      const a = a1 + (a2 - a1) * k / (steps - 1);
      out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}

// the pebble keeps its corners readable: smaller radius than the DAF form
// Gear plate (top centre): its top edge (centre + .054) sits level with where the scales end.
const OUTLINE = PEBBLE ? SHAPE : roundCorners(SHAPE, CORNER_R, CORNER_STEPS);
const CUM = OUTLINE.map((_, i) => OUTLINE.slice(0, i).reduce((sum, pt, j) =>
  sum + Math.hypot(OUTLINE[j + 1][0] - pt[0], OUTLINE[j + 1][1] - pt[1]), 0));
const LT = CUM[CUM.length - 1];
const GEAR_Y = PEBBLE ? OUTLINE[OUTLINE.length - 1][1] - .066 : .32;   // pebble: plate top on the scale track

// Baked outline field in local coordinates: covers the outline plus a margin.
const FIELD_BOX = [-.62, -.53, 1.2, 1.06];   // x0, y0, width, height
const FIELD_W = 720, FIELD_H = 636;           // about 1.7 thousandths per texel

// For every texel: arc length to the nearest outline point, signed distance (+ inside) and an
// inside flag for the face. Done once on the CPU so the shader only reads a texture.
function bakeField() {
  const n = OUTLINE.length;
  const segs = [];
  for (let k = 0; k < n - 1; k++) {
    const [ax, ay] = OUTLINE[k], dx = OUTLINE[k + 1][0] - ax, dy = OUTLINE[k + 1][1] - ay;
    segs.push({ ax, ay, dx, dy, len2: dx * dx + dy * dy, len: Math.hypot(dx, dy), cum: CUM[k] });
  }
  const crosses = (ax, ay, bx, by, x, y) => (ay > y) !== (by > y) && x < ax + (y - ay) * (bx - ax) / (by - ay);
  const data = new Float32Array(FIELD_W * FIELD_H * 4);
  for (let j = 0; j < FIELD_H; j++) {
    const y = FIELD_BOX[1] + (j + .5) / FIELD_H * FIELD_BOX[3];
    for (let i = 0; i < FIELD_W; i++) {
      const x = FIELD_BOX[0] + (i + .5) / FIELD_W * FIELD_BOX[2];
      let best = Infinity, s = 0, sign = 1, inside = false;
      for (let k = 0; k < segs.length; k++) {
        const g = segs[k], wx = x - g.ax, wy = y - g.ay;
        const hr = (wx * g.dx + wy * g.dy) / g.len2;
        const open = (k === 0 && hr < 0) || (k === segs.length - 1 && hr > 1);
        const h = open ? hr : Math.min(1, Math.max(0, hr));
        const ex = wx - g.dx * h, ey = wy - g.dy * h, d2 = ex * ex + ey * ey;
        if (d2 < best) {
          best = d2;
          // past the open ends the arc length runs out of range, so nothing is drawn round them
          const hs = k === 0 ? Math.min(hr, 1) : k === segs.length - 1 ? Math.max(hr, 0) : h;
          s = g.cum + hs * g.len;
          sign = g.dx * wy - g.dy * wx >= 0 ? 1 : -1;
        }
        if (crosses(g.ax, g.ay, g.ax + g.dx, g.ay + g.dy, x, y)) inside = !inside;
      }
      if (crosses(OUTLINE[n - 1][0], OUTLINE[n - 1][1], OUTLINE[0][0], OUTLINE[0][1], x, y)) inside = !inside;
      const o = (j * FIELD_W + i) * 4;
      data[o] = s;
      data[o + 1] = sign * Math.sqrt(best);
      data[o + 2] = inside ? 1 : 0;
    }
  }
  return data;
}

const GAUGES = [
  { id: "speed", side: -1, maj: 9, warn: [-1, 2], label: i => i * 10, tag: "MPH" },
  { id: "rpm",   side:  1, maj: 5, warn: [-1, .84], label: i => i * 5, tag: "×100 RPM" },
];

// Side readouts: caption (with icon) and value on one row, the bar under them. Must match mini() calls.
const ICONS = {
  air: "M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18z M12 12l4.5-4.5 M6.5 12h1 M12 6.5v1 M16.5 12h1 M12 14.5a2.5 2.5 0 1 0 0-5",
  fuel: "M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16 M3 21h12 M6.5 9h5 M14 10h2a1.5 1.5 0 0 1 1.5 1.5V17a1.5 1.5 0 0 0 3 0V8.5L18 6",
  oil: "M2.5 13h3l2-2h7l4-2.5 3 1-6.5 6.5H6.5L5 14.5H2.5z M8 11V8.5h3 M9.5 8.5V7 M21.5 14.5v2",
  temp: "M12 3v10 M9.5 15.5a2.5 2.5 0 1 0 5 0 2.5 2.5 0 0 0-5 0 M12 5h2.5 M12 8h2.5 M12 11h2.5 M3 20.5c1.5-1 3 1 4.5 0s3 1 4.5 0 3 1 4.5 0 3 1 4.5 0",
  trip: "M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18z M12 7v5l3 2",
  odo: "M9 3 5 21 M15 3l4 18 M12 4v3 M12 10.5v3 M12 17v4",
  grade: "M3 19h18V7z M15 19v-3.5",
  batt: "M3 8h18v11H3z M6 8V5.5h3V8 M15 8V5.5h3V8 M6.5 13.5h3 M14.5 13.5h3 M16 12v3",
};
// Three rows a side, spread evenly over the height of the side panel.
const MINIS = [
  { id: "air",   x0: -.835, x1: -.49, y: .093, cap: "AIR", icon: "air" },
  { id: "fuel",  x0: -.835, x1: -.49, y: -.042, cap: "FUEL", icon: "fuel" },
  { id: "batt",  x0: -.835, x1: -.49, y: -.177, cap: "BATTERY", icon: "batt" },
  { id: "oil",   x0: .515, x1: .865, y: .093, cap: "OIL PRESSURE", icon: "oil" },
  { id: "water", x0: .515, x1: .865, y: -.042, cap: "COOLANT TEMP", icon: "temp" },
  { id: "oilt",  x0: .515, x1: .865, y: -.177, cap: "OIL TEMP", icon: "temp" },
];

const TELLTALES = [
  { id: "park",   text: "PARK", c: "var(--red)" },
  { id: "jake",   text: "JAKE", c: "var(--amber)" },
  { id: "diff",   text: "DIFF", c: "var(--amber)" },
  { id: "beam",   text: "HIGH", c: "var(--blue)" },
];

const LABEL_INSET = .108;    // numbers sit this far inside the outline

const stage = document.getElementById("stage");
const canvas = document.getElementById("gl");

/* ---------- gauge outline (for labels) ---------- */

// Point on the outline at arc length s, in local coordinates, with the inward normal.
function outlineAt(s) {
  let i = 0;
  while (i < OUTLINE.length - 2 && s > CUM[i + 1]) i++;
  const [ax, ay] = OUTLINE[i], [bx, by] = OUTLINE[i + 1];
  const len = CUM[i + 1] - CUM[i];
  const h = Math.min(1, Math.max(0, (s - CUM[i]) / len));
  const dx = (bx - ax) / len, dy = (by - ay) / len;
  return { x: ax + (bx - ax) * h, y: ay + (by - ay) * h, nx: -dy, ny: dx };
}

// Point at fraction t of a gauge, moved inwards by inset, in screen coordinates.
function pointOnGauge(side, t, inset) {
  const o = outlineAt(t * LT);
  return [side * (GX + o.x + o.nx * inset), o.y + o.ny * inset];
}

/* ---------- layout ---------- */

function place(el, x, y) {
  el.style.left = (x / ASPECT + .5) * 100 + "%";
  el.style.top = (.5 - y) * 100 + "%";
}

function addEl(cls, html, x, y) {
  const el = document.createElement("div");
  el.className = "ov " + cls;
  el.innerHTML = html;
  place(el, x, y);
  stage.appendChild(el);
  return el;
}

function buildOverlay() {
  const ui = { nums: {} };
  for (const g of GAUGES) {
    ui.nums[g.id] = [];
    for (let i = 0; i <= g.maj; i++) {
      const t = i / g.maj;
      const hot = t < g.warn[0] || t > g.warn[1] + 1e-6;
      const el = addEl("num" + (hot ? " hot" : ""), g.label(i), ...pointOnGauge(g.side, t, LABEL_INSET));
      ui.nums[g.id].push({ t, el });
    }
    addEl("tag", g.tag, g.side * (GX + .02), -.25);
  }

  const svg = (name, cls = "ico") => `<svg class="${cls}" viewBox="0 0 24 24"><path d="${ICONS[name]}"/></svg>`;
  for (const m of MINIS) {
    const cap = addEl("cap lft", `${svg(m.icon)}<span>${m.cap}</span>`, m.x0, m.y + .042);
    if (m.id === "fuel") ui.range = cap.appendChild(Object.assign(document.createElement("span"), { className: "sub" }));
    ui[m.id] = addEl("val rgt", "", m.x1, m.y + .042);
  }

  // centre: gear with blinkers and D / N / R, speed, cruise line
  const arrow = d => `<svg class="blink" viewBox="0 0 24 24"><path d="${d}"/></svg>`;
  // top plate: gear between the blinkers
  ui.left = addEl("", arrow("M10 4 2 12l8 8v-5h12V9H10z"), -.165, GEAR_Y).firstChild;
  ui.right = addEl("", arrow("M14 4l8 8-8 8v-5H2V9h12z"), .165, GEAR_Y).firstChild;
  ui.gear = addEl("gear", "N", 0, GEAR_Y);
  ui.dnr = addEl("dnr", "<span>D</span><span>N</span><span>R</span>", 0, GEAR_Y - .088);
  // manual box: the knob pattern, range on the left and splitter on the right, lever cell lit
  const gate = `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="16.7" y1="25" x2="16.7" y2="75"/>`
    + `<line x1="50" y1="25" x2="50" y2="75"/><line x1="83.3" y1="25" x2="83.3" y2="75"/><line x1="16.7" y1="50" x2="83.3" y2="50"/></svg>`;
  const cell = (id, lo, hi) => `<div class="hp-cell" data-cell="${id}"><b>${lo}</b>${hi ? `<b>${hi}</b>` : ""}</div>`;
  ui.hpat = addEl("hpat",
    `<div class="hp-sel range"><i>RANGE</i><span data-v="hi">HI</span><span data-v="lo">LO</span></div>`
    + `<div class="hp-grid">${gate}${cell("R", "R1", "R2")}${cell("1", "1", "5")}${cell("3", "3", "7")}`
    + `${cell("LO", "LO", "")}${cell("2", "2", "6")}${cell("4", "4", "8")}</div>`
    + `<div class="hp-sel split"><i>SPLIT</i><span data-v="hi">H</span><span data-v="lo">L</span></div>`, 0, GEAR_Y - .107);
  ui.demo = addEl("demo", "", 0, GEAR_Y + .08);
  ui.speed = addEl("speed", "0", 0, .03);
  ui.limit = addEl("limit", "<span>SPEED</span><span>LIMIT</span><b></b>", .325, .045);
  ui.limitVal = ui.limit.querySelector("b");
  addEl("unit", "MPH", 0, -.143);
  ui.cruise = addEl("cruise", `<svg viewBox="0 0 24 24"><path d="M4.5 17a8 8 0 1 1 15 0"/><path d="M12 15.5l4-5.5"/><path d="M7 9.2l1 1M12 6.5v1.4M17 9.2l-1 1"/><path d="M5 21h6l-2-2.5" /></svg><span>CRUISE CONTROL</span><b></b><small>MPH</small>`, 0, -.228);
  ui.cruiseSet = ui.cruise.querySelector("b");

  // bottom plate: trip, odometer, road grade (average fuel was here; the panel's FUEL block has it)
  const stat = (icon, cap) => `<div class="stat">${svg(icon)}<div><div class="stat-cap">${cap}</div><div class="stat-val"></div></div></div>`;
  const stats = addEl("stats", [stat("trip", "TRIP"), stat("odo", "ODO"), stat("grade", "GRADE")].join('<div class="rule"></div>'), 0, -.396);
  [ui.trip, ui.odo, ui.grade] = stats.querySelectorAll(".stat-val");

  // lamps that are lit, either side of D / N / R
  const rows = { lft: addEl("tt-row lft", "", -.1, .232), rgt: addEl("tt-row rgt", "", .1, .232) };
  ui.tt = {};
  TELLTALES.forEach((t, i) => {
    const el = document.createElement("div");
    el.className = "tt";
    el.textContent = t.text;
    el.style.setProperty("--c", t.c);
    rows[i < 2 ? "lft" : "rgt"].appendChild(el);
    ui.tt[t.id] = el;
  });
  return ui;
}

function fitStage() {
  const w = Math.min(innerWidth, innerHeight * ASPECT);
  const h = w / ASPECT;
  stage.style.width = w + "px";
  stage.style.height = h + "px";
  stage.style.setProperty("--u", h / 100 + "px");
  const dpr = Math.min(devicePixelRatio || 1, MAX_DPR);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
}

/* ---------- WebGL2: scene, bloom, composite ---------- */

function compile(gl, type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error("Shader compile failed: " + gl.getShaderInfoLog(sh));
  return sh;
}

function makeProgram(gl, fragId) {
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, document.getElementById("vert").textContent));
  gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, document.getElementById(fragId).textContent));
  gl.bindAttribLocation(prog, 0, "aPos");
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error("Shader link failed: " + gl.getProgramInfoLog(prog));
  const cache = {};
  return { prog, u: name => cache[name] ??= gl.getUniformLocation(prog, name) };
}

function makeTexture(gl, internal, type, w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, gl.RGBA, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}

// withCover: a second 8-bit attachment that the scene pass fills with coverage (overlay alpha)
function makeTarget(gl, fmt, w, h, withCover = false) {
  const tex = makeTexture(gl, fmt.internal, fmt.type, w, h);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  let cover = null;
  if (withCover) {
    cover = makeTexture(gl, gl.RGBA8, gl.UNSIGNED_BYTE, w, h);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, cover, 0);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
  }
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error("Render target is not supported.");
  return { tex, cover, fb, w, h };
}

function freeTarget(gl, t) {
  gl.deleteTexture(t.tex);
  if (t.cover) gl.deleteTexture(t.cover);
  gl.deleteFramebuffer(t.fb);
}

function initGL() {
  const gl = canvas.getContext("webgl2", { antialias: false, alpha: OVERLAY || SHAPED, depth: false, powerPreference: "high-performance" });
  if (!gl) throw new Error("WebGL2 is not available in this browser.");
  // Half-float targets keep values above 1 for the bloom; plain 8-bit still works, just clips.
  const hdr = gl.getExtension("EXT_color_buffer_float") || gl.getExtension("EXT_color_buffer_half_float");
  const fmt = hdr ? { internal: gl.RGBA16F, type: gl.HALF_FLOAT } : { internal: gl.RGBA8, type: gl.UNSIGNED_BYTE };
  if (!hdr) console.info("No float render targets: bloom runs in 8-bit.");

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const field = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, field);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, FIELD_W, FIELD_H, 0, gl.RGBA, gl.FLOAT, bakeField());
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

  const scene = makeProgram(gl, "scene-frag");
  gl.useProgram(scene.prog);
  gl.uniform4fv(scene.u("uFieldBox"), FIELD_BOX);
  gl.uniform1f(scene.u("uLT"), LT);
  gl.uniform3f(scene.u("uEnds"), OUTLINE[0][0], OUTLINE[OUTLINE.length - 1][0], OUTLINE[OUTLINE.length - 1][1]);
  gl.uniform1i(scene.u("uPebN"), PEBBLE ? PEBBLE_OUTLINE.length : 0);
  gl.uniform1f(scene.u("uGearY"), GEAR_Y);
  if (PEBBLE) gl.uniform2fv(scene.u("uPeb"), PEBBLE_OUTLINE.flat());

  return {
    gl, fmt, field, scene,
    down: makeProgram(gl, "down-frag"), up: makeProgram(gl, "up-frag"), comp: makeProgram(gl, "comp-frag"),
    targets: null,
  };
}

// Scene target at canvas size plus the bloom chain at 1/2, 1/4 ... of it.
function ensureTargets(g) {
  const { gl } = g, w = canvas.width, h = canvas.height;
  if (g.targets && g.targets.scene.w === w && g.targets.scene.h === h) return g.targets;
  if (g.targets) [g.targets.scene, ...g.targets.levels].forEach(t => freeTarget(gl, t));
  const levels = [];
  for (let i = 1; i <= BLOOM_LEVELS; i++) levels.push(makeTarget(gl, g.fmt, Math.max(1, w >> i), Math.max(1, h >> i)));
  g.targets = { scene: makeTarget(gl, g.fmt, w, h, true), levels };
  return g.targets;
}

function bindTex(gl, unit, tex) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
}

function drawTo(gl, target) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
  gl.viewport(0, 0, target ? target.w : canvas.width, target ? target.h : canvas.height);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function render(g, now, boot) {
  const { gl } = g;
  const { scene, levels } = ensureTargets(g);

  gl.useProgram(g.scene.prog);
  bindTex(gl, 0, g.field);
  gl.uniform1i(g.scene.u("uField"), 0);
  gl.uniform2f(g.scene.u("uRes"), scene.w, scene.h);
  gl.uniform4f(g.scene.u("uBar"), smooth.speed, smooth.rpm, sim.cruise ? sim.cruiseSet / 90 : -1, sim.limit > 0 ? sim.limit / 90 : -1);
  gl.uniform4f(g.scene.u("uMini"), smooth.air, smooth.fuel, smooth.oil, smooth.water);
  gl.uniform2f(g.scene.u("uMini2"), smooth.batt, smooth.oilt);
  gl.uniform1f(g.scene.u("uOverlay"), OVERLAY ? 1 : 0);
  drawTo(gl, scene);

  gl.useProgram(g.down.prog);
  gl.uniform1i(g.down.u("uSrc"), 0);
  levels.forEach((dst, i) => {
    const src = i === 0 ? scene : levels[i - 1];
    bindTex(gl, 0, src.tex);
    gl.uniform2f(g.down.u("uTexel"), 1 / src.w, 1 / src.h);
    gl.uniform1f(g.down.u("uExtract"), i === 0 ? 1 : 0);
    drawTo(gl, dst);
  });

  gl.useProgram(g.up.prog);
  gl.uniform1i(g.up.u("uSrc"), 0);
  gl.uniform1f(g.up.u("uWeight"), BLOOM_UP_WEIGHT);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = levels.length - 2; i >= 0; i--) {
    const src = levels[i + 1];
    bindTex(gl, 0, src.tex);
    gl.uniform2f(g.up.u("uTexel"), 1 / src.w, 1 / src.h);
    drawTo(gl, levels[i]);
  }
  gl.disable(gl.BLEND);

  gl.useProgram(g.comp.prog);
  bindTex(gl, 0, scene.tex);
  bindTex(gl, 1, levels[0].tex);
  gl.uniform1i(g.comp.u("uScene"), 0);
  gl.uniform1i(g.comp.u("uBloom"), 1);
  bindTex(gl, 2, scene.cover);
  gl.uniform1i(g.comp.u("uCover"), 2);
  gl.uniform1f(g.comp.u("uOverlay"), OVERLAY ? 1 : SHAPED ? 2 : 0);
  gl.uniform1f(g.comp.u("uBloomK"), BLOOM_STRENGTH * boot);
  gl.uniform2f(g.comp.u("uRes"), canvas.width, canvas.height);
  gl.uniform1f(g.comp.u("uTime"), now);
  drawTo(gl, null);
}

/* ---------- truck state: live telemetry or a simulated demo drive ---------- */

const RATIOS = [0, 12.8, 9.25, 6.7, 4.9, 3.75, 2.73, 1.97, 1.43, 1.0, .73]; // Eaton 10-speed, approx
const RPM_PER_MPH = 30.6;   // final drive and tyre size folded into one factor
const IDLE = 650;
const CRUISE_MPH = 65;

const sim = {
  t: 0, phase: "idle", phaseT: 0, mph: 0, gear: 0, rpm: IDLE, shift: 0,
  air1: 112, compressor: true, fuel: .62, oil: 32, water: 150,
  brake: false, jake: false, cruise: false, cruiseSet: 0, left: false, right: false,
  park: true, diff: false, beam: false, odo: 482317.4, trip: 0, mpg: 6.8, grade: 0, batt: 13.9, oilt: 150, limit: 65,
};

function setPhase(name) { sim.phase = name; sim.phaseT = 0; }

function stepSim(dt) {
  const s = sim;
  s.t += dt; s.phaseT += dt;
  let accel = 0;
  s.brake = false; s.jake = false; s.cruise = false;

  if (s.phase === "idle") {
    s.left = s.phaseT > 3;
    if (s.phaseT > 6) { s.left = false; s.gear = 1; setPhase("accel"); }
  } else if (s.phase === "accel") {
    accel = s.shift > 0 ? -.15 : 3.2 / (1 + s.gear * .35);
    if (s.mph >= CRUISE_MPH) setPhase("cruise");
  } else if (s.phase === "cruise") {
    s.cruise = true;
    s.cruiseSet = CRUISE_MPH;
    accel = (CRUISE_MPH + 1.5 * Math.sin(s.t * .3) - s.mph) * .5;
    s.right = s.phaseT > 6 && s.phaseT < 11;
    if (s.phaseT > 16) { s.right = false; setPhase("decel"); }
  } else if (s.phase === "decel") {
    s.jake = true; s.brake = s.mph < 35;
    accel = s.brake ? -3 : -1.4;
    if (s.mph <= 0) setPhase("idle");
  }

  s.mph = Math.max(0, s.mph + accel * dt);
  s.shift = Math.max(0, s.shift - dt);
  const geared = g => s.mph * RATIOS[g] * RPM_PER_MPH;
  if (s.phase === "accel" && s.gear < 10 && geared(s.gear) > 1750) { s.gear++; s.shift = .5; }
  if (s.phase === "decel" && s.gear > 1 && geared(s.gear) < 1050) s.gear--;
  if (s.phase !== "accel" && s.mph < 1) s.gear = 0;

  const rpmTarget = s.gear === 0 ? IDLE : Math.max(IDLE, geared(s.gear)) + (s.jake ? 150 : 0);
  s.rpm += (rpmTarget - s.rpm) * (1 - Math.exp(-dt * 7));

  if (s.air1 < 105) s.compressor = true;
  if (s.air1 > 125) s.compressor = false;
  s.air1 = Math.min(130, s.air1 + (s.compressor ? 2.6 * dt : 0) - (s.brake ? 3.4 * dt : 0));

  s.oil = 18 + s.rpm * .022;
  s.park = s.gear === 0 && s.mph < .5;
  s.water += (192 - s.water) * dt * .04;
  s.oilt += (215 - s.oilt) * dt * .03;
  s.fuel = Math.max(0, s.fuel - dt * .0004);
  s.odo += s.mph * dt / 3600;
  s.trip += s.mph * dt / 3600;
  s.range = s.fuel * 150 * s.mpg;   // 150 gal tank
  s.grade = s.mph > 5 ? Math.round(Math.sin(s.t / 9) * 70) / 10 : null;   // rolling hills
  // "?manual" in the demo: drive the gears through an Eaton Fuller pattern (LO, 1L .. 8H)
  s.shifter = DEMO_MANUAL ? eatonDemo(s.gear) : null;
}

const DEMO_MANUAL = PARAMS.has("manual");
function eatonDemo(gear) {
  if (gear <= 0) return { cell: gear < 0 ? "R" : null, range: "lo", split: "lo", label: gear < 0 ? "R1" : "N" };
  if (gear === 1) return { cell: "LO", range: "lo", split: "hi", label: "LO" };
  const k = gear - 2, pos = Math.floor(k / 2) % 8, hi = pos >= 4, n = pos % 4 + 1;
  return { cell: String(n), range: hi ? "hi" : "lo", split: k % 2 ? "hi" : "lo", label: String(hi ? n + 4 : n) };
}

function gaugeValues(s) {
  return {
    speed: s.mph / 90, rpm: s.rpm / 2500, air: s.air1 / 150,
    fuel: s.fuel, oil: s.oil / 100, water: (s.water - 100) / 150,
    batt: (s.batt - 10) / 5, oilt: (s.oilt - 100) / 200,   // 10-15 V, 100-300 F
  };
}

const LIVE_TIMEOUT_MS = 3000;   // no game data for this long: fall back to the demo drive
const RECONNECT_MS = 2000;
let liveAt = -Infinity;

function isLive() { return performance.now() - liveAt < LIVE_TIMEOUT_MS; }

function applyLive(m) {
  Object.assign(sim, {
    mph: m.mph, rpm: m.rpm, gear: m.gear, air1: m.air_psi, fuel: m.fuel,
    oil: m.oil_psi, water: m.water_f, cruise: m.cruise, cruiseSet: m.cruise_mph,
    left: m.blinker_left, right: m.blinker_right, park: m.park_brake, jake: m.engine_brake,
    diff: m.diff_lock, beam: m.high_beam,
    odo: m.odometer_mi, trip: m.trip_mi, mpg: m.avg_mpg, grade: m.grade_pct, range: m.range_mi, shifter: m.shifter || null,
    batt: m.battery_v, oilt: m.oil_temp_f, limit: m.speed_limit_mph,
  });
  liveAt = performance.now();
}

function connectLive() {
  const ws = new WebSocket(`ws://${location.host}/ws/dash`);
  ws.onmessage = event => {
    try {
      const m = JSON.parse(event.data);
      if (m.type === "dash" && m.live) applyLive(m);
    } catch (err) {
      console.warn("Ignored bad dash message:", err.message);
    }
  };
  ws.onclose = () => setTimeout(connectLive, RECONNECT_MS);
}

/* ---------- frame loop ---------- */

// Needle follow rate per second. Live data comes at 60 Hz, so it only needs a touch of
// smoothing (~25 ms); the demo drive is gentler.
const SMOOTH_LIVE = 40;
const SMOOTH_DEMO = 10;
const BOOT_SECONDS = 2.4;   // self-test sweep on key-on
const smooth = { speed: 0, rpm: 0, air: 0, fuel: 0, oil: 0, water: 0, batt: 0, oilt: 0 };

function setText(el, text) { if (el.textContent !== text) el.textContent = text; }
function setHtml(el, html) { if (el.innerHTML !== html) el.innerHTML = html; }

function updateOverlay(ui, s, shown, booting, now) {
  setText(ui.speed, String(Math.round(s.mph)));
  // the sign flares red once the speed is over the limit by more than a mile an hour
  setText(ui.limitVal, String(s.limit || ""));
  ui.limit.classList.toggle("on", s.limit > 0);
  ui.limit.classList.toggle("over", s.limit > 0 && s.mph > s.limit + 1);
  // speed numbers above the limit read red, like the scale behind them
  for (const n of ui.nums.speed) n.el.classList.toggle("hot", s.limit > 0 && n.t * 90 > s.limit + .5);
  const sh = s.shifter;
  document.documentElement.classList.toggle("manual", Boolean(sh));
  if (sh) {
    // gear named as on the knob: 5 with the splitter as a small H / L, LO, R1 / R2
    const split = sh.split === "hi" ? "H" : sh.split === "lo" ? "L" : "";
    setHtml(ui.gear, sh.cell ? `${sh.label}<small>${split}</small>` : "N");
    for (const el of ui.hpat.querySelectorAll(".hp-cell")) {
      const on = el.dataset.cell === sh.cell;
      el.classList.toggle("on", on);
      // in the lit cell the number the range gives is the bright one (1 on LO range, 5 on HI)
      const [lo, hi] = el.querySelectorAll("b");
      lo.classList.toggle("act", on && (!hi || sh.range !== "hi"));
      if (hi) hi.classList.toggle("act", on && sh.range === "hi");
    }
    for (const el of ui.hpat.querySelectorAll(".range span")) el.classList.toggle("on", el.dataset.v === sh.range);
    for (const el of ui.hpat.querySelectorAll(".split span")) el.classList.toggle("on", el.dataset.v === sh.split);
  } else {
    setText(ui.gear, s.gear === 0 ? "N" : s.gear < 0 ? "R" : String(s.gear));
    const range = s.gear > 0 ? 0 : s.gear === 0 ? 1 : 2;
    [...ui.dnr.children].forEach((el, i) => el.classList.toggle("on", i === range));
  }
  setText(ui.cruiseSet, s.cruise ? String(s.cruiseSet) : "—");
  ui.cruise.classList.toggle("on", booting || s.cruise);
  setHtml(ui.air, `${Math.round(s.air1)}<small>PSI</small>`);
  setText(ui.fuel, Math.round(s.fuel * 100) + "%");
  setText(ui.range, s.range ? `~ ${Math.round(s.range).toLocaleString("en-US")} mi` : "");
  setHtml(ui.batt, `${s.batt.toFixed(1)}<small>V</small>`);
  setText(ui.oilt, Math.round(s.oilt) + "°F");
  ui.batt.classList.toggle("hot", s.batt < 11.5);
  ui.oilt.classList.toggle("hot", s.oilt > 260);
  setHtml(ui.oil, `${Math.round(s.oil)}<small>PSI</small>`);
  setText(ui.water, Math.round(s.water) + "°F");
  setHtml(ui.trip, `${s.trip.toFixed(1)}<small>mi</small>`);
  setHtml(ui.odo, `${Math.floor(s.odo).toLocaleString("en-US")}<small>mi</small>`);
  // + uphill, − downhill; 5 % and steeper turns amber, like the steep-grade signs
  const grade = s.grade;
  const known = grade !== null && grade !== undefined;
  setHtml(ui.grade, known ? `${grade > 0 ? "+" : grade < 0 ? "−" : ""}${Math.abs(grade).toFixed(1)}<small>%</small>` : "—<small>%</small>");
  const steep = known && Math.abs(grade) >= 5 ? "var(--amber)" : "";
  if (ui.grade.style.color !== steep) ui.grade.style.color = steep;
  ui.air.classList.toggle("hot", s.air1 < 60);
  ui.water.classList.toggle("hot", s.water > 220);
  setText(ui.demo, isLive() ? "" : "DEMO");

  for (const id of ["speed", "rpm"]) {
    for (const n of ui.nums[id]) n.el.classList.toggle("on", n.t <= shown[id] + .002);
  }

  const blinkOn = (now % .7) < .35;
  // the game already reports the blink phase; the demo blinks on its own
  const phase = isLive() || blinkOn;
  ui.left.classList.toggle("on", booting || (s.left && phase));
  ui.right.classList.toggle("on", booting || (s.right && phase));
  const tt = { park: s.park, jake: s.jake, diff: s.diff, beam: s.beam };
  for (const id in tt) ui.tt[id].classList.toggle("on", booting || tt[id]);
}

function start() {
  const ui = buildOverlay();
  fitStage();
  addEventListener("resize", fitStage);
  const g = initGL();
  let last = performance.now();
  const t0 = last;

  function frame(nowMs) {
    const dt = Math.min(.05, (nowMs - last) / 1000);
    last = nowMs;
    const now = (nowMs - t0) / 1000;
    const booting = now < BOOT_SECONDS;
    if (!booting && !isLive()) stepSim(dt);

    const target = gaugeValues(sim);
    const sweep = Math.sin(Math.PI * Math.min(now / (BOOT_SECONDS * .9), 1));
    for (const k in smooth) {
      if (booting) smooth[k] = Math.max(sweep, k === "speed" || k === "rpm" ? 0 : target[k] * (1 - sweep));
      else smooth[k] += (target[k] - smooth[k]) * (1 - Math.exp(-dt * (isLive() ? SMOOTH_LIVE : SMOOTH_DEMO)));
    }

    updateOverlay(ui, sim, smooth, booting, now);

    render(g, now, Math.min(1, now / .6));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// Keep the screen on, like a playing video does. Browsers allow it only after a tap, so the first
// tap (the same one that goes fullscreen) turns it on; it is turned on again on return to the tab.
const noSleep = typeof NoSleep === "function" ? new NoSleep() : null;
if (!noSleep) console.info("NoSleep.js did not load; the screen may turn off.");
let keepAwake = false;

async function stayAwake() {
  if (!noSleep) return;
  try {
    await noSleep.enable();
    keepAwake = true;
  } catch (err) {
    console.info("Cannot keep the screen awake yet:", err.message);
  }
}

document.addEventListener("visibilitychange", () => {
  if (keepAwake && document.visibilityState === "visible") stayAwake();
});

// Tap anywhere: go fullscreen and lock landscape (best effort, ignored where unsupported).
document.addEventListener("click", async () => {
  if (OVERLAY || window.overlayApi) return;   // inside the overlay app a click only drags the window
  stayAwake();
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen({ navigationUI: "hide" });
    await screen.orientation?.lock?.("landscape");
  } catch (err) {
    console.info("Fullscreen or orientation lock not available:", err.message);
  }
});

// Overlay app, edit mode: the wheel resizes the window, a held mouse button drags it. The pointer
// is captured, so the drag keeps going even when the cursor runs ahead of the window.
if (window.overlayApi) {
  const editing = () => document.body.classList.contains("edit");
  let drag = null;
  addEventListener("wheel", (e) => { if (editing()) window.overlayApi.resize(e.deltaY < 0 ? 1 : -1); });
  addEventListener("pointerdown", (e) => {
    if (!editing() || e.button !== 0) return;
    drag = { x: e.screenX, y: e.screenY };
    document.body.setPointerCapture(e.pointerId);
  });
  addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.screenX - drag.x, dy = e.screenY - drag.y;
    if (!dx && !dy) return;
    window.overlayApi.move(dx, dy);
    drag = { x: e.screenX, y: e.screenY };
  });
  addEventListener("pointerup", () => { drag = null; });
  addEventListener("pointercancel", () => { drag = null; });
}

try {
  start();
  connectLive();
} catch (err) {
  document.body.textContent = err.message;
  console.error(err);
}
</script>
</body>
</html>
