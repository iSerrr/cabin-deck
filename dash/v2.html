<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050806">
<title>Alpha Gen Dash v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  /* Alpha Gen v2: speed and rpm scales run round the outline of two rounded boxes,
     from the bottom centre outwards, up the outer side and back along the top.
     WebGL2 draws the scales, then a bloom pass turns their glow into light; HTML only draws text.
     Live data comes from server.py over /ws/dash; without the game it runs a demo drive. */
  :root { --cream: #E4DCC4; --mint: #7BEFB5; --amber: #FFB547; --red: #FF4A3A; --blue: #6FB6FF; --dim: rgba(228,220,196,.28); }
  html, body { margin: 0; height: 100%; background: #050806; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Saira Semi Condensed", "Arial Narrow", sans-serif; color: var(--cream);
    -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  #stage { position: relative; --u: 1px; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ov { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; line-height: 1; pointer-events: none; font-variant-numeric: tabular-nums; }
  .ov.lft { transform: translate(0, -50%); }
  .ov.rgt { transform: translate(-100%, -50%); }

  .num { font-size: calc(var(--u) * 3.8); font-weight: 500; color: var(--dim); transition: color .15s, text-shadow .15s; }
  .num.on { color: var(--cream); text-shadow: 0 0 calc(var(--u) * .8) rgba(123,239,181,.55); }
  .num.hot { color: rgba(255,74,58,.45); }
  .num.hot.on { color: var(--red); text-shadow: 0 0 calc(var(--u) * .8) rgba(255,74,58,.7); }
  .tag { font-size: calc(var(--u) * 2.2); font-weight: 700; letter-spacing: .3em; color: var(--dim); }

  .speed { font-size: calc(var(--u) * 35); font-weight: 500; transform: translate(-50%, -50%) skewX(-6deg); text-shadow: 0 0 calc(var(--u) * 2.5) rgba(123,239,181,.35); }
  .unit { font-size: calc(var(--u) * 2.6); font-weight: 700; letter-spacing: .4em; color: var(--dim); }
  .gear { font-size: calc(var(--u) * 9); font-weight: 500; color: var(--cream); }
  .rpm-big { font-size: calc(var(--u) * 6); font-weight: 500; color: var(--cream); }
  .rpm-big span { margin-left: .4em; font-size: .38em; font-weight: 700; letter-spacing: .22em; color: var(--mint); }
  /* cruise: the usual speedometer-with-arrow icon and the set speed, shown only while engaged */
  .cruise {
    display: none; align-items: center; gap: .35em;
    font-size: max(16px, calc(var(--u) * 5)); font-weight: 500; color: var(--cream);
    text-shadow: 0 0 calc(var(--u) * 1) rgba(123,239,181,.45);
  }
  .cruise.on { display: flex; }
  .cruise svg { width: 1.15em; height: 1.15em; fill: none; stroke: var(--mint); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 calc(var(--u) * .7) rgba(123,239,181,.8)); }
  .cruise small { font-size: .42em; font-weight: 700; letter-spacing: .25em; color: var(--mint); align-self: flex-end; margin-bottom: .35em; }
  .demo { font-size: max(8px, calc(var(--u) * 1.4)); font-weight: 700; letter-spacing: .3em; color: var(--dim); }

  .cap { font-size: max(9px, calc(var(--u) * 1.8)); font-weight: 700; letter-spacing: .26em; color: var(--dim); }
  .val { font-size: max(10px, calc(var(--u) * 2.6)); font-weight: 500; color: var(--cream); }
  .val.hot { color: var(--red); }

  .blink { width: calc(var(--u) * 5); height: calc(var(--u) * 5); opacity: .14; transition: opacity .06s; }
  .blink path { fill: var(--mint); }
  .blink.on { opacity: 1; filter: drop-shadow(0 0 calc(var(--u) * 1) rgba(123,239,181,.9)); }

  /* lamps sit under the speed and show only while lit */
  .tt-row { display: flex; gap: calc(var(--u) * .8); }
  .tt {
    display: none; padding: calc(var(--u) * .5) calc(var(--u) * 1); border: 1px solid; border-radius: calc(var(--u) * .6);
    font-size: max(9px, calc(var(--u) * 1.6)); font-weight: 700; letter-spacing: .2em;
  }
  .tt.on { display: block; color: var(--c); border-color: var(--c); box-shadow: 0 0 calc(var(--u) * 1.4) -0.2em var(--c), inset 0 0 calc(var(--u) * 1) -0.3em var(--c); text-shadow: 0 0 calc(var(--u) * .8) var(--c); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
</div>

<script id="vert" type="x-shader/x-vertex">#version 300 es
in vec2 aPos;
out vec2 vUv;
void main() {
  vUv = aPos * .5 + .5;
  gl_Position = vec4(aPos, 0., 1.);
}
</script>

<script id="scene-frag" type="x-shader/x-fragment">#version 300 es
// Scene pass: draws the gauges without any glow. Alpha says how strongly each pixel glows;
// the bloom passes turn that into light, so glow never stops at a hard edge.
precision highp float;

uniform vec2 uRes;
uniform vec4 uBar;              // speed 0..1, rpm 0..1, cruise mark on the speed scale (-1 = none), unused
uniform vec4 uMini;             // air, fuel, oil, water as 0..1
uniform highp sampler2D uField; // baked outline: arc length, signed distance (+ inside), inside flag
uniform vec4 uFieldBox;         // local x0, y0, width, height covered by the field
uniform float uLT;              // total arc length of the outline
uniform vec3 uEnds;             // inner start x, inner end x, inner end y (local)

out vec4 outColor;

const vec3 G0 = vec3(.027, .047, .035);   // #070C09
const vec3 G1 = vec3(.039, .106, .078);   // #0A1B14
const vec3 G2 = vec3(.055, .141, .106);   // #0E241B
const vec3 G3 = vec3(.082, .192, .149);   // #153126 brand green
const vec3 MINT = vec3(.48, .94, .71);
const vec3 CREAM = vec3(.894, .863, .769); // #E4DCC4 legend cream
const vec3 RED = vec3(1., .29, .23);
const vec3 SATIN = vec3(.58, .63, .6);

const float GX = .575;   // gauge origin, mirrored for the left gauge
const float BAND = .028; // scale centre line, this far inside the outline
const float GAP = .0035; // half width of the divider between scale sections

float PX;
float EM;   // glow amount of the current pixel

void paint(inout vec3 col, vec3 c, float m, float glow) {
  col = mix(col, c, m);
  EM = mix(EM, glow, m);
}

bool isHot(float t, vec2 warn) { return t < warn.x || t > warn.y; }

vec3 zoneCol(float t, vec2 warn) {
  return isHot(t, warn) ? RED : mix(MINT, CREAM, smoothstep(.15, 1., t) * .55);
}

// Bilinear lookup by hand: 32-bit float textures are not filterable on every phone.
vec3 field(vec2 q) {
  vec2 uv = (q - uFieldBox.xy) / uFieldBox.zw;
  if (uv.x < 0. || uv.y < 0. || uv.x > 1. || uv.y > 1.) return vec3(0., -1., 0.);
  vec2 size = vec2(textureSize(uField, 0));
  vec2 f = uv * size - .5;
  ivec2 i = ivec2(floor(f)), hi = ivec2(size) - 1;
  vec2 w = fract(f);
  vec3 a = texelFetch(uField, clamp(i, ivec2(0), hi), 0).xyz;
  vec3 b = texelFetch(uField, clamp(i + ivec2(1, 0), ivec2(0), hi), 0).xyz;
  vec3 c = texelFetch(uField, clamp(i + ivec2(0, 1), ivec2(0), hi), 0).xyz;
  vec3 d = texelFetch(uField, clamp(i + ivec2(1, 1), ivec2(0), hi), 0).xyz;
  return mix(mix(a, b, w.x), mix(c, d, w.x), w.y);
}

vec3 gauge(vec3 col, vec2 p, float side, float v, vec2 warn, float nMaj, float nMin, float nSec, float mark) {
  vec2 q = vec2((p.x - side * GX) * side, p.y);
  vec3 o = field(q);
  float s = o.x, sd = o.y;

  // the gauge face: a soft panel that fades out towards the open centre side
  float face = o.z * smoothstep(uEnds.x - .05, uEnds.x + .15, q.x);
  col = mix(col, mix(G2 * 1.05, G0 * .7, .6 - .6 * smoothstep(0., .45, sd) + .2 * (.5 - q.y)), face * .5);

  if (sd < -.04 || sd > .13) return col;
  float t = s / uLT;
  float inS = smoothstep(-PX, PX, s) * (1. - smoothstep(uLT - PX, uLT + PX, s));
  float hot = isHot(t, warn) ? 1. : 0.;
  float on = step(.001, v);
  float sv = v * uLT;
  float lit = 1. - smoothstep(sv - .002, sv + .002, s);
  float dBand = abs(sd - BAND);
  vec3 zc = zoneCol(t, warn);

  // thin continuous line: the full range of the gauge, red where the warning zone is
  float track = (1. - smoothstep(.0018 - PX, .0018 + PX, dBand)) * inS;
  paint(col, mix(SATIN * .7, RED * .7, hot), track, .1);

  // solid band that fills up to the value, split only at the main sections
  float hw = .016;
  float band = (1. - smoothstep(hw - PX, hw + PX, dBand)) * inS;
  float g = fract(t * nSec);
  float sect = smoothstep(GAP - PX, GAP + PX, min(g, 1. - g) / nSec * uLT);
  float across = clamp((sd - BAND) / hw * .5 + .5, 0., 1.);      // 0 on the outer edge, 1 on the inner
  // kept below the tone curve's knee so the mint stays saturated; the bloom adds the light
  vec3 litCol = hot > .5 && !isHot(v, warn) ? RED * .45 : zc * .9;
  litCol *= mix(.7, 1.05, smoothstep(sv - .7, sv, s)) * (1.05 - .35 * across);
  paint(col, G3 * 1.1, band * sect * (1. - lit) * .35, 0.);
  paint(col, litCol, band * sect * lit, .7);

  // ticks on the inside
  float dMaj = abs(fract(t * nMaj + .5) - .5) / nMaj * uLT;
  float dMin = abs(fract(t * nMin + .5) - .5) / nMin * uLT;
  float majR = smoothstep(.052 - PX, .052 + PX, sd) * (1. - smoothstep(.078 - PX, .078 + PX, sd));
  float minR = smoothstep(.052 - PX, .052 + PX, sd) * (1. - smoothstep(.066 - PX, .066 + PX, sd));
  float tick = max((1. - smoothstep(.0028 - PX, .0028 + PX, dMaj)) * majR,
                   (1. - smoothstep(.0013 - PX, .0013 + PX, dMin)) * minR * .7) * inS;
  paint(col, mix(CREAM, RED, hot) * mix(.45, 1., lit), tick, .18 * lit);

  // needle: a short bright blade across the band, pointing inwards
  float dh = abs(s - sv);
  float blade = (1. - smoothstep(.0032 - PX, .0032 + PX, dh)) * smoothstep(.006 - PX, .006 + PX, sd) * (1. - smoothstep(.105 - PX, .105 + PX, sd));
  paint(col, CREAM * 1.2, blade * on, 1.);

  // set-point marker (cruise): a mint wedge outside the outline, pointing at the scale
  if (mark >= 0.) {
    float dm = abs(s - mark * uLT);
    float wm = mix(.002, .012, smoothstep(0., .026, -sd));
    float mR = smoothstep(-PX, PX, -sd) * (1. - smoothstep(.026 - PX, .026 + PX, -sd));
    paint(col, MINT * 1.1, (1. - smoothstep(wm - PX, wm + PX, dm)) * mR, .9);
  }
  return col;
}

vec3 mini(vec3 col, vec2 p, float x0, float x1, float y, float v, vec2 warn) {
  float u = (p.x - x0) / (x1 - x0);
  float dy = abs(p.y - y);
  if (u < -.05 || u > 1.05 || dy > .03) return col;
  float inU = step(0., u) * step(u, 1.);
  float band = (1. - smoothstep(.007 - PX, .007 + PX, dy)) * inU;
  float g = fract(u * 24.);
  float seg = smoothstep(0., .1, g) * (1. - smoothstep(.72, .82, g));
  float hot = isHot(u, warn) ? 1. : 0.;
  float lit = 1. - smoothstep(v - .003, v + .003, u);
  vec3 off = mix(G3 * 1.6, RED * .25, hot);
  vec3 litCol = isHot(v, warn) ? RED : hot > .5 ? RED * .4 : MINT * .95;
  paint(col, off, band * seg * (1. - lit), 0.);
  paint(col, litCol, band * seg * lit, .5);
  paint(col, SATIN * .6, (1. - smoothstep(.0012 - PX, .0012 + PX, abs(p.y - y + .016))) * inU, 0.);
  return col;
}

void main() {
  PX = 1. / uRes.y;
  EM = 0.;
  vec2 p = (gl_FragCoord.xy - .5 * uRes) / uRes.y;

  // console: deep green, fine brushed lines, soft light behind the centre
  vec3 col = mix(G1, G0, smoothstep(0., .9, length(p - vec2(0., .35))));
  col *= .94 + .06 * sin(p.y * 900.);
  col += G3 * .5 * exp(-length(p * vec2(.6, 1.)) * 2.5);

  col = gauge(col, p, -1., uBar.x, vec2(-1., 2.), 9., 45., 9., uBar.z);
  col = gauge(col, p, 1., uBar.y, vec2(-1., .84), 5., 25., 10., -1.);

  // top bridge between the inner ends of the two gauges
  float bridgeY = uEnds.z - BAND, bridgeX = GX + uEnds.y;
  float bridge = (1. - smoothstep(.0018 - PX, .0018 + PX, abs(p.y - bridgeY))) * (1. - smoothstep(bridgeX - PX, bridgeX + PX, abs(p.x)));
  paint(col, SATIN * .7, bridge, .3);

  col = mini(col, p, -.84, -.44, .06, uMini.x, vec2(.4, 2.));
  col = mini(col, p, -.84, -.44, -.10, uMini.y, vec2(.125, 2.));
  col = mini(col, p, .44, .84, .02, uMini.z, vec2(.15, 2.));
  col = mini(col, p, .44, .84, -.14, uMini.w, vec2(-1., .8));

  outColor = vec4(col, EM);
}
</script>

<script id="down-frag" type="x-shader/x-fragment">#version 300 es
// Bloom: halve the image with a soft 5-tap filter. The first step keeps only what glows.
precision highp float;
uniform sampler2D uSrc;
uniform vec2 uTexel;     // texel size of the source
uniform float uExtract;  // 1 on the first step: take colour times glow amount
in vec2 vUv;
out vec4 outColor;

vec3 tap(vec2 uv) {
  vec4 c = texture(uSrc, uv);
  return uExtract > .5 ? c.rgb * c.a : c.rgb;
}

void main() {
  vec2 h = uTexel;
  vec3 sum = tap(vUv) * 4. + tap(vUv - h) + tap(vUv + h) + tap(vUv + vec2(h.x, -h.y)) + tap(vUv - vec2(h.x, -h.y));
  outColor = vec4(sum / 8., 1.);
}
</script>

<script id="up-frag" type="x-shader/x-fragment">#version 300 es
// Bloom: double the image back with a soft 8-tap tent; added on top of the bigger level.
precision highp float;
uniform sampler2D uSrc;
uniform vec2 uTexel;     // texel size of the source
uniform float uWeight;
in vec2 vUv;
out vec4 outColor;

void main() {
  vec2 h = uTexel * .5;
  vec3 sum = texture(uSrc, vUv + vec2(-h.x * 2., 0.)).rgb
           + texture(uSrc, vUv + vec2(-h.x, h.y)).rgb * 2.
           + texture(uSrc, vUv + vec2(0., h.y * 2.)).rgb
           + texture(uSrc, vUv + vec2(h.x, h.y)).rgb * 2.
           + texture(uSrc, vUv + vec2(h.x * 2., 0.)).rgb
           + texture(uSrc, vUv + vec2(h.x, -h.y)).rgb * 2.
           + texture(uSrc, vUv + vec2(0., -h.y * 2.)).rgb
           + texture(uSrc, vUv + vec2(-h.x, -h.y)).rgb * 2.;
  outColor = vec4(sum / 12. * uWeight, 1.);
}
</script>

<script id="comp-frag" type="x-shader/x-fragment">#version 300 es
// Final pass: scene plus bloom, soft tone curve instead of a hard clip, vignette and dither.
precision highp float;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform float uBloomK;
uniform vec2 uRes;
uniform float uTime;
in vec2 vUv;
out vec4 outColor;

const float KNEE = .72;   // below this the image is untouched

float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

vec3 softClip(vec3 x) {
  vec3 over = max(x - KNEE, 0.);
  return min(x, vec3(KNEE)) + (1. - KNEE) * (1. - exp(-over / (1. - KNEE)));
}

void main() {
  vec3 c = texture(uScene, vUv).rgb + texture(uBloom, vUv).rgb * uBloomK;
  c = softClip(c);
  vec2 p = (gl_FragCoord.xy - .5 * uRes) / uRes.y;
  c *= 1. - .2 * smoothstep(.5, 1.25, length(p * vec2(.85, 1.4)));
  c += (hash(gl_FragCoord.xy + fract(uTime) * 100.) - .5) * 2. / 255.;
  outColor = vec4(c, 1.);
}
</script>

<script>
"use strict";

const ASPECT = 2.17;          // Galaxy S26 in landscape (≈ 19.5:9)
const MAX_DPR = 2;            // cap render resolution to keep the shader cheap
const BLOOM_LEVELS = 6;       // each level halves the size: wider, softer glow
const BLOOM_STRENGTH = .45;
const BLOOM_UP_WEIGHT = .7;   // how much each wider level adds back

// Gauge outline in local coordinates (x points outwards from GX). Slanted edges and chamfers
// give the DAF-like shape; edit these points to reshape both gauges. Corners are rounded below.
const GX = .575;
const CORNER_R = .24;      // soft corner radius (short edges cap it, see roundCorners)
const CORNER_STEPS = 9;    // points per rounded corner
const SHAPE = [
  [-.31, -.445],   // inner end of the bottom: scale zero
  [ .20, -.445],   // bottom edge, level with the screen edge
  [ .45, -.28],    // lower chamfer
  [ .47,  .14],    // outer side, leaning in a little
  [ .40,  .36],    // upper chamfer
  [ .12,  .45],    // top edge
  [-.36,  .355],   // top runs further in than the bottom and dips: scale end
];
// Replace each inner corner with an arc tangent to both edges, so the edges stay where they are.
function roundCorners(pts, radius, steps) {
  const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    const [bx, by] = pts[i];
    const l1 = Math.hypot(pts[i - 1][0] - bx, pts[i - 1][1] - by), l2 = Math.hypot(pts[i + 1][0] - bx, pts[i + 1][1] - by);
    const u1 = [(pts[i - 1][0] - bx) / l1, (pts[i - 1][1] - by) / l1], u2 = [(pts[i + 1][0] - bx) / l2, (pts[i + 1][1] - by) / l2];
    const half = Math.acos(Math.max(-1, Math.min(1, u1[0] * u2[0] + u1[1] * u2[1]))) / 2;
    const d = Math.min(radius / Math.tan(half), l1 * .45, l2 * .45);   // tangent length, kept short of the next corner
    const r = d * Math.tan(half);
    const bis = Math.hypot(u1[0] + u2[0], u1[1] + u2[1]);
    const cx = bx + (u1[0] + u2[0]) / bis * r / Math.sin(half), cy = by + (u1[1] + u2[1]) / bis * r / Math.sin(half);
    const a1 = Math.atan2(by + u1[1] * d - cy, bx + u1[0] * d - cx);
    let a2 = Math.atan2(by + u2[1] * d - cy, bx + u2[0] * d - cx);
    if (a2 - a1 > Math.PI) a2 -= 2 * Math.PI;
    if (a1 - a2 > Math.PI) a2 += 2 * Math.PI;
    for (let k = 0; k < steps; k++) {
      const a = a1 + (a2 - a1) * k / (steps - 1);
      out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}

const OUTLINE = roundCorners(SHAPE, CORNER_R, CORNER_STEPS);
const CUM = OUTLINE.map((_, i) => OUTLINE.slice(0, i).reduce((sum, pt, j) =>
  sum + Math.hypot(OUTLINE[j + 1][0] - pt[0], OUTLINE[j + 1][1] - pt[1]), 0));
const LT = CUM[CUM.length - 1];

// Baked outline field in local coordinates: covers the outline plus a margin.
const FIELD_BOX = [-.62, -.53, 1.2, 1.06];   // x0, y0, width, height
const FIELD_W = 720, FIELD_H = 636;           // about 1.7 thousandths per texel

// For every texel: arc length to the nearest outline point, signed distance (+ inside) and an
// inside flag for the face. Done once on the CPU so the shader only reads a texture.
function bakeField() {
  const n = OUTLINE.length;
  const segs = [];
  for (let k = 0; k < n - 1; k++) {
    const [ax, ay] = OUTLINE[k], dx = OUTLINE[k + 1][0] - ax, dy = OUTLINE[k + 1][1] - ay;
    segs.push({ ax, ay, dx, dy, len2: dx * dx + dy * dy, len: Math.hypot(dx, dy), cum: CUM[k] });
  }
  const crosses = (ax, ay, bx, by, x, y) => (ay > y) !== (by > y) && x < ax + (y - ay) * (bx - ax) / (by - ay);
  const data = new Float32Array(FIELD_W * FIELD_H * 4);
  for (let j = 0; j < FIELD_H; j++) {
    const y = FIELD_BOX[1] + (j + .5) / FIELD_H * FIELD_BOX[3];
    for (let i = 0; i < FIELD_W; i++) {
      const x = FIELD_BOX[0] + (i + .5) / FIELD_W * FIELD_BOX[2];
      let best = Infinity, s = 0, sign = 1, inside = false;
      for (let k = 0; k < segs.length; k++) {
        const g = segs[k], wx = x - g.ax, wy = y - g.ay;
        const hr = (wx * g.dx + wy * g.dy) / g.len2;
        const h = Math.min(1, Math.max(0, hr));
        const ex = wx - g.dx * h, ey = wy - g.dy * h, d2 = ex * ex + ey * ey;
        if (d2 < best) {
          best = d2;
          // past the open ends the arc length runs out of range, so nothing is drawn round them
          const hs = k === 0 ? Math.min(hr, 1) : k === segs.length - 1 ? Math.max(hr, 0) : h;
          s = g.cum + hs * g.len;
          sign = g.dx * wy - g.dy * wx >= 0 ? 1 : -1;
        }
        if (crosses(g.ax, g.ay, g.ax + g.dx, g.ay + g.dy, x, y)) inside = !inside;
      }
      if (crosses(OUTLINE[n - 1][0], OUTLINE[n - 1][1], OUTLINE[0][0], OUTLINE[0][1], x, y)) inside = !inside;
      const o = (j * FIELD_W + i) * 4;
      data[o] = s;
      data[o + 1] = sign * Math.sqrt(best);
      data[o + 2] = inside ? 1 : 0;
    }
  }
  return data;
}

const GAUGES = [
  { id: "speed", side: -1, maj: 9, warn: [-1, 2], label: i => i * 10, tag: "MPH" },
  { id: "rpm",   side:  1, maj: 5, warn: [-1, .84], label: i => i * 5, tag: "×100 RPM" },
];

const MINIS = [
  { id: "air",   x0: -.84, x1: -.44, y: .06, cap: "AIR" },
  { id: "fuel",  x0: -.84, x1: -.44, y: -.10, cap: "FUEL" },
  { id: "oil",   x0: .44, x1: .84, y: .02, cap: "OIL" },
  { id: "water", x0: .44, x1: .84, y: -.14, cap: "WATER" },
];

const TELLTALES = [
  { id: "park",   text: "PARK", c: "var(--red)" },
  { id: "jake",   text: "JAKE", c: "var(--amber)" },
  { id: "diff",   text: "DIFF", c: "var(--amber)" },
  { id: "beam",   text: "HIGH", c: "var(--blue)" },
];

const LABEL_INSET = .108;    // numbers sit this far inside the outline

const stage = document.getElementById("stage");
const canvas = document.getElementById("gl");

/* ---------- gauge outline (for labels) ---------- */

// Point on the outline at arc length s, in local coordinates, with the inward normal.
function outlineAt(s) {
  let i = 0;
  while (i < OUTLINE.length - 2 && s > CUM[i + 1]) i++;
  const [ax, ay] = OUTLINE[i], [bx, by] = OUTLINE[i + 1];
  const len = CUM[i + 1] - CUM[i];
  const h = Math.min(1, Math.max(0, (s - CUM[i]) / len));
  const dx = (bx - ax) / len, dy = (by - ay) / len;
  return { x: ax + (bx - ax) * h, y: ay + (by - ay) * h, nx: -dy, ny: dx };
}

// Point at fraction t of a gauge, moved inwards by inset, in screen coordinates.
function pointOnGauge(side, t, inset) {
  const o = outlineAt(t * LT);
  return [side * (GX + o.x + o.nx * inset), o.y + o.ny * inset];
}

/* ---------- layout ---------- */

function place(el, x, y) {
  el.style.left = (x / ASPECT + .5) * 100 + "%";
  el.style.top = (.5 - y) * 100 + "%";
}

function addEl(cls, html, x, y) {
  const el = document.createElement("div");
  el.className = "ov " + cls;
  el.innerHTML = html;
  place(el, x, y);
  stage.appendChild(el);
  return el;
}

function buildOverlay() {
  const ui = { nums: {} };
  for (const g of GAUGES) {
    ui.nums[g.id] = [];
    for (let i = 0; i <= g.maj; i++) {
      const t = i / g.maj;
      const hot = t < g.warn[0] || t > g.warn[1] + 1e-6;
      const el = addEl("num" + (hot ? " hot" : ""), g.label(i), ...pointOnGauge(g.side, t, LABEL_INSET));
      ui.nums[g.id].push({ t, el });
    }
    addEl("tag", g.tag, g.side * (GX + .02), -.25);
  }

  for (const m of MINIS) {
    addEl("cap lft", m.cap, m.x0, m.y + .035);
    ui[m.id] = addEl("val rgt", "", m.x1, m.y + .035);
  }
  ui.rpm = addEl("rpm-big", "", GX + .02, .2);

  // centre: gear with blinkers, speed, cruise, lamps
  const arrow = d => `<svg class="blink" viewBox="0 0 24 24"><path d="${d}"/></svg>`;
  ui.left = addEl("", arrow("M10 4 2 12l8 8v-5h12V9H10z"), -.15, .255).firstChild;
  ui.right = addEl("", arrow("M14 4l8 8-8 8v-5H2V9h12z"), .15, .255).firstChild;
  ui.gear = addEl("gear", "N", 0, .255);
  ui.demo = addEl("demo", "", 0, .385);
  ui.speed = addEl("speed", "0", 0, .05);
  addEl("unit", "MPH", 0, -.15);
  ui.cruise = addEl("cruise", `<svg viewBox="0 0 24 24"><path d="M4.5 17a8 8 0 1 1 15 0"/><path d="M12 15.5l4-5.5"/><path d="M7 9.2l1 1M12 6.5v1.4M17 9.2l-1 1"/><path d="M5 21h6l-2-2.5" /></svg><b></b><small>MPH</small>`, 0, -.245);
  ui.cruiseSet = ui.cruise.querySelector("b");

  const row = addEl("tt-row", "", 0, -.335);
  ui.tt = {};
  for (const t of TELLTALES) {
    const el = document.createElement("div");
    el.className = "tt";
    el.textContent = t.text;
    el.style.setProperty("--c", t.c);
    row.appendChild(el);
    ui.tt[t.id] = el;
  }
  return ui;
}

function fitStage() {
  const w = Math.min(innerWidth, innerHeight * ASPECT);
  const h = w / ASPECT;
  stage.style.width = w + "px";
  stage.style.height = h + "px";
  stage.style.setProperty("--u", h / 100 + "px");
  const dpr = Math.min(devicePixelRatio || 1, MAX_DPR);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
}

/* ---------- WebGL2: scene, bloom, composite ---------- */

function compile(gl, type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error("Shader compile failed: " + gl.getShaderInfoLog(sh));
  return sh;
}

function makeProgram(gl, fragId) {
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, document.getElementById("vert").textContent));
  gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, document.getElementById(fragId).textContent));
  gl.bindAttribLocation(prog, 0, "aPos");
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error("Shader link failed: " + gl.getProgramInfoLog(prog));
  const cache = {};
  return { prog, u: name => cache[name] ??= gl.getUniformLocation(prog, name) };
}

function makeTarget(gl, fmt, w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, fmt.internal, w, h, 0, gl.RGBA, fmt.type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error("Render target is not supported.");
  return { tex, fb, w, h };
}

function freeTarget(gl, t) {
  gl.deleteTexture(t.tex);
  gl.deleteFramebuffer(t.fb);
}

function initGL() {
  const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, depth: false, powerPreference: "high-performance" });
  if (!gl) throw new Error("WebGL2 is not available in this browser.");
  // Half-float targets keep values above 1 for the bloom; plain 8-bit still works, just clips.
  const hdr = gl.getExtension("EXT_color_buffer_float") || gl.getExtension("EXT_color_buffer_half_float");
  const fmt = hdr ? { internal: gl.RGBA16F, type: gl.HALF_FLOAT } : { internal: gl.RGBA8, type: gl.UNSIGNED_BYTE };
  if (!hdr) console.info("No float render targets: bloom runs in 8-bit.");

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const field = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, field);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, FIELD_W, FIELD_H, 0, gl.RGBA, gl.FLOAT, bakeField());
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

  const scene = makeProgram(gl, "scene-frag");
  gl.useProgram(scene.prog);
  gl.uniform4fv(scene.u("uFieldBox"), FIELD_BOX);
  gl.uniform1f(scene.u("uLT"), LT);
  gl.uniform3f(scene.u("uEnds"), OUTLINE[0][0], OUTLINE[OUTLINE.length - 1][0], OUTLINE[OUTLINE.length - 1][1]);

  return {
    gl, fmt, field, scene,
    down: makeProgram(gl, "down-frag"), up: makeProgram(gl, "up-frag"), comp: makeProgram(gl, "comp-frag"),
    targets: null,
  };
}

// Scene target at canvas size plus the bloom chain at 1/2, 1/4 ... of it.
function ensureTargets(g) {
  const { gl } = g, w = canvas.width, h = canvas.height;
  if (g.targets && g.targets.scene.w === w && g.targets.scene.h === h) return g.targets;
  if (g.targets) [g.targets.scene, ...g.targets.levels].forEach(t => freeTarget(gl, t));
  const levels = [];
  for (let i = 1; i <= BLOOM_LEVELS; i++) levels.push(makeTarget(gl, g.fmt, Math.max(1, w >> i), Math.max(1, h >> i)));
  g.targets = { scene: makeTarget(gl, g.fmt, w, h), levels };
  return g.targets;
}

function bindTex(gl, unit, tex) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
}

function drawTo(gl, target) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
  gl.viewport(0, 0, target ? target.w : canvas.width, target ? target.h : canvas.height);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function render(g, now, boot) {
  const { gl } = g;
  const { scene, levels } = ensureTargets(g);

  gl.useProgram(g.scene.prog);
  bindTex(gl, 0, g.field);
  gl.uniform1i(g.scene.u("uField"), 0);
  gl.uniform2f(g.scene.u("uRes"), scene.w, scene.h);
  gl.uniform4f(g.scene.u("uBar"), smooth.speed, smooth.rpm, sim.cruise ? sim.cruiseSet / 90 : -1, 0);
  gl.uniform4f(g.scene.u("uMini"), smooth.air, smooth.fuel, smooth.oil, smooth.water);
  drawTo(gl, scene);

  gl.useProgram(g.down.prog);
  gl.uniform1i(g.down.u("uSrc"), 0);
  levels.forEach((dst, i) => {
    const src = i === 0 ? scene : levels[i - 1];
    bindTex(gl, 0, src.tex);
    gl.uniform2f(g.down.u("uTexel"), 1 / src.w, 1 / src.h);
    gl.uniform1f(g.down.u("uExtract"), i === 0 ? 1 : 0);
    drawTo(gl, dst);
  });

  gl.useProgram(g.up.prog);
  gl.uniform1i(g.up.u("uSrc"), 0);
  gl.uniform1f(g.up.u("uWeight"), BLOOM_UP_WEIGHT);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = levels.length - 2; i >= 0; i--) {
    const src = levels[i + 1];
    bindTex(gl, 0, src.tex);
    gl.uniform2f(g.up.u("uTexel"), 1 / src.w, 1 / src.h);
    drawTo(gl, levels[i]);
  }
  gl.disable(gl.BLEND);

  gl.useProgram(g.comp.prog);
  bindTex(gl, 0, scene.tex);
  bindTex(gl, 1, levels[0].tex);
  gl.uniform1i(g.comp.u("uScene"), 0);
  gl.uniform1i(g.comp.u("uBloom"), 1);
  gl.uniform1f(g.comp.u("uBloomK"), BLOOM_STRENGTH * boot);
  gl.uniform2f(g.comp.u("uRes"), canvas.width, canvas.height);
  gl.uniform1f(g.comp.u("uTime"), now);
  drawTo(gl, null);
}

/* ---------- truck state: live telemetry or a simulated demo drive ---------- */

const RATIOS = [0, 12.8, 9.25, 6.7, 4.9, 3.75, 2.73, 1.97, 1.43, 1.0, .73]; // Eaton 10-speed, approx
const RPM_PER_MPH = 30.6;   // final drive and tyre size folded into one factor
const IDLE = 650;
const CRUISE_MPH = 65;

const sim = {
  t: 0, phase: "idle", phaseT: 0, mph: 0, gear: 0, rpm: IDLE, shift: 0,
  air1: 112, compressor: true, fuel: .62, oil: 32, water: 150,
  brake: false, jake: false, cruise: false, cruiseSet: 0, left: false, right: false,
  park: true, diff: false, beam: false,
};

function setPhase(name) { sim.phase = name; sim.phaseT = 0; }

function stepSim(dt) {
  const s = sim;
  s.t += dt; s.phaseT += dt;
  let accel = 0;
  s.brake = false; s.jake = false; s.cruise = false;

  if (s.phase === "idle") {
    s.left = s.phaseT > 3;
    if (s.phaseT > 6) { s.left = false; s.gear = 1; setPhase("accel"); }
  } else if (s.phase === "accel") {
    accel = s.shift > 0 ? -.15 : 3.2 / (1 + s.gear * .35);
    if (s.mph >= CRUISE_MPH) setPhase("cruise");
  } else if (s.phase === "cruise") {
    s.cruise = true;
    s.cruiseSet = CRUISE_MPH;
    accel = (CRUISE_MPH + 1.5 * Math.sin(s.t * .3) - s.mph) * .5;
    s.right = s.phaseT > 6 && s.phaseT < 11;
    if (s.phaseT > 16) { s.right = false; setPhase("decel"); }
  } else if (s.phase === "decel") {
    s.jake = true; s.brake = s.mph < 35;
    accel = s.brake ? -3 : -1.4;
    if (s.mph <= 0) setPhase("idle");
  }

  s.mph = Math.max(0, s.mph + accel * dt);
  s.shift = Math.max(0, s.shift - dt);
  const geared = g => s.mph * RATIOS[g] * RPM_PER_MPH;
  if (s.phase === "accel" && s.gear < 10 && geared(s.gear) > 1750) { s.gear++; s.shift = .5; }
  if (s.phase === "decel" && s.gear > 1 && geared(s.gear) < 1050) s.gear--;
  if (s.phase !== "accel" && s.mph < 1) s.gear = 0;

  const rpmTarget = s.gear === 0 ? IDLE : Math.max(IDLE, geared(s.gear)) + (s.jake ? 150 : 0);
  s.rpm += (rpmTarget - s.rpm) * (1 - Math.exp(-dt * 7));

  if (s.air1 < 105) s.compressor = true;
  if (s.air1 > 125) s.compressor = false;
  s.air1 = Math.min(130, s.air1 + (s.compressor ? 2.6 * dt : 0) - (s.brake ? 3.4 * dt : 0));

  s.oil = 18 + s.rpm * .022;
  s.park = s.gear === 0 && s.mph < .5;
  s.water += (192 - s.water) * dt * .04;
  s.fuel = Math.max(0, s.fuel - dt * .0004);
}

function gaugeValues(s) {
  return {
    speed: s.mph / 90, rpm: s.rpm / 2500, air: s.air1 / 150,
    fuel: s.fuel, oil: s.oil / 100, water: (s.water - 100) / 150,
  };
}

const LIVE_TIMEOUT_MS = 3000;   // no game data for this long: fall back to the demo drive
const RECONNECT_MS = 2000;
let liveAt = -Infinity;

function isLive() { return performance.now() - liveAt < LIVE_TIMEOUT_MS; }

function applyLive(m) {
  Object.assign(sim, {
    mph: m.mph, rpm: m.rpm, gear: m.gear, air1: m.air_psi, fuel: m.fuel,
    oil: m.oil_psi, water: m.water_f, cruise: m.cruise, cruiseSet: m.cruise_mph,
    left: m.blinker_left, right: m.blinker_right, park: m.park_brake, jake: m.engine_brake,
    diff: m.diff_lock, beam: m.high_beam,
  });
  liveAt = performance.now();
}

function connectLive() {
  const ws = new WebSocket(`ws://${location.host}/ws/dash`);
  ws.onmessage = event => {
    try {
      const m = JSON.parse(event.data);
      if (m.type === "dash" && m.live) applyLive(m);
    } catch (err) {
      console.warn("Ignored bad dash message:", err.message);
    }
  };
  ws.onclose = () => setTimeout(connectLive, RECONNECT_MS);
}

/* ---------- frame loop ---------- */

// Needle follow rate per second. Live data comes at 60 Hz, so it only needs a touch of
// smoothing (~25 ms); the demo drive is gentler.
const SMOOTH_LIVE = 40;
const SMOOTH_DEMO = 10;
const BOOT_SECONDS = 2.4;   // self-test sweep on key-on
const smooth = { speed: 0, rpm: 0, air: 0, fuel: 0, oil: 0, water: 0 };

function setText(el, text) { if (el.textContent !== text) el.textContent = text; }
function setHtml(el, html) { if (el.innerHTML !== html) el.innerHTML = html; }

function updateOverlay(ui, s, shown, booting, now) {
  setText(ui.speed, String(Math.round(s.mph)));
  setText(ui.gear, s.gear === 0 ? "N" : s.gear < 0 ? "R" : String(s.gear));
  setHtml(ui.rpm, `${Math.round(s.rpm / 10) * 10}<span>RPM</span>`);
  setText(ui.cruiseSet, String(s.cruiseSet));
  ui.cruise.classList.toggle("on", booting || s.cruise);
  setText(ui.air, Math.round(s.air1) + " PSI");
  setText(ui.fuel, Math.round(s.fuel * 100) + "%");
  setText(ui.oil, Math.round(s.oil) + " PSI");
  setText(ui.water, Math.round(s.water) + "°F");
  ui.air.classList.toggle("hot", s.air1 < 60);
  ui.water.classList.toggle("hot", s.water > 220);
  setText(ui.demo, isLive() ? "" : "DEMO");

  for (const id of ["speed", "rpm"]) {
    for (const n of ui.nums[id]) n.el.classList.toggle("on", n.t <= shown[id] + .002);
  }

  const blinkOn = (now % .7) < .35;
  // the game already reports the blink phase; the demo blinks on its own
  const phase = isLive() || blinkOn;
  ui.left.classList.toggle("on", booting || (s.left && phase));
  ui.right.classList.toggle("on", booting || (s.right && phase));
  const tt = { park: s.park, jake: s.jake, diff: s.diff, beam: s.beam };
  for (const id in tt) ui.tt[id].classList.toggle("on", booting || tt[id]);
}

function start() {
  const ui = buildOverlay();
  fitStage();
  addEventListener("resize", fitStage);
  const g = initGL();
  let last = performance.now();
  const t0 = last;

  function frame(nowMs) {
    const dt = Math.min(.05, (nowMs - last) / 1000);
    last = nowMs;
    const now = (nowMs - t0) / 1000;
    const booting = now < BOOT_SECONDS;
    if (!booting && !isLive()) stepSim(dt);

    const target = gaugeValues(sim);
    const sweep = Math.sin(Math.PI * Math.min(now / (BOOT_SECONDS * .9), 1));
    for (const k in smooth) {
      if (booting) smooth[k] = Math.max(sweep, k === "speed" || k === "rpm" ? 0 : target[k] * (1 - sweep));
      else smooth[k] += (target[k] - smooth[k]) * (1 - Math.exp(-dt * (isLive() ? SMOOTH_LIVE : SMOOTH_DEMO)));
    }

    updateOverlay(ui, sim, smooth, booting, now);

    render(g, now, Math.min(1, now / .6));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// Tap anywhere: go fullscreen and lock landscape (best effort, ignored where unsupported).
document.addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen({ navigationUI: "hide" });
    await screen.orientation?.lock?.("landscape");
  } catch (err) {
    console.info("Fullscreen or orientation lock not available:", err.message);
  }
});

try {
  start();
  connectLive();
} catch (err) {
  document.body.textContent = err.message;
  console.error(err);
}
</script>
