<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Cab Deck Console</title>
<style>
  :root { --bg: #08090B; --card: #12141A; --line: #232733; --text: #E6E8EE; --dim: #7C8294;
          --green: #3DDC84; --amber: #F5A524; --red: #F05252; --grey: #6B7280; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; gap: 12px;
         padding: 14px 16px; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0 6px 0 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 10px; }
  .badge { padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: 13px; border: 1px solid currentColor; }
  .badge.green { color: var(--green); } .badge.amber { color: var(--amber); }
  .badge.red { color: var(--red); } .badge.grey { color: var(--grey); }
  .badge.dry { color: #7AA2F7; }
  .badge[hidden] { display: none; }
  .spacer { flex: 1; }
  button { background: #1B1F2A; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
           padding: 7px 16px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: #252B3A; }
  button:disabled { opacity: .35; cursor: default; }
  #notice { min-height: 20px; color: var(--amber); }
  main { display: flex; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  #tablet { flex: 1.3; min-width: 0; }
  #side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .qrs { display: flex; gap: 14px; flex-wrap: wrap; }
  .qr { text-align: center; }
  .qr img { width: 220px; height: 220px; background: #fff; border-radius: 6px; display: block; image-rendering: pixelated; }
  .qr .name { font-weight: 600; margin-bottom: 6px; }
  .qr code { display: block; margin-top: 6px; font: 12px ui-monospace, Consolas, monospace; color: var(--dim); }
  .empty { color: var(--dim); padding: 70px 0; text-align: center; width: 100%; }
  #addresses { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  #addresses[hidden] { display: none; }
  #addresses button { padding: 3px 10px; font-size: 12px; }
  #addresses button.on { border-color: var(--green); color: var(--green); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
  dt { color: var(--dim); } dd { margin: 0; overflow-wrap: anywhere; }
  dd.err { color: var(--red); }
  #health.stale dd { opacity: .45; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .hint { color: var(--dim); font-size: 12px; }
  #logcard { flex: 1; min-height: 120px; display: flex; flex-direction: column; padding: 10px 14px; }
  #log { flex: 1; overflow: auto; margin: 0; background: #050608; border-radius: 8px; padding: 8px 10px;
         font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .l-error { color: var(--red); } .l-warn { color: var(--amber); }
</style>
</head>
<body>
<header>
  <h1>Cab Deck Console</h1>
  <span id="state" class="badge grey">Starting…</span>
  <span id="dry" class="badge dry" hidden>DRY RUN</span>
  <span class="spacer"></span>
  <button id="start" disabled>Start</button>
  <button id="stop" disabled>Stop</button>
  <button id="restart" disabled>Restart</button>
</header>
<div id="notice"></div>

<main>
  <section id="tablet" class="card">
    <h2>Open on the tablet</h2>
    <div id="addresses" hidden></div>
    <div id="qrs" class="qrs"></div>
  </section>
  <div id="side">
    <section class="card">
      <h2>Server</h2>
      <dl id="health">
        <dt>Input</dt><dd id="h-input">—</dd>
        <dt>Game</dt><dd id="h-game">—</dd>
        <dt>Panels</dt><dd id="h-clients">—</dd>
        <dt>Dashes</dt><dd id="h-dash">—</dd>
        <dt>Pressed</dt><dd id="h-pressed">—</dd>
        <dt>Uptime</dt><dd id="h-uptime">—</dd>
        <dt>Commit</dt><dd id="h-commit">—</dd>
        <dt>Last error</dt><dd id="h-error">—</dd>
      </dl>
    </section>
    <section class="card">
      <h2>Overlay</h2>
      <div class="row"><button id="ov-toggle">Hide overlay</button><span class="hint">Ctrl+Shift+F9</span></div>
      <div class="row"><button id="ov-edit">Edit overlay</button><span class="hint">Ctrl+Shift+F10</span></div>
    </section>
  </div>
</main>

<section id="logcard" class="card">
  <h2 id="logtitle">Server output</h2>
  <pre id="log"></pre>
</section>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const api = window.consoleApi;

const STATES = {
  unavailable: ["Python environment not found", "red"],
  stopped: ["Stopped", "grey"],
  starting: ["Starting…", "amber"],
  running: ["Running", "green"],
  stopping: ["Stopping…", "amber"],
  crashed: ["Crashed", "red"],
  attached: ["Attached (started outside the console)", "amber"],
};
const ENABLED = {
  start: ["stopped", "crashed", "unavailable"],
  stop: ["starting", "running", "attached"],
  restart: ["running", "attached", "crashed"],
};

let last = null;

function text(el, value, cls) {
  el.textContent = value;
  el.className = cls || "";
}

function formatUptime(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  const pad = (n) => String(n).padStart(2, "0");
  return `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
}

function renderHeader(s) {
  const [label, color] = STATES[s.state] || [s.state, "grey"];
  const badge = $("state");
  badge.textContent = s.state === "crashed" && s.exitCode ? `Crashed (${s.exitCode})` : label;
  badge.className = `badge ${color}`;
  $("dry").hidden = !s.dryRun;
  for (const name of Object.keys(ENABLED)) $(name).disabled = s.probing || !ENABLED[name].includes(s.state);
  $("notice").textContent = s.notice || "";
}

function renderHealth(s) {
  const h = s.health;
  const stale = s.healthAgeS > 0;
  $("health").className = h && !stale ? "" : "stale";
  if (!h) {
    for (const id of ["input", "game", "clients", "dash", "pressed", "uptime", "commit", "error"]) text($(`h-${id}`), "—");
    if (stale) text($("h-input"), `not answering for ${s.healthAgeS} s`);
    return;
  }
  let game = "not connected";
  if (h.game && h.game.telemetry) game = h.game.paused ? "paused" : h.game.active ? "connected" : "not connected";
  text($("h-input"), stale ? `not answering for ${s.healthAgeS} s` : h.input);
  text($("h-game"), game);
  text($("h-clients"), String(h.clients));
  text($("h-dash"), String(h.dash_clients));
  text($("h-pressed"), h.pressed && h.pressed.length ? h.pressed.join(", ") : "none");
  text($("h-uptime"), formatUptime(h.uptime_s));
  text($("h-commit"), h.commit || "—");
  text($("h-error"), h.last_error || "—", h.last_error ? "err" : "");
}

function emptyQr(message) {
  const div = document.createElement("div");
  div.className = "empty";
  div.textContent = message;
  return div;
}

function qrCard(name, item) {
  const card = document.createElement("div");
  card.className = "qr";
  const title = document.createElement("div");
  title.className = "name";
  title.textContent = name;
  const img = document.createElement("img");
  img.src = item.dataUrl;
  img.alt = `${name} QR code`;
  const url = document.createElement("code");
  url.textContent = item.url;
  card.append(title, img, url);
  return card;
}

function renderQr(s) {
  const box = $("qrs");
  const chooser = $("addresses");
  box.replaceChildren();
  chooser.hidden = true;
  const h = s.health;
  const running = s.state === "running" || s.state === "attached";
  if (running && h && Array.isArray(h.addresses) && !h.addresses.length) {
    box.append(emptyQr("No LAN address found. Is the PC on the network?"));
  } else if (running && h && !Array.isArray(h.addresses)) {
    box.append(emptyQr("This server is too old to report its addresses; restart it from the console."));
  } else if (s.qrError && running && h) {
    box.append(emptyQr(s.qrError));
  } else if (!s.qr) {
    box.append(emptyQr("Start the server to see the QR codes"));
  } else {
    if (s.qr.addresses.length > 1) {
      chooser.replaceChildren();
      for (const address of s.qr.addresses) {
        const b = document.createElement("button");
        b.textContent = address;
        if (address === s.qr.address) b.className = "on";
        b.addEventListener("click", () => api.setAddress(address));
        chooser.append(b);
      }
      chooser.hidden = false;
    }
    box.append(qrCard("Panel", s.qr.panel), qrCard("Dash v2", s.qr.dash2));
  }
}

function render(s) {
  last = s;
  renderHeader(s);
  renderHealth(s);
  renderQr(s);
  $("ov-toggle").textContent = s.overlay.visible ? "Hide overlay" : "Show overlay";
  $("ov-edit").textContent = s.overlay.editing ? "Done editing" : "Edit overlay";
}

function renderLog(log) {
  const el = $("log");
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 24;
  $("logtitle").textContent = log.source === "server" ? "Server output" : log.source;
  const frag = document.createDocumentFragment();
  for (const line of log.lines) {
    const row = document.createElement("div");
    row.textContent = line || " ";
    if (line.includes("ERROR")) row.className = "l-error";
    else if (line.includes("WARNING")) row.className = "l-warn";
    frag.append(row);
  }
  el.replaceChildren(frag);
  if (atBottom) el.scrollTop = el.scrollHeight;
}

$("start").addEventListener("click", () => api.start());
$("stop").addEventListener("click", () => api.stop());
$("restart").addEventListener("click", () => api.restart());
$("ov-toggle").addEventListener("click", () => api.toggleOverlay());
$("ov-edit").addEventListener("click", () => api.toggleOverlayEdit());

api.onSnapshot(render);
api.onLog(renderLog);
api.getSnapshot().then((s) => { if (s && !last) render(s); });
</script>
</body>
</html>
